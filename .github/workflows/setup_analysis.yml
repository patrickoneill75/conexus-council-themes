name: Full re-analysis

# Triggered from the control panel's "Run full re-analysis" button (workflow_dispatch
# via the GitHub API), or by hand from the Actions tab. No inputs — it always reads
# data/feedback_log.json.
on:
  workflow_dispatch:

concurrency:
  group: themes-analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # See update_dashboard.yml -- the commit step below rebases onto origin/main
          # on a rejected push, which needs real (non-shallow) history to do.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Synthesize every quarter already in the Feedback Log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/setup_analysis.py

      - name: Commit site
        # Runs even if the previous step failed: it publishes each quarter as it goes
        # (real Claude calls, real cost), so a failure partway through a long re-analysis
        # shouldn't discard whatever quarters already succeeded before it.
        if: always()
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Full re-analysis of council-themes.json"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not push after 5 attempts -- main keeps moving faster than this run can catch up."
                exit 1
              fi
              echo "Push rejected (attempt $attempt/5) -- rebasing onto the current main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi
          # Pushing with GITHUB_TOKEN deliberately does not re-trigger GitHub workflows,
          # but Cloudflare redeploys the Worker from this push through its own Git
          # integration.
