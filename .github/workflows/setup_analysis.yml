name: Full re-analysis

# Triggered from the control panel's "Run full re-analysis" button (workflow_dispatch
# via the GitHub API), or by hand from the Actions tab. No inputs — it always reads
# whichever tracker file is currently selected in the control panel.
on:
  workflow_dispatch:

concurrency:
  group: themes-analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Synthesize every quarter already in the tracker
        env:
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/setup_analysis.py

      - name: Commit site
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Full re-analysis of council-themes.json"
            git push
          fi
          # Pushing with GITHUB_TOKEN deliberately does not re-trigger GitHub workflows,
          # but Cloudflare redeploys the Worker from this push through its own Git
          # integration.
