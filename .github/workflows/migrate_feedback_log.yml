name: Migrate feedback log (one-time)

# One-off: seeds data/feedback_log.json and data/taxonomy.json from the historical
# tracker.xlsx in Box, so QoQ/YoY comparisons have real history to compute against.
# No inputs, no button in the control panel -- triggered once via the GitHub Actions
# API, then this workflow (and scripts/migrate_feedback_log.py) gets deleted.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Seed the Feedback Log and taxonomy from tracker.xlsx
        env:
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
        run: python scripts/migrate_feedback_log.py

      - name: Commit data
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Migrate Feedback Log and taxonomy from tracker.xlsx"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not push after 5 attempts -- main keeps moving faster than this run can catch up."
                exit 1
              fi
              echo "Push rejected (attempt $attempt/5) -- rebasing onto the current main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi
