name: Update quant dashboard

# Triggered from the control panel's "Update Dashboard" button (workflow_dispatch via
# the GitHub API), or by hand from the Actions tab. No inputs — it always re-reads
# whichever Quant Data Folder is currently selected in the control panel.
on:
  workflow_dispatch:

concurrency:
  group: quant-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild quant-dashboard.json
        env:
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
        run: python scripts/update_quant_dashboard.py

      - name: Commit site
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update quant-dashboard.json"
            git push
          fi
          # Pushing with GITHUB_TOKEN deliberately does not re-trigger GitHub workflows,
          # but Cloudflare redeploys the Worker from this push through its own Git
          # integration.
