name: PCN Issue Map -- run

# Triggered from a project's control panel "Run pipeline" button (POST
# /api/pcn/projects/<id>/run), or by hand from the Actions tab. project_id says
# which walled-off project to process -- pcn/pipeline/run.py auto-detects every
# "pending" meeting for THAT project itself (same convention update_dashboard.yml
# already established here), pulling everything it needs from Box through the
# Worker's relay routes and pushing the updated ledger/issues/resolutions/network/
# timeline straight back the same way. Nothing here touches this git repository --
# unlike update_dashboard.yml/consensus_analyze.yml, PCN's output lives entirely in
# Box + Workers KV, so there's no public/ file to commit.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Which PCN Issue Map project to process (its id, e.g. 'pcn')"
        required: true
        type: string

concurrency:
  # Scoped per project so one project's run never has to wait behind another's --
  # they're walled off from each other precisely so this can happen concurrently.
  group: pcn-run-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Process every pending meeting for this project
        env:
          PCN_PROJECT_ID: ${{ inputs.project_id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
        run: python -m pcn.pipeline.run
