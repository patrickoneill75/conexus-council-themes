name: Refresh dashboard

# Triggered from the control panel's "Refresh Dashboard" button (workflow_dispatch via
# the GitHub API), or by hand from the Actions tab. No inputs -- it re-reads the Data
# Folder's three fixed-name files and merges the result in, no new upload needed. Use
# this after editing something directly in Box (deleting a meeting's rows out of
# Post-Meeting Survey.csv does not remove it from the published dashboard).
on:
  workflow_dispatch:

concurrency:
  group: themes-analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # See update_dashboard.yml -- the commit step below rebases onto origin/main
          # on a rejected push, which needs real (non-shallow) history to do.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild the quant dashboard from current Box contents
        env:
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
        run: python scripts/refresh_dashboard.py

      - name: Commit site
        # Consistent with the other two workflows' commit steps -- see update_dashboard.yml.
        if: always()
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh quant dashboard"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not push after 5 attempts -- main keeps moving faster than this run can catch up."
                exit 1
              fi
              echo "Push rejected (attempt $attempt/5) -- rebasing onto the current main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi
          # Pushing with GITHUB_TOKEN deliberately does not re-trigger GitHub workflows,
          # but Cloudflare redeploys the Worker from this push through its own Git
          # integration.
