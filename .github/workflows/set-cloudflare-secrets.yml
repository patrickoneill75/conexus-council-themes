name: Set Cloudflare secrets

# Sets the Worker's runtime secrets without needing a terminal on your computer.
#
# You store the values as GitHub repository secrets (a web form), then run this from the
# Actions tab. It hands them to Cloudflare for you.
#
# Requires these GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens ("Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare > Workers & Pages > Account details
#   PANEL_GITHUB_TOKEN     your fine-grained GitHub token (optional — skipped if unset)
#   BOX_CLIENT_ID          from the Box app's Configuration tab (optional)
#   BOX_CLIENT_SECRET      from the Box app's Configuration tab (optional)
#   BOX_RELAY_SECRET       a random string you make up (optional); also needs to exist as
#                          a repository secret of the same name, since refresh.yml sends it
#   poneill_password       (optional) bootstraps the first admin account -- see SETUP.md's
#                          "The admin hub" section. Only used once: the Worker seeds
#                          poneill@conexusindiana.com's account from it the first time
#                          anyone hits an /api/beta/* route, then never reads it again.
#                          Every admin after that (including a new password for this same
#                          account, if it's ever reset) is set up through /admin/login.html
#                          itself, not a secret. Every mini app's control panel, including
#                          Council Themes/Quant's own, signs in through these accounts --
#                          there is no per-app password any more.
#   consensus_claude_api   (optional) the Consensus mini app's own Claude key -- see
#                          SETUP.md. Needed here because the live follow-up-question
#                          chat runs in the Worker itself (it has to respond while a
#                          respondent is waiting); also needs to exist as a plain
#                          repository secret of the same name, since
#                          consensus_analyze.yml's batch analysis reads it too.
#   job_description_claude_api  (optional) the Job Description Updater's own Claude
#                          key -- see SETUP.md. Needed here for the same reason as
#                          consensus_claude_api: both live Claude calls (the pre-read on
#                          upload, and the final outputs) run in the Worker itself while
#                          the employer is sitting in the chat waiting. Unlike Consensus,
#                          nothing else reads this key -- there's no separate batch
#                          script for this app -- so it only needs to exist here, not
#                          also as a plain repository secret.
#   apprenticeship_claude_api   (optional) the Apprenticeship Readiness Toolbox's own
#                          Claude key -- see SETUP.md. Needed here because both of its
#                          Claude calls run in the Worker while a respondent waits: one
#                          reads each answer as it arrives, and one writes the improvement
#                          areas at the end. Like job_description_claude_api, nothing else
#                          reads it, so it only needs to exist here.
#
# Note: GitHub refuses to create any secret whose name begins with GITHUB_, which is why
# the token is stored as PANEL_GITHUB_TOKEN here. It still reaches the Worker as
# GITHUB_TOKEN, which is what the code reads.

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check what was provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required value is present."

      - name: Send GITHUB_TOKEN to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.PANEL_GITHUB_TOKEN }}
        # Checked in the shell rather than a step-level `if`, because the secrets context
        # is not dependably available there and would fail in a confusing way.
        run: |
          if [ -z "$VALUE" ]; then
            echo "PANEL_GITHUB_TOKEN is not set — skipping it for now."
            echo "The password alone is enough to sign in. Add the token later and re-run this."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put GITHUB_TOKEN

      - name: Send BOX_CLIENT_ID to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.BOX_CLIENT_ID }}
        run: |
          if [ -z "$VALUE" ]; then
            echo "BOX_CLIENT_ID is not set — skipping. Box login won't work until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put BOX_CLIENT_ID

      - name: Send BOX_CLIENT_SECRET to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.BOX_CLIENT_SECRET }}
        run: |
          if [ -z "$VALUE" ]; then
            echo "BOX_CLIENT_SECRET is not set — skipping. Box login won't work until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put BOX_CLIENT_SECRET

      - name: Send BOX_RELAY_SECRET to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.BOX_RELAY_SECRET }}
        # This same value also needs to exist as a plain repository secret named
        # BOX_RELAY_SECRET — this step only sends it to the Worker side; refresh.yml
        # reads the repository copy.
        run: |
          if [ -z "$VALUE" ]; then
            echo "BOX_RELAY_SECRET is not set — skipping. The refresh workflow won't be able to reach Box until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put BOX_RELAY_SECRET

      - name: Send poneill_password to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.poneill_password }}
        # Only needed once, to bootstrap the first admin account -- see SETUP.md.
        run: |
          if [ -z "$VALUE" ]; then
            echo "poneill_password is not set — skipping. The admin hub's first account won't be seeded until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put poneill_password

      - name: Send consensus_claude_api to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.consensus_claude_api }}
        # This same value also needs to exist as a plain repository secret named
        # consensus_claude_api -- this step only sends it to the Worker side;
        # consensus_analyze.yml reads the repository copy for the batch analysis.
        run: |
          if [ -z "$VALUE" ]; then
            echo "consensus_claude_api is not set — skipping. The Consensus mini app's chat won't be able to generate follow-up questions until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put consensus_claude_api

      - name: Send job_description_claude_api to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.job_description_claude_api }}
        # Only needs to exist here -- unlike consensus_claude_api, no separate batch
        # script also reads a repository copy of this one.
        run: |
          if [ -z "$VALUE" ]; then
            echo "job_description_claude_api is not set — skipping. The Job Description Updater won't be able to read uploads or generate outputs until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put job_description_claude_api

      - name: Send apprenticeship_claude_api to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.apprenticeship_claude_api }}
        # Only needs to exist here -- like job_description_claude_api, no batch script
        # reads a repository copy of this one.
        run: |
          if [ -z "$VALUE" ]; then
            echo "apprenticeship_claude_api is not set — skipping. The Apprenticeship Readiness Toolbox can't score answers or write improvement areas until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put apprenticeship_claude_api

      - name: What to do next
        run: |
          echo "Done. Open https://<your-worker>.workers.dev/api/config-check"
          echo "You are looking for \"buttons_configured\": true and \"box_kv_bound\": true"
