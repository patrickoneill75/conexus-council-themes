name: Update dashboard

# Triggered from the control panel's single "Update Dashboard" button (workflow_dispatch
# via the GitHub API), or by hand from the Actions tab. No inputs -- it auto-detects
# every meeting in the Data Folder's Post-Meeting Survey export that isn't in
# data/feedback_log.json yet (resolving Year/Quarter/Region per meeting from the
# Council Meeting Helper export), extracts and synthesizes themes for each one, then
# rebuilds the quant dashboard from the same two files.
on:
  workflow_dispatch:

concurrency:
  group: themes-analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract themes for new meetings and rebuild the quant dashboard
        env:
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_dashboard.py

      - name: Commit site and data
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          # data/ doesn't exist until the Feedback Log migration has run once (or this
          # run itself creates it) -- `git add` on a path that doesn't exist on disk at
          # all is a hard error that aborts the whole command, unlike a path that exists
          # but has nothing new in it, so this can't be a plain `git add public/ data/`.
          git add public/
          if [ -d data ]; then git add data/; fi
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update dashboard"
            git push
          fi
          # Pushing with GITHUB_TOKEN deliberately does not re-trigger GitHub workflows,
          # but Cloudflare redeploys the Worker from this push through its own Git
          # integration.
