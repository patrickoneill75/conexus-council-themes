name: Update dashboard

# Triggered from the control panel's single "Update Dashboard" button (workflow_dispatch
# via the GitHub API), or by hand from the Actions tab. No inputs -- it auto-detects
# every meeting in the Data Folder's Post-Meeting Survey export that isn't in
# data/feedback_log.json yet (resolving Year/Quarter/Region per meeting from the
# Council Meeting Helper export), extracts and synthesizes themes for each one, then
# rebuilds the quant dashboard from the same two files.
on:
  workflow_dispatch:

concurrency:
  group: themes-analyze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1 clone -- the commit step
          # below rebases onto origin/main if something else (another run, a PR merge)
          # pushed in the meantime, and rebasing across two independently-shallow
          # histories doesn't work. This repo is small enough that the extra clone
          # cost isn't worth avoiding for that.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract themes for new meetings and rebuild the quant dashboard
        env:
          BOX_RELAY_URL: ${{ secrets.BOX_RELAY_URL }}
          BOX_RELAY_SECRET: ${{ secrets.BOX_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_dashboard.py

      - name: Commit site and data
        # Runs even if the previous step failed: it processes every new meeting's
        # themes (real Claude calls, real cost) before rebuilding the quant dashboard,
        # and those two halves are independent -- a quant-side failure (e.g. a missing
        # Content Categories.xlsx) shouldn't discard already-successful, already-paid-for
        # theme extractions sitting in the runner's working directory. Whatever got
        # written to public/ and data/ before the failure still gets committed; anything
        # that never got processed simply isn't there yet, to be picked up next run.
        if: always()
        run: |
          git config user.name  "themes-bot"
          git config user.email "actions@github.com"
          # data/ doesn't exist until the Feedback Log migration has run once (or this
          # run itself creates it) -- `git add` on a path that doesn't exist on disk at
          # all is a hard error that aborts the whole command, unlike a path that exists
          # but has nothing new in it, so this can't be a plain `git add public/ data/`.
          git add public/
          if [ -d data ]; then git add data/; fi
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update dashboard"
            # Retries on a non-fast-forward push: something else (another run, a PR
            # merge) reached origin/main first. Since this commit only ever touches
            # public/ and data/, rebasing onto the new tip applies cleanly in the
            # overwhelming majority of cases; a real conflict (the rare case of two
            # runs changing the exact same key) fails the step loudly rather than
            # guessing which side should win.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not push after 5 attempts -- main keeps moving faster than this run can catch up."
                exit 1
              fi
              echo "Push rejected (attempt $attempt/5) -- rebasing onto the current main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi
          # Pushing with GITHUB_TOKEN deliberately does not re-trigger GitHub workflows,
          # but Cloudflare redeploys the Worker from this push through its own Git
          # integration.
