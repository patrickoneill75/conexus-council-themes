<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact Catalogue — Connector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 8h14v4H9zM9 14h14v10H9z' fill='white'/%3E%3C/svg%3E">
<style>html { visibility: hidden; }</style>
<script src="/tier-gate.js" data-app="artifacts"></script>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5;
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:32px 20px 64px; }
  header { margin-bottom:22px; }
  h1 { font-size:22px; font-weight:650; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:13px; margin:0; max-width:70ch; }
  [hidden] { display:none !important; }
  .empty-note { color:var(--text-muted); font-size:13.5px; padding:40px 4px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:12px;
          padding:18px 20px; display:flex; flex-direction:column; gap:8px; text-decoration:none;
          color:inherit; transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .card h3 { margin:0; font-size:15px; }
  .card p { margin:0; font-size:12.5px; color:var(--text-secondary); flex:1; }
  .card .view { font-size:12.5px; color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Artifact Catalogue</h1>
    <p class="sub">Self-contained Claude artifacts, hosted natively here.</p>
  </header>
  <div id="grid" class="grid"></div>
  <p id="emptyNote" class="empty-note" hidden>No public artifacts yet.</p>
</div>

<script>
(function () {
  "use strict";
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  fetch("/api/artifacts/list").then(function (r) { return r.json(); }).then(function (data) {
    var artifacts = data.artifacts || [];
    var grid = document.getElementById("grid");
    if (!artifacts.length) {
      document.getElementById("emptyNote").hidden = false;
      return;
    }
    grid.innerHTML = artifacts.map(function (a) {
      return '<a class="card" href="/artifacts/view.html?slug=' + encodeURIComponent(a.slug) + '">' +
        "<h3>" + esc(a.title) + "</h3>" +
        (a.description ? "<p>" + esc(a.description) + "</p>" : "<p></p>") +
        '<span class="view">View &rarr;</span></a>';
    }).join("");
  }).catch(function () {
    document.getElementById("emptyNote").hidden = false;
    document.getElementById("emptyNote").textContent = "Could not load the catalogue.";
  });
})();
</script>
</body>
</html>
