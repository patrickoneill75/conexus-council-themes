<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprenticeship Readiness Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307214E'/%3E%3Cpath d='M8 20l5-9 5 9z' fill='%23FBAE40'/%3E%3Crect x='17' y='17' width='7' height='3' rx='1.5' fill='white'/%3E%3Crect x='17' y='22' width='7' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/apprenticeship/brand.css">
<script src="/apprenticeship/session.js"></script>
<style>
  .wrap { max-width:860px; }
  .assessment { border:1px solid var(--border); border-radius:12px; padding:18px 20px;
                margin-top:14px; background:var(--surface-1); }
  .assessment .name { font-weight:650; color:var(--navy); font-size:15.5px; }
  .assessment .meta { font-size:12.5px; color:var(--text-muted); margin-top:8px; }
  .section-block { margin-top:16px; }
  .section-block .head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .section-block .n { font-weight:650; font-size:13.5px; color:var(--navy); }
  .section-block .v { font-weight:700; font-size:13.5px; color:var(--accent); white-space:nowrap; }
  .combined { margin-top:22px; }
  .pending { border-left:4px solid var(--amber); background:rgba(251,174,64,.10);
             border-radius:10px; padding:14px 16px; font-size:13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span id="whoami"></span>
    <button type="button" class="link" id="signOutBtn">Sign out</button>
  </div>
  <header>
    <div class="title-block">
      <h1>Apprenticeship Readiness Dashboard</h1>
      <p class="sub" id="subline">Loading…</p>
    </div>
  </header>
  <div id="body"></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var session = window.ApprenticeshipSession;

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  el("signOutBtn").addEventListener("click", function () {
    session.clear();
    window.location.replace("/apprenticeship/account.html");
  });

  if (!session.token()) { session.requireSignIn("/apprenticeship/dashboard.html"); return; }

  /* ---------- one step's score line, gate marker and to-do list ---------- */

  /** The bar, with a marker above it at the score that opens the next step. */
  function gaugeHtml(percent, threshold) {
    var goal = threshold > 0
      ? '<div class="goal" style="left:' + Number(threshold) + '%">'
        + '<span class="goal-label">' + esc(threshold) + '%</span>'
        + '<span class="goal-mark"></span></div>'
      : "";
    return '<div class="gauge">' + goal
      + '<div class="track"><div class="fill" style="width:' + Number(percent) + '%"></div></div>'
      + "</div>";
  }

  function sectionScoreHtml(section) {
    return '<div class="section-block"><div class="head">'
      + '<span class="n">' + esc(section.name) + "</span>"
      + '<span class="v">' + esc(section.displayNow) + "</span></div>"
      + '<div class="track"><div class="fill" style="width:' + Number(section.percentNow) + '%"></div></div>'
      + "</div>";
  }

  /**
   * Somewhere to go and read up on the thing they just said they don't have. The Worker
   * only ever stores an http or https link (see safeUrl in src/apprenticeship.js), and
   * the link opens in its own tab so it doesn't take them out of the dashboard.
   */
  function resourceHtml(item) {
    if (!item.resourceUrl || !item.resourceName) return "";
    return '<div class="todo-resource"><a href="' + esc(item.resourceUrl)
      + '" target="_blank" rel="noopener noreferrer">Click here to discover '
      + esc(item.resourceName) + "</a></div>";
  }

  /**
   * Every to-do item across the step, grouped by the section it came from, behind one
   * collapsed summary. The count is the headline because that is what someone checks when
   * they open the dashboard; the list itself is one click away.
   */
  function todoPackHtml(assessment) {
    var sections = (assessment.sections || []).filter(function (s) {
      return (s.improvements || []).length;
    });
    var total = assessment.todoTotal || 0;
    var done = assessment.todoDone || 0;
    if (!total) {
      return '<div class="todo-pack"><div class="todo-empty">Nothing on your to-do list for '
        + "this step.</div></div>";
    }

    var left = total - done;
    var summary = left
      ? left + " item" + (left === 1 ? "" : "s") + " on your to-do list"
      : "All " + total + " items done";
    // Open by default. The steps are tabs now, so the list is not something you scroll
    // past on the way to the next step -- it is the working surface of the tab you are on.
    var html = '<details class="todo-pack" open><summary><span>' + esc(summary) + "</span>"
      + '<span class="sub">' + done + " of " + total + " ticked"
      + (assessment.threshold > 0 && assessment.overall
          && assessment.overall.percent < assessment.threshold
          ? " · ticking these off raises your score" : "")
      + "</span></summary><div class=\"todo-body\">";

    sections.forEach(function (section) {
      html += '<div class="todo-group"><h5>' + esc(section.name) + "</h5>";
      section.improvements.forEach(function (item) {
        html += '<label class="todo-item' + (item.done ? " done" : "") + '">'
          + '<input type="checkbox" data-survey="' + esc(assessment.surveyId) + '"'
          + ' data-item="' + esc(item.id) + '"' + (item.done ? " checked" : "") + ">"
          + "<span>" + esc(item.text) + "</span></label>"
          + resourceHtml(item);
      });
      html += "</div>";
    });
    return html + "</div></details>";
  }

  /* ---------- one step ---------- */

  function assessmentHtml(a) {
    var link = "/apprenticeship/respond.html?survey=" + encodeURIComponent(a.surveyId);
    var html = '<div class="assessment' + (a.locked ? " locked" : "") + '">'
      + '<div class="step-head"><span class="name">' + esc(a.surveyName) + "</span></div>";

    if (a.locked) {
      html += '<div class="lock-note"><b>Locked.</b> '
        + (a.lockedUntil > 0
            ? "Reach " + esc(a.lockedUntil) + "% on " + esc(a.lockedBy) + " to open this step."
            : "Finish " + esc(a.lockedBy) + " to open this step.")
        + "</div></div>";
      return html;
    }
    if (a.placeholder) {
      html += '<div class="lock-note">This step isn\u2019t ready yet. Conexus Indiana will '
        + "open it when it is \u2014 there is nothing for you to do here for now.</div></div>";
      return html;
    }

    if (a.status === "complete" && a.overall) {
      // The readiness percentage belongs to the step, and sits with it -- not as one
      // number at the top of the page that could be read as applying to everything.
      html += '<div class="step-score"><span class="pct">' + esc(a.overall.percent) + "%</span>"
        + '<span class="pill ' + esc(a.overall.band) + '">' + esc(a.overall.bandLabel) + "</span>"
        + '<span class="of">' + esc(a.overall.display) + " points</span></div>"
        + gaugeHtml(a.overall.percent, a.threshold);

      if (a.threshold > 0) {
        var met = a.overall.percent >= a.threshold;
        html += '<div class="threshold-note' + (met ? " met" : "") + '">'
          + (met
              ? "You have passed the " + esc(a.threshold) + "% needed to open the next step."
              : "You need " + esc(a.threshold) + "% to open the next step. Tick items off "
                + "your to-do list and this rises — you do not have to sit it again.")
          + "</div>";
      }
      if (a.baseOverall && a.baseOverall.percent !== a.overall.percent) {
        html += '<div class="meta">Scored ' + esc(a.baseOverall.percent)
          + "% when you answered; " + esc(a.overall.percent) + "% with what you have ticked off since.</div>";
      }
      html += '<div class="meta">Finished ' + esc(String(a.submittedAt || "").slice(0, 10))
        + ' · <a class="link" href="' + link + '">Take it again</a></div>';
      (a.sections || []).forEach(function (section) { html += sectionScoreHtml(section); });
      html += todoPackHtml(a);
    } else if (a.status === "in-progress") {
      html += '<div class="meta"><a class="link" href="' + link
        + '">Pick up where you left off</a></div>';
    } else {
      html += '<div class="meta">' + a.questionCount + " question"
        + (a.questionCount === 1 ? "" : "s") + ' · <a class="link" href="' + link
        + '">Start this step</a></div>';
    }
    return html + "</div>";
  }

  /**
   * A project is a tab per step, not a page you scroll.
   *
   * Every step gets a tab from the first day, including ones nobody has built yet, so a
   * respondent can see the shape of the programme rather than only the step in front of
   * them. A locked tab is greyed and cannot be opened -- the Worker refuses a locked step
   * anyway, so this is the courtesy, not the enforcement.
   */
  var selectedStep = {};

  function defaultStep(project) {
    if (selectedStep[project.id]) return selectedStep[project.id];
    // Coming back from finishing an assessment: land on the step just completed.
    var fromUrl = new URLSearchParams(window.location.search).get("survey");
    if (fromUrl) {
      var match = project.assessments.filter(function (a) { return a.surveyId === fromUrl; })[0];
      if (match) return match.step;
    }
    var open = project.assessments.filter(function (a) { return !a.locked && !a.placeholder; });
    var unfinished = open.filter(function (a) { return a.status !== "complete"; })[0];
    return (unfinished || open[open.length - 1] || project.assessments[0] || { step: 1 }).step;
  }

  function projectHtml(project) {
    var current = defaultStep(project);
    var html = '<div class="card" data-project="' + esc(project.id) + '">'
      + "<h2>" + esc(project.name || "Your assessments") + "</h2>";
    if (project.description) html += '<p class="desc">' + esc(project.description) + "</p>";

    html += '<div class="steptabs" role="tablist">';
    project.assessments.forEach(function (a) {
      var state = a.locked ? "locked" : (a.step === current ? "active" : "");
      var note = a.locked
        ? (a.lockedUntil > 0
            ? "Reach " + a.lockedUntil + "% on " + a.lockedBy + " to open this step"
            : "Finish " + a.lockedBy + " to open this step")
        : (a.placeholder ? "Not ready yet" : a.surveyName);
      html += '<button type="button" class="steptab ' + state + '" role="tab"'
        + ' data-project="' + esc(project.id) + '" data-step="' + a.step + '"'
        + (a.locked ? " disabled" : "")
        + ' title="' + esc(note) + '">'
        + "<span>Step " + a.step + "</span>"
        + '<span class="sub">'
        + esc(a.locked ? "Locked" : (a.placeholder ? "Coming soon" : a.surveyName)) + "</span>"
        + "</button>";
    });
    html += "</div>";

    project.assessments.forEach(function (a) {
      html += '<div class="steppanel"' + (a.step === current ? "" : " hidden")
        + ' data-panel="' + a.step + '">' + assessmentHtml(a) + "</div>";
    });

    // The combined figure sits after the steps, not above them: each step has its own
    // percentage now, and a second number at the top was being read as the one that matters.
    html += '<div class="combined">';
    if (project.overall) {
      html += '<div class="band"><div class="score">' + esc(project.overall.percent) + "%</div>"
        + '<div class="label">' + esc(project.overall.bandLabel) + "</div>"
        + '<div class="sub">Combined across all ' + project.assessments.length
        + " steps \u00b7 " + esc(project.overall.display) + " points</div></div>";
    } else {
      var left = project.assessments.length - project.completedCount;
      html += '<div class="pending"><b>Combined readiness isn\u2019t ready yet.</b> '
        + "Finish the remaining " + left + " step" + (left === 1 ? "" : "s")
        + " and it will appear here.</div>";
    }
    return html + "</div></div>";
  }

  // Switching tab is presentation only -- nothing is fetched, and which tab you were on
  // survives the redraw after ticking an item.
  el("body").addEventListener("click", function (event) {
    var tab = event.target.closest && event.target.closest(".steptab");
    if (!tab || tab.disabled) return;
    var projectId = tab.getAttribute("data-project");
    var step = Number(tab.getAttribute("data-step"));
    selectedStep[projectId] = step;
    var card = tab.closest("[data-project]");
    Array.prototype.forEach.call(card.querySelectorAll(".steptab"), function (b) {
      b.classList.toggle("active", Number(b.getAttribute("data-step")) === step && !b.disabled);
    });
    Array.prototype.forEach.call(card.querySelectorAll(".steppanel"), function (panel) {
      panel.hidden = Number(panel.getAttribute("data-panel")) !== step;
    });
  });

  /** Which to-do lists were expanded, so a redraw after a tick doesn't fold them shut. */
  function openPacks() {
    var open = {};
    Array.prototype.forEach.call(document.querySelectorAll(".todo-pack[open]"), function (node) {
      var box = node.querySelector("input[data-survey]");
      if (box) open[box.getAttribute("data-survey")] = true;
    });
    return open;
  }
  function restorePacks(open) {
    Array.prototype.forEach.call(document.querySelectorAll(".todo-pack"), function (node) {
      var box = node.querySelector("input[data-survey]");
      if (box && open[box.getAttribute("data-survey")]) node.open = true;
    });
  }

  function render(data) {
    var wasOpen = openPacks();
    el("whoami").textContent = data.account.name + " · " + data.account.company;
    if (!data.projects.length) {
      el("subline").textContent = "";
      el("body").innerHTML = '<div class="card"><h2>Nothing here yet</h2><p class="desc">'
        + "Once you start an assessment, it and the rest of its programme will show up "
        + "here. Use the link Conexus Indiana sent you to begin.</p></div>";
      return;
    }
    var totalDone = data.projects.reduce(function (n, p) { return n + p.completedCount; }, 0);
    var totalAll = data.projects.reduce(function (n, p) { return n + p.assessments.length; }, 0);
    el("subline").textContent = totalDone + " of " + totalAll + " step"
      + (totalAll === 1 ? "" : "s") + " complete.";
    el("body").innerHTML = data.projects.map(projectHtml).join("");
    restorePacks(wasOpen);
  }

  // Ticking an item can open the next step, so the server sends the whole dashboard back
  // and the page redraws from it. The box is disabled meanwhile and restored on failure,
  // so it never sits ticked next to a score that did not move.
  el("body").addEventListener("change", function (event) {
    var box = event.target;
    if (!box || box.type !== "checkbox" || !box.getAttribute("data-item")) return;
    var wanted = box.checked;
    box.disabled = true;
    session.api("account/todo", {
      method: "POST",
      body: JSON.stringify({
        surveyId: box.getAttribute("data-survey"),
        itemId: box.getAttribute("data-item"),
        done: wanted,
      }),
    }).then(render).catch(function (e) {
      if (e && e.message === "Not signed in") return;
      box.checked = !wanted;
      box.disabled = false;
      window.alert(e.message);
    });
  });

  session.api("account/dashboard").then(render).catch(function (e) {
    if (e && e.message === "Not signed in") return; // api() is already redirecting
    el("subline").textContent = "";
    el("body").innerHTML = '<div class="card">' + esc(e.message) + "</div>";
  });
})();
</script>
</body>
</html>
