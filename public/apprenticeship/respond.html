<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprenticeship Readiness</title>
<script src="/apprenticeship/session.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307214E'/%3E%3Cpath d='M8 20l5-9 5 9z' fill='%23FBAE40'/%3E%3Crect x='17' y='17' width='7' height='3' rx='1.5' fill='white'/%3E%3Crect x='17' y='22' width='7' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<style>
  /* Conexus Indiana brand palette -- navy headings, brand blue accent, amber used once
     as the standout. Aptos with the documented fallbacks. */
  :root {
    color-scheme: light;
    --page:#f3f5f9; --surface-1:#ffffff; --navy:#07214e; --text-primary:#16202b;
    --text-secondary:#4a5663; --text-muted:#7c8794; --border:#e1e2e9;
    --wash:#f3f5f9; --accent:#325eae; --teal:#108fc2; --amber:#fbae40; --bad:#f26b43;
    --bot-bg:#eef1f7; --user-bg:rgba(50,94,174,.12);
    /* The one colour outside the brand list. Green carries "nothing to do here" in a way
       no brand colour does, and the alternative was using teal for both that and the
       secondary accent. Chosen muted enough to sit beside navy and amber. */
    --green:#1f8a5b;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:15px/1.55 Aptos,"Segoe UI",Arial,sans-serif; display:flex; flex-direction:column; }
  .wrap { max-width:680px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column;
          min-height:100vh; background:var(--surface-1); }
  header { padding:18px 22px 15px; border-bottom:1px solid var(--border); background:var(--navy);
           color:#fff; }
  .brand-name { font-weight:700; font-size:19px; letter-spacing:.01em; }
  .brand-sub { font-size:11px; font-weight:600; color:rgba(255,255,255,.72);
               text-transform:uppercase; letter-spacing:.06em; margin:3px 0 9px; }
  h1 { font-size:15px; font-weight:400; margin:0; color:rgba(255,255,255,.92); }
  .who { font-size:11.5px; color:rgba(255,255,255,.72); margin-top:8px; }
  .who a { color:#fff; text-decoration:underline; }
  .progress-bar { padding:11px 22px; border-bottom:1px solid var(--border); background:var(--wash); }
  .progress-bar-track { width:100%; height:6px; border-radius:999px; background:#dfe3ec; overflow:hidden; }
  .progress-bar-fill { height:100%; width:0; background:var(--accent); border-radius:999px;
                       transition:width .4s ease; }
  .progress-bar-label { font-size:11.5px; color:var(--text-secondary); margin-top:6px; font-weight:600; }
  .messages { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:12px; }
  .bubble { max-width:84%; padding:11px 15px; border-radius:14px; font-size:14.5px; white-space:pre-wrap; }
  .bubble.bot { align-self:flex-start; background:var(--bot-bg); border-bottom-left-radius:4px; }
  .bubble.section { align-self:stretch; max-width:100%; background:var(--navy); color:#fff;
                    font-weight:650; border-radius:10px; border-left:4px solid var(--amber); }
  .bubble.user { align-self:flex-end; background:var(--user-bg); border-bottom-right-radius:4px; }
  .bubble.typing { align-self:flex-start; background:var(--bot-bg); border-bottom-left-radius:4px;
                   color:var(--text-muted); font-style:italic; }
  .composer { border-top:1px solid var(--border); padding:14px 22px; display:flex; gap:10px;
              background:var(--wash); }
  .composer textarea { flex:1; font:inherit; padding:10px 13px; border-radius:10px;
                       border:1px solid var(--border); background:var(--surface-1);
                       color:var(--text-primary); resize:none; min-height:44px; max-height:150px; }
  .composer button { font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--accent);
                     cursor:pointer; padding:0 22px; background:var(--accent); color:#fff; }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  /* The wait after the last answer is the longest in the assessment -- scoring plus the
     written improvement list -- so it gets a bar and a plain description of what is
     happening, not a "…" that could equally mean the page has hung. */
  .analyzing { width:100%; max-width:100%; }
  .an-label { font-weight:650; font-size:14px; }
  .an-track { height:6px; border-radius:999px; background:#dfe3ec; overflow:hidden; margin:9px 0 7px; }
  .an-fill { height:100%; width:0; background:var(--accent); border-radius:999px;
             transition:width .45s ease; }
  .an-sub { font-size:12.5px; color:var(--text-secondary); }
  .panel { margin:22px; padding:22px; border:1px solid var(--border); border-radius:12px;
           background:var(--surface-1); }
  .panel h2 { margin:0 0 6px; font-size:16px; color:var(--navy); }
  .panel p.desc { margin:0 0 16px; font-size:13.5px; color:var(--text-secondary); }
  label { display:block; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
          color:var(--text-muted); font-weight:700; margin:14px 0 6px; }
  label:first-of-type { margin-top:0; }
  input[type=text], input[type=email] { width:100%; font:inherit; padding:10px 12px;
    border-radius:8px; border:1px solid var(--border); background:var(--page); color:var(--text-primary); }
  button.primary { font:inherit; font-weight:600; border-radius:9px; border:1px solid var(--accent);
                   cursor:pointer; padding:11px 22px; background:var(--accent); color:#fff;
                   margin-top:18px; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; }
  .notice { margin:44px 24px; padding:22px; border:1px solid var(--border); border-radius:12px;
            background:var(--surface-1); font-size:14px; text-align:center;
            color:var(--text-secondary); }
  /* results */
  .band { border-radius:12px; padding:20px 22px; color:#fff; background:var(--navy);
          border-left:6px solid var(--amber); }
  .band .score { font-size:32px; font-weight:700; line-height:1.1; }
  .band .label { font-size:15px; font-weight:650; margin-top:4px; }
  .band .sub { font-size:12.5px; color:rgba(255,255,255,.76); margin-top:6px; }
  .sec { border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-top:14px; }
  .sec .head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .sec .name { font-weight:650; color:var(--navy); font-size:14.5px; }
  .sec .num { font-weight:700; font-size:15px; color:var(--accent); white-space:nowrap; }
  .sec .track { height:6px; border-radius:999px; background:#e7eaf1; margin:10px 0 12px; overflow:hidden; }
  .sec .fill { height:100%; background:var(--teal); border-radius:999px; }
  .sec ul { margin:0; padding-left:20px; font-size:13.5px; color:var(--text-secondary); }
  .sec li { margin:5px 0; }
  /* Two columns: what is already fine on the right in green, what to do next on the left
     in amber. Stacked on a phone, done side by side wherever there is room. */
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:660px) { .cols { grid-template-columns:1fr; } }
  .col { border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .col h4 { margin:0 0 3px; font-size:12px; font-weight:700; letter-spacing:.04em;
            text-transform:uppercase; }
  .col .count { font-size:11.5px; color:var(--text-muted); margin:0 0 9px; }
  .col ul { margin:0; padding-left:18px; font-size:13px; }
  .col li { margin:5px 0; }
  .col.todo { border-left:4px solid var(--amber); }
  .col.todo h4 { color:#8a5c05; }
  .col.strength { border-left:4px solid var(--green); }
  .col.strength h4 { color:#146b48; }
  .col .none { font-size:12.5px; color:var(--text-muted); margin:0; }
  .callout { margin-top:16px; padding:14px 16px; border-radius:10px; font-size:13.5px;
             background:rgba(251,174,64,.14); border:1px solid var(--amber); color:var(--text-primary); }
  .foot { margin-top:18px; font-size:13px; }
  .foot a { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-name">Apprenticeship Readiness Toolbox</div>
    <div class="brand-sub">Conexus Indiana</div>
    <h1 id="surveyTitle">Loading…</h1>
    <div class="who" id="who" hidden></div>
  </header>

  <div class="progress-bar" id="progressBar" hidden>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-bar-label" id="progressLabel"></div>
  </div>

  <!-- Name, company and email come from the account rather than being typed again at
       the top of every assessment -- they are what ties three assessments to one
       dashboard, so they cannot be different each time. -->
  <div class="panel" id="intake" hidden>
    <h2 id="intakeHeading">Before we start</h2>
    <p class="desc" id="intakeIntro"></p>
    <div class="err" id="intakeError" hidden></div>
    <button type="button" class="primary" id="startBtn">Start the assessment</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer" id="composer" hidden>
    <textarea id="answerInput" placeholder="Type your answer…" rows="1"></textarea>
    <button type="button" id="sendBtn">Send</button>
  </div>

  <div id="results" hidden></div>
  <div id="notice" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(window.location.search);
  var surveyId = params.get("survey");
  var responseId = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function showNotice(text) {
    el("intake").hidden = true;
    el("composer").hidden = true;
    el("notice").hidden = false;
    el("notice").innerHTML = '<div class="notice">' + esc(text) + "</div>";
  }
  if (!surveyId) { showNotice("No assessment specified."); return; }

  // .messages is a flex:1 sibling of .composer, so showing or hiding the composer (and
  // the textarea growing to a second line) changes how much of .messages is visible --
  // every one of those has to scroll again afterwards or the newest bubble sits behind
  // the composer instead of above it.
  function scrollToBottom() { el("messages").scrollTop = el("messages").scrollHeight; }

  function addBubble(kind, text) {
    var b = document.createElement("div");
    b.className = "bubble " + kind;
    b.textContent = text;
    el("messages").appendChild(b);
    scrollToBottom();
    return b;
  }
  function addTyping() { return addBubble("typing", "…"); }

  /**
   * The wait after the final answer, which is scoring plus a written improvement list --
   * several seconds, not the second or so every other answer takes. It eases toward a
   * ceiling it never reaches on its own and only fills when the results actually land, so
   * it never claims to be finished before it is.
   */
  function addAnalyzing() {
    var b = document.createElement("div");
    b.className = "bubble bot analyzing";
    b.innerHTML = '<div class="an-label">Analysing your responses\u2026</div>'
      + '<div class="an-track"><div class="an-fill"></div></div>'
      + '<div class="an-sub">Scoring each section and writing your improvement list.</div>';
    el("messages").appendChild(b);
    scrollToBottom();
    var fill = b.querySelector(".an-fill");
    var pct = 0;
    var timer = setInterval(function () {
      pct = Math.min(90, pct + Math.max(0.5, (90 - pct) * 0.07));
      fill.style.width = pct + "%";
    }, 300);
    return {
      remove: function () { clearInterval(timer); b.remove(); },
      done: function () {
        clearInterval(timer);
        fill.style.width = "100%";
        setTimeout(function () { b.remove(); }, 450);
      },
    };
  }

  var session = window.ApprenticeshipSession;
  function api(path, body) {
    return session.api(path, { method: "POST", body: JSON.stringify(body) });
  }

  /* ---------- chat ---------- */

  var currentPrompt = "";
  var currentProgress = null;

  function updateProgress(progress) {
    if (!progress || !progress.total) { el("progressBar").hidden = true; return; }
    var pct = Math.round((progress.answered / progress.total) * 100);
    el("progressBar").hidden = false;
    el("progressFill").style.width = pct + "%";
    el("progressLabel").textContent = progress.answered >= progress.total
      ? "All done!"
      : "Question " + (progress.answered + 1) + " of " + progress.total;
  }

  /**
   * Messages in a row are staged, so a section's context and the question behind it read
   * as someone talking rather than a wall of text landing at once.
   *
   * The FIRST bubble is always immediate. The pause that was taken out before sat in
   * front of it too, on top of an API call the respondent had already waited through,
   * which is what made every answer feel slow. Nothing here delays a reply; it only
   * spaces out bubbles that would otherwise appear in the same instant. The gap scales
   * with how much there is to read, so a one-line section name does not hold up the
   * question behind it.
   */
  var GAP_MIN_MS = 350, GAP_PER_CHAR_MS = 13, GAP_MAX_MS = 1500;
  function gapAfter(text) {
    return Math.min(GAP_MAX_MS, Math.max(GAP_MIN_MS, String(text || "").length * GAP_PER_CHAR_MS));
  }

  /** Show `texts` one after another, then call `then`. The first lands immediately. */
  function stage(texts, kindFor, then) {
    var queue = texts.slice();
    var typing = null;
    function next() {
      if (typing) { typing.remove(); typing = null; }
      if (!queue.length) return then ? then() : undefined;
      var text = queue.shift();
      addBubble(kindFor ? kindFor(text) : "bot", text);
      typing = addTyping();
      setTimeout(next, gapAfter(text));
    }
    next();
  }

  function renderStep(step) {
    currentProgress = step.progress;
    updateProgress(step.progress);
    stage(step.messages || [], function (text) {
      // The section's own name is styled as a heading so a respondent can see where they
      // are in the assessment.
      return text === step.sectionName ? "section" : "bot";
    }, function () {
      currentPrompt = step.prompt;
      addBubble("bot", step.prompt);
      el("composer").hidden = false;
      el("answerInput").disabled = false;
      el("sendBtn").disabled = false;
      el("answerInput").value = "";
      el("answerInput").style.height = "auto";
      el("answerInput").focus();
      scrollToBottom();
    });
  }

  function submitAnswer() {
    var answer = el("answerInput").value.trim();
    if (!answer) return;
    addBubble("user", answer);
    el("composer").hidden = true;
    // On the last question this answer triggers the scoring and the written improvement
    // list, so it gets the bar rather than the same "…" every other answer gets. A
    // non-responsive answer here is redirected instead, and the bar simply comes away.
    var isLast = currentProgress && (currentProgress.answered + 1) >= currentProgress.total;
    var waiting = isLast ? addAnalyzing() : addTyping();
    // Both a typing bubble and the analysing bar answer to .remove().
    var clear = function () { waiting.remove(); };
    api("public/answer", { surveyId: surveyId, responseId: responseId, answer: answer })
      .then(function (data) {
        if (data.done && isLast) waiting.done(); else clear();
        if (data.halted) { el("progressBar").hidden = true; return showHalt(data.message); }
        if (data.done) return showResults(data.results);
        renderStep(data.step);
      })
      .catch(function (e) {
        clear();
        addBubble("bot", "Sorry, something went wrong (" + e.message + "). Please try "
          + "sending that again.");
        el("composer").hidden = false;
        el("answerInput").disabled = false;
        el("sendBtn").disabled = false;
        scrollToBottom();
      });
  }

  function showHalt(message) {
    el("composer").hidden = true;
    addBubble("bot", message);
  }

  /* ---------- results ---------- */

  function showResults(results) {
    el("composer").hidden = true;
    el("progressFill").style.width = "100%";
    el("progressLabel").textContent = "All done!";
    // The last question's follow-on teaching has no next question to precede, so it is
    // said here, before the results, staged the same way as anywhere else.
    stage((results.postContext ? [results.postContext] : [])
      .concat(["That's everything \u2014 thank you. Here's where your readiness stands."]),
      null, function () { renderResultsPanel(results); });
  }

  function renderResultsPanel(results) {
    var html = '<div class="panel">'
      + '<div class="band">'
      + '<div class="score">' + esc(results.overall.percent) + "%</div>"
      + '<div class="label">' + esc(results.overall.bandLabel) + "</div>"
      + '<div class="sub">' + esc(results.surveyName || "") + " \u00b7 "
      + esc(results.overall.display) + " points across " + results.sections.length
      + " section" + (results.sections.length === 1 ? "" : "s") + "</div>"
      + "</div>";

    if (results.improvementsError) {
      html += '<div class="callout">' + esc(results.improvementsError) + "</div>";
    }

    results.sections.forEach(function (section) {
      var strengths = section.strengths || [];
      // Improvements are objects once they are a to-do list; a result generated before
      // that was a plain string, and still has to render.
      var todos = (section.improvements || []).map(function (item) {
        return typeof item === "string" ? { text: item } : item;
      });
      html += '<div class="sec">'
        + '<div class="head"><span class="name">' + esc(section.name) + "</span>"
        + '<span class="num">' + esc(section.display) + "</span></div>"
        + '<div class="track"><div class="fill" style="width:' + Number(section.percent) + '%"></div></div>'
        + '<div class="cols">'
        + '<div class="col todo"><h4>To do</h4>'
        + '<p class="count">' + todos.length + " item" + (todos.length === 1 ? "" : "s")
        + " \u00b7 ticking these off raises your score</p>"
        + (todos.length
            ? "<ul>" + todos.map(function (t) { return "<li>" + esc(t.text) + "</li>"; }).join("") + "</ul>"
            : '<p class="none">Nothing outstanding here.</p>')
        + "</div>"
        + '<div class="col strength"><h4>Already in place</h4>'
        + '<p class="count">' + strengths.length + " item"
        + (strengths.length === 1 ? "" : "s") + " \u00b7 no work needed</p>"
        + (strengths.length
            ? "<ul>" + strengths.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>"
            : '<p class="none">Nothing to credit in this section yet.</p>')
        + "</div>"
        + "</div></div>";
    });

    if (results.contactPrompt) {
      html += '<div class="callout">' + esc(results.contactPrompt) + "</div>";
    }

    html += '<p class="foot">These results are saved to your account. Your '
      + '<a href="/apprenticeship/dashboard.html">readiness dashboard</a> keeps the to-do '
      + 'list above, and ticking items off there raises this score \u2014 which is how you '
      + 'unlock the next step without sitting this assessment again.</p>';
    html += "</div>";

    el("results").hidden = false;
    el("results").innerHTML = html;
    el("results").scrollIntoView({ behavior: "smooth" });
  }

  /* ---------- wiring ---------- */

  el("sendBtn").addEventListener("click", submitAnswer);
  el("answerInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAnswer(); }
  });
  el("answerInput").addEventListener("input", function () {
    el("answerInput").style.height = "auto";
    el("answerInput").style.height = Math.min(150, el("answerInput").scrollHeight) + "px";
    scrollToBottom();
  });

  el("startBtn").addEventListener("click", function () {
    el("intakeError").hidden = true;
    el("startBtn").disabled = true;
    api("public/start", { surveyId: surveyId })
      .then(function (data) {
        responseId = data.responseId;
        el("intake").hidden = true;
        // An assessment left half-finished is continued, not restarted. Saying so
        // explains why the first question on screen isn't question one.
        if (data.resumed) {
          addBubble("bot", "Welcome back \u2014 picking up where you left off. You've "
            + "answered " + data.answered + " question"
            + (data.answered === 1 ? "" : "s") + " so far.");
        }
        renderStep(data.step);
      })
      .catch(function (e) {
        el("startBtn").disabled = false;
        el("intakeError").hidden = false;
        el("intakeError").textContent = e.message;
      });
  });

  // Signed in first: the assessment is saved to an account, and which account decides
  // whose dashboard it lands on. Somebody arriving cold on an assessment link is sent to
  // sign in or register and comes straight back here afterwards.
  if (!session.token()) { session.requireSignIn(); return; }

  Promise.all([
    session.api("account/me"),
    fetch("/api/apprenticeship/public/" + encodeURIComponent(surveyId))
      .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); }),
  ]).then(function (results) {
    var account = results[0].account;
    var survey = results[1];
    el("who").hidden = false;
    el("who").innerHTML = esc(account.name) + " \u00b7 " + esc(account.company)
      + ' \u00b7 <a href="/apprenticeship/dashboard.html">Your dashboard</a>';
    {
      el("surveyTitle").textContent = survey.name;
      document.title = survey.name + " — Apprenticeship Readiness";
      el("intakeIntro").textContent = survey.questionCount + " question"
        + (survey.questionCount === 1 ? "" : "s") + " across " + survey.sectionCount
        + " section" + (survey.sectionCount === 1 ? "" : "s") + ". Answer in your own words —"
        + " there is nothing to look up, and an honest “we don’t do that yet” is"
        + " the most useful answer you can give. You can stop part-way and come back.";
      el("intake").hidden = false;
      el("startBtn").focus();
    }
  }).catch(function (e) {
    if (e && e.message === "Not signed in") return; // api() is already redirecting
    el("surveyTitle").textContent = "Assessment not found";
    showNotice("This link doesn't look right. Double-check it and try again.");
  });
})();
</script>
</body>
</html>
