<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responses — Consensus</title>
<script src="/access.js" data-app="consensus" data-need="admin"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6; --bad:#c03030; --bad-bg:rgba(208,59,59,.08);
    --warn:#93370d; --warn-bg:rgba(250,178,25,.12); --warn-border:rgba(250,178,25,.4);
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5; --bad:#ff8a80; --bad-bg:rgba(208,59,59,.14);
    --warn:#fab219; --warn-bg:rgba(250,178,25,.10); --warn-border:rgba(250,178,25,.35);
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 64px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:20px; font-weight:650; margin:0; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:12.5px; margin:4px 0 18px; }
  a.link { color:var(--accent); font-size:13px; text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  .warnbox { border:1px solid var(--warn-border); background:var(--warn-bg); color:var(--warn); border-radius:12px;
             padding:12px 16px; font-size:13px; margin-bottom:16px; }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; }
  .toolbar input[type=search] { flex:1 1 220px; min-width:0; font:inherit; font-size:13.5px; padding:8px 12px; border-radius:10px;
                                border:1px solid var(--border); background:var(--surface-1); color:var(--text-primary); }
  .check { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary); cursor:pointer; }
  .check input { width:17px; height:17px; margin:0; }
  button.danger { font:inherit; font-size:13px; font-weight:600; border-radius:10px; padding:7px 14px; cursor:pointer;
                  border:1px solid var(--bad); background:var(--bad-bg); color:var(--bad); }
  button.danger:disabled { opacity:.45; cursor:not-allowed; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .resp { border:1px solid var(--border); border-radius:12px; background:var(--surface-1); }
  .resp-head { display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .resp-open { flex:1; min-width:0; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
               background:none; border:0; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .resp-label { font-weight:650; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; }
  .resp-meta { font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  .chevron { display:inline-block; transition:transform .15s; font-size:10px; color:var(--accent); margin-right:6px; }
  .resp-open[aria-expanded="true"] .chevron { transform:rotate(90deg); }
  .resp-body { border-top:1px solid var(--border); padding:4px 16px 14px; }
  .qa { padding:12px 0; border-bottom:1px solid var(--border); }
  .qa:last-of-type { border-bottom:0; }
  .qa h3 { font-size:13.5px; font-weight:650; margin:0 0 6px; }
  .turn { margin:6px 0 0; }
  .turn .ask { font-size:12.5px; color:var(--text-muted); }
  .turn .say { font-size:13.5px; color:var(--text-secondary); white-space:pre-wrap; }
  .resp-actions { display:flex; justify-content:flex-end; gap:10px; padding-top:8px; }
  .notice { margin:40px 0; padding:20px; border:1px solid var(--border); border-radius:12px;
            background:var(--surface-1); font-size:14px; text-align:center; color:var(--text-secondary); }
  .msg { font-size:13px; margin:0 0 12px; }
  .msg.err { color:var(--bad); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="surveyTitle">Loading…</h1>
    <a class="link" href="/consensus/control-panel/index.html">&larr; Consensus</a>
  </header>
  <p class="sub" id="sub"></p>
  <div class="warnbox" id="deletedNote" hidden></div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="toolbar" id="toolbar" hidden>
    <label class="sr" for="find">Search responses</label>
    <input type="search" id="find" placeholder="Search answers">
    <label class="check"><input type="checkbox" id="selectAll"> Select all</label>
    <button type="button" class="danger" id="deleteSelected" disabled>Delete selected</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var token = null;
  try { token = sessionStorage.getItem("beta-token"); } catch (e) {}
  var login = function () { window.location.href = "/admin/login.html?next=" + encodeURIComponent(location.pathname + location.search + location.hash); };
  if (!token) { login(); return; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({ authorization: "Bearer " + token }, options.headers || {});
    return fetch("/api/consensus/" + path, options).then(function (r) {
      if (r.status === 401) { login(); throw new Error("Sign in again."); }
      return r.json().catch(function () { return {}; }).then(function (b) { if (!r.ok) throw new Error(b.error || "Something went wrong."); return b; });
    });
  }
  function when(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  var surveyId = new URLSearchParams(window.location.search).get("survey");
  var state = { responses: [], open: {}, selected: {}, q: "" };

  function matches(r) {
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    return (r.label + " " + r.questions.map(function (x) {
      return x.questionText + " " + x.turns.map(function (t) { return t.prompt + " " + t.answer; }).join(" ");
    }).join(" ")).toLowerCase().indexOf(q) >= 0;
  }
  function shown() { return state.responses.filter(matches); }
  function selectedIds() { return Object.keys(state.selected).filter(function (id) { return state.selected[id]; }); }

  function responseHtml(r) {
    var open = !!state.open[r.responseId], answers = r.questions.filter(function (q) { return q.turns.some(function (t) { return t.answer; }); }).length;
    var body = open ? '<div class="resp-body" id="body-' + esc(r.responseId) + '">' + r.questions.map(function (q) {
      return '<div class="qa"><h3>' + esc(q.questionText) + "</h3>" + q.turns.map(function (t) {
        return '<div class="turn">' + (t.turn > 0 ? '<div class="ask">Follow-up: ' + esc(t.prompt) + "</div>" : "") +
          '<div class="say">' + esc(t.answer || "(no answer)") + "</div></div>";
      }).join("") + "</div>";
    }).join("") + '<div class="resp-actions"><button type="button" class="danger" data-delete="' + esc(r.responseId) + '">Delete this response</button></div></div>' : "";
    return '<div class="resp"><div class="resp-head">' +
      '<input type="checkbox" data-select="' + esc(r.responseId) + '"' + (state.selected[r.responseId] ? " checked" : "") +
      ' aria-label="Select the response from ' + esc(r.label || "a respondent") + '">' +
      '<button type="button" class="resp-open" data-open="' + esc(r.responseId) + '" aria-expanded="' + open + '" aria-controls="body-' + esc(r.responseId) + '">' +
      '<span class="resp-label"><span class="chevron" aria-hidden="true">&#9654;</span>' + esc(r.label || "Response") + "</span>" +
      '<span class="resp-meta">' + esc(when(r.submittedAt)) + " &middot; " + plural(answers, "answer", "answers") + "</span></button></div>" + body + "</div>";
  }

  function render() {
    var list = shown(), ids = selectedIds();
    el("list").innerHTML = list.map(responseHtml).join("") ||
      '<div class="notice">' + (state.responses.length ? "No responses match that search." : "No responses yet.") + "</div>";
    el("toolbar").hidden = !state.responses.length;
    el("deleteSelected").disabled = !ids.length;
    el("deleteSelected").textContent = ids.length ? "Delete selected (" + ids.length + ")" : "Delete selected";
    el("selectAll").checked = list.length > 0 && list.every(function (r) { return state.selected[r.responseId]; });
  }

  function load() {
    return api("surveys/" + encodeURIComponent(surveyId) + "/responses").then(function (b) {
      state.responses = b.responses || [];
      el("surveyTitle").textContent = b.survey.name;
      document.title = "Responses — " + b.survey.name;
      el("sub").textContent = plural(b.count, "response", "responses") + ". Click a response to read it.";
      var gone = b.survey.deletedSinceAnalysis || 0;
      el("deletedNote").hidden = !gone;
      el("deletedNote").textContent = gone ? plural(gone, "response was", "responses were") +
        " deleted since the last analysis. The results still include " + (gone === 1 ? "it" : "them") + " until you run Analyze again." : "";
      Object.keys(state.selected).forEach(function (id) {
        if (!state.responses.some(function (r) { return r.responseId === id; })) delete state.selected[id];
      });
      render();
    }).catch(function (e) {
      el("surveyTitle").textContent = "Responses";
      el("list").innerHTML = '<div class="notice">' + esc(e.message) + "</div>";
    });
  }

  function remove(ids) {
    var n = ids.length;
    if (!window.confirm("Delete " + plural(n, "response", "responses") + "? " + (n === 1 ? "It is" : "They are") +
        " removed from the responses file in Box. Box keeps the earlier version of the file in its version history.")) return;
    el("msg").className = "msg"; el("msg").textContent = "Deleting…";
    el("deleteSelected").disabled = true;
    api("surveys/" + encodeURIComponent(surveyId) + "/responses/delete", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ responseIds: ids }),
    }).then(function (b) {
      ids.forEach(function (id) { delete state.selected[id]; delete state.open[id]; });
      el("msg").textContent = "Deleted " + plural(b.removed, "response", "responses") + ".";
      return load();
    }).catch(function (e) {
      el("msg").className = "msg err"; el("msg").textContent = e.message;
      render();
    });
  }

  el("list").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-open")) {
      var id = b.getAttribute("data-open");
      state.open[id] = !state.open[id];
      render();
      var again = el("list").querySelector('[data-open="' + id.replace(/"/g, '\\"') + '"]'); if (again) again.focus();
    } else if (b.hasAttribute("data-delete")) remove([b.getAttribute("data-delete")]);
  });
  el("list").addEventListener("change", function (e) {
    if (!e.target.hasAttribute("data-select")) return;
    state.selected[e.target.getAttribute("data-select")] = e.target.checked;
    var ids = selectedIds();
    el("deleteSelected").disabled = !ids.length;
    el("deleteSelected").textContent = ids.length ? "Delete selected (" + ids.length + ")" : "Delete selected";
    el("selectAll").checked = shown().every(function (r) { return state.selected[r.responseId]; });
  });
  el("selectAll").addEventListener("change", function () {
    var on = el("selectAll").checked;
    shown().forEach(function (r) { state.selected[r.responseId] = on; });
    render();
  });
  el("deleteSelected").addEventListener("click", function () { remove(selectedIds()); });
  el("find").addEventListener("input", function () { state.q = el("find").value.trim(); render(); });

  if (!surveyId) { el("surveyTitle").textContent = "Responses"; el("list").innerHTML = '<div class="notice">No survey specified.</div>'; }
  else load();
})();
</script>
</body>
</html>
