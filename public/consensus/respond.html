<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<!-- Shentox (the brand's actual wordmark font) is a paid font with no free CDN
     source -- Poppins ExtraBold stands in for it: also geometric, uniform stroke
     width, similar weight. Swap the brand-name font-family below if a licensed
     Shentox file is added to the repo later. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6; --bad:#d03b3b; --bot-bg:#eef0f2; --user-bg:rgba(42,120,214,.14);
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5; --bad:#d03b3b; --bot-bg:#232321; --user-bg:rgba(57,135,229,.18);
  } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; }
  .wrap { max-width:640px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column;
          min-height:100vh; }
  header { padding:16px 20px 14px; border-bottom:1px solid var(--border); }
  .brand-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand-logo { height:26px; width:auto; display:block; background:#fff; border-radius:6px; padding:3px 7px; }
  .brand-name { font-family:"Poppins", system-ui, sans-serif; font-weight:800; font-size:21px;
                color:var(--accent); letter-spacing:.01em; }
  h1 { font-size:15px; font-weight:400; margin:0; color:var(--text-secondary); letter-spacing:-0.005em; }
  .messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .bubble { max-width:82%; padding:11px 14px; border-radius:14px; font-size:14.5px; white-space:pre-wrap; }
  .bubble.bot { align-self:flex-start; background:var(--bot-bg); border-bottom-left-radius:4px; }
  .bubble.user { align-self:flex-end; background:var(--user-bg); border-bottom-right-radius:4px; }
  .bubble.typing { align-self:flex-start; background:var(--bot-bg); border-bottom-left-radius:4px;
                   color:var(--text-muted); font-style:italic; }
  .composer { border-top:1px solid var(--border); padding:14px 20px; display:flex; gap:10px;
              background:var(--surface-1); }
  .composer textarea { flex:1; font:inherit; padding:10px 13px; border-radius:10px;
                        border:1px solid var(--border); background:var(--page); color:var(--text-primary);
                        resize:none; min-height:44px; max-height:140px; }
  .composer button { font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--accent);
                      cursor:pointer; padding:0 20px; background:var(--accent); color:#fff; }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  .notice { margin:40px 24px; padding:20px; border:1px solid var(--border); border-radius:12px;
            background:var(--surface-1); font-size:14px; text-align:center; color:var(--text-secondary); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-row">
      <img class="brand-logo" src="/consensus/conexus-logo.jpg" alt="Conexus Indiana">
      <span class="brand-name">Consensus</span>
    </div>
    <h1 id="surveyTitle">Loading…</h1>
  </header>
  <div class="messages" id="messages"></div>
  <div class="composer" id="composer" hidden>
    <textarea id="answerInput" placeholder="Type your answer…" rows="1"></textarea>
    <button type="button" id="sendBtn">Send</button>
  </div>
  <div id="notice" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var surveyId = new URLSearchParams(window.location.search).get("survey");

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function showNotice(text) {
    el("composer").hidden = true;
    el("notice").hidden = false;
    el("notice").innerHTML = '<div class="notice">' + esc(text) + "</div>";
  }

  if (!surveyId) { showNotice("No survey specified."); return; }

  function addBubble(kind, text) {
    var b = document.createElement("div");
    b.className = "bubble " + kind;
    b.textContent = text;
    el("messages").appendChild(b);
    el("messages").scrollTop = el("messages").scrollHeight;
    return b;
  }
  function addTyping() {
    var b = document.createElement("div");
    b.className = "bubble typing";
    b.textContent = "…";
    el("messages").appendChild(b);
    el("messages").scrollTop = el("messages").scrollHeight;
    return b;
  }

  var survey = null;
  var qIndex = 0;
  var currentQuestion = null;
  var currentTurns = []; // this question's [{turn, prompt, answer}] so far
  var allResponses = []; // completed questions' {questionId, questionText, turns}

  function askCurrentPrompt(promptText) {
    addBubble("bot", promptText);
    el("composer").hidden = false;
    el("answerInput").disabled = false;
    el("sendBtn").disabled = false;
    el("answerInput").value = "";
    el("answerInput").focus();
  }

  function startQuestion(index) {
    if (index >= survey.questions.length) return finish();
    qIndex = index;
    currentQuestion = survey.questions[index];
    currentTurns = [];
    askCurrentPrompt(currentQuestion.text);
  }

  function finish() {
    el("composer").hidden = true;
    var typing = addTyping();
    fetch("/api/consensus/submit", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ surveyId: surveyId, responses: allResponses }),
    }).then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); })
      .then(function () {
        typing.remove();
        addBubble("bot", "Thank you! Your responses have been recorded.");
      })
      .catch(function (e) {
        typing.remove();
        addBubble("bot", "Something went wrong saving your responses: " + e.message);
      });
  }

  function submitAnswer() {
    var answer = el("answerInput").value.trim();
    if (!answer) return;
    addBubble("user", answer);
    el("composer").hidden = true;
    var prompt = currentTurns.length ? currentTurns[currentTurns.length - 1].nextPrompt : currentQuestion.text;
    currentTurns.push({ turn: currentTurns.length, prompt: prompt, answer: answer });

    var typing = addTyping();
    fetch("/api/consensus/followup", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        surveyId: surveyId, questionId: currentQuestion.id,
        priorAnswers: currentTurns.map(function (t) { return { prompt: t.prompt, answer: t.answer }; }),
        completed: allResponses,
      }),
    }).then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); })
      .then(function (data) {
        typing.remove();
        if (data.done) {
          allResponses.push({
            questionId: currentQuestion.id, questionText: currentQuestion.text,
            turns: currentTurns.map(function (t) { return { turn: t.turn, prompt: t.prompt, answer: t.answer }; }),
          });
          startQuestion(qIndex + 1);
          return;
        }
        currentTurns[currentTurns.length - 1].nextPrompt = data.followUp;
        askCurrentPrompt(data.followUp);
      })
      .catch(function (e) {
        typing.remove();
        addBubble("bot", "Sorry, something went wrong (" + e.message + "). Please try answering again.");
        el("composer").hidden = false;
        el("answerInput").disabled = false;
        el("sendBtn").disabled = false;
      });
  }

  el("sendBtn").addEventListener("click", submitAnswer);
  el("answerInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAnswer(); }
  });
  el("answerInput").addEventListener("input", function () {
    el("answerInput").style.height = "auto";
    el("answerInput").style.height = Math.min(140, el("answerInput").scrollHeight) + "px";
  });

  fetch("/api/consensus/public/" + encodeURIComponent(surveyId))
    .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); })
    .then(function (data) {
      survey = data;
      el("surveyTitle").textContent = survey.name;
      document.title = survey.name;
      if (!survey.questions.length) { showNotice("This survey has no questions yet."); return; }
      startQuestion(0);
    })
    .catch(function () {
      el("surveyTitle").textContent = "Survey not found";
      showNotice("This survey link doesn't look right. Double-check the link and try again.");
    });
})();
</script>
</body>
</html>
