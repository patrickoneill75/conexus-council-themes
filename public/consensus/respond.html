<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<!-- Shentox (the brand's actual wordmark font) is a paid font with no free CDN
     source -- Poppins ExtraBold stands in for it: also geometric, uniform stroke
     width, similar weight. Swap the brand-name font-family below if a licensed
     Shentox file is added to the repo later. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6; --bad:#d03b3b; --bot-bg:#eef0f2; --user-bg:rgba(42,120,214,.14);
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5; --bad:#d03b3b; --bot-bg:#232321; --user-bg:rgba(57,135,229,.18);
  } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; }
  .wrap { max-width:640px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column;
          min-height:100vh; }
  header { padding:16px 20px 14px; border-bottom:1px solid var(--border); text-align:left; }
  .brand-name { font-family:"Poppins", system-ui, sans-serif; font-weight:800; font-size:21px;
                color:var(--accent); letter-spacing:.01em; }
  .brand-sub { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase;
               letter-spacing:.05em; margin:2px 0 8px; }
  h1 { font-size:15px; font-weight:400; margin:0; color:var(--text-secondary); letter-spacing:-0.005em; }
  .progress-bar { padding:10px 20px; border-bottom:1px solid var(--border); background:var(--surface-1); }
  .progress-bar-track { width:100%; height:6px; border-radius:999px; background:var(--wash); overflow:hidden; }
  .progress-bar-fill { height:100%; width:0; background:var(--accent); border-radius:999px;
                        transition:width .4s ease; }
  .progress-bar-label { font-size:11.5px; color:var(--text-muted); margin-top:6px; font-weight:600; }
  .progress-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:6px; }
  .progress-row .progress-bar-label { margin-top:0; }
  .save-status { font-size:11.5px; color:var(--text-muted); margin-left:auto; }
  .later-btn { font:inherit; font-size:12.5px; font-weight:600; color:var(--accent); background:none; border:0;
               padding:4px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .later { padding:14px 20px; border-bottom:1px solid var(--border); background:var(--surface-1); font-size:14px; }
  .later p { margin:0 0 10px; color:var(--text-secondary); }
  .later .row { display:flex; gap:8px; }
  .later input { flex:1; min-width:0; font:inherit; font-size:13px; padding:8px 10px; border-radius:8px;
                 border:1px solid var(--border); background:var(--page); color:var(--text-primary); }
  .later button, .retry { font:inherit; font-weight:600; border-radius:8px; border:1px solid var(--accent);
                          cursor:pointer; padding:0 14px; min-height:36px; background:var(--accent); color:#fff; }
  .later .small { font-size:12.5px; color:var(--text-muted); margin:8px 0 0; }
  .retry { align-self:flex-start; }
  .messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .bubble { max-width:82%; padding:11px 14px; border-radius:14px; font-size:14.5px; white-space:pre-wrap; }
  .bubble.bot { align-self:flex-start; background:var(--bot-bg); border-bottom-left-radius:4px; }
  .bubble.rich { white-space:normal; }
  .bubble.rich ul { margin:6px 0; padding-left:20px; }
  .bubble.rich li { margin:2px 0; }
  .bubble mark { background:rgba(251,174,64,.38); color:inherit; border-radius:3px; padding:0 2px; }
  .bubble.user { align-self:flex-end; background:var(--user-bg); border-bottom-right-radius:4px; }
  .bubble.typing { align-self:flex-start; background:var(--bot-bg); border-bottom-left-radius:4px;
                   color:var(--text-muted); font-style:italic; }
  .composer { border-top:1px solid var(--border); padding:14px 20px; display:flex; gap:10px;
              background:var(--surface-1); }
  .composer textarea { flex:1; font:inherit; padding:10px 13px; border-radius:10px;
                        border:1px solid var(--border); background:var(--page); color:var(--text-primary);
                        resize:none; min-height:44px; max-height:140px; }
  .composer button { font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--accent);
                      cursor:pointer; padding:0 20px; background:var(--accent); color:#fff; }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  .notice { margin:40px 24px; padding:20px; border:1px solid var(--border); border-radius:12px;
            background:var(--surface-1); font-size:14px; text-align:center; color:var(--text-secondary); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-name">Consensus</div>
    <div class="brand-sub">Conexus Indiana</div>
    <h1 id="surveyTitle">Loading…</h1>
  </header>
  <div class="progress-bar" id="progressBar" hidden>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-row">
      <div class="progress-bar-label" id="progressLabel"></div>
      <span class="save-status" id="saveStatus" aria-live="polite"></span>
      <button type="button" class="later-btn" id="laterBtn" aria-expanded="false" aria-controls="laterPanel">Finish later</button>
    </div>
  </div>
  <div class="later" id="laterPanel" hidden>
    <p>Your answers so far are saved. Come back to this page on this device and you'll pick up where you left off.
      To finish on another device, open this link there:</p>
    <div class="row">
      <label for="laterLink" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Link to finish this survey later</label>
      <input id="laterLink" readonly>
      <button type="button" id="copyLaterBtn">Copy link</button>
    </div>
    <p class="small" id="laterNote">Anyone with this link can see and finish your answers. Saved answers are kept for 60 days.</p>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer" id="composer" hidden>
    <textarea id="answerInput" placeholder="Type your answer…" rows="1"></textarea>
    <button type="button" id="sendBtn">Send</button>
  </div>
  <div id="notice" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var surveyId = new URLSearchParams(window.location.search).get("survey");

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function showNotice(text) {
    el("composer").hidden = true;
    el("notice").hidden = false;
    el("notice").innerHTML = '<div class="notice">' + esc(text) + "</div>";
  }

  if (!surveyId) { showNotice("No survey specified."); return; }

  // .messages is a flex:1 sibling of .composer, so hiding/showing the composer (or the
  // answer textarea growing to a second line) changes .messages' own visible height --
  // scrolling has to happen AFTER that, or the newest bubble ends up hidden behind the
  // composer instead of above it. Every place that changes either has to call this again.
  // A newest message taller than the window is shown from its top, so it reads from its
  // first line and the respondent scrolls down for the rest; a shorter one sits at the bottom.
  function scrollToLatest() {
    var box = el("messages");
    var last = box.lastElementChild;
    var bottom = box.scrollHeight - box.clientHeight;
    if (!last) { box.scrollTop = bottom; return; }
    var top = last.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 16;
    box.scrollTop = Math.max(0, Math.min(bottom, top));
  }
  // A question's own wording keeps the bold, italics, bullets and highlights it was written
  // with. Only those tags are copied, without attributes, whatever the survey holds.
  var RICH_TAGS = { B: "b", I: "i", U: "u", UL: "ul", LI: "li", MARK: "mark", BR: "br", DIV: "div" };
  var richByText = {};
  function copyRich(from, to) {
    Array.prototype.forEach.call(from.childNodes, function (n) {
      if (n.nodeType === 3) { to.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      var tag = Object.prototype.hasOwnProperty.call(RICH_TAGS, n.tagName) ? RICH_TAGS[n.tagName] : "";
      if (!tag) { copyRich(n, to); return; }
      var e = document.createElement(tag);
      to.appendChild(e);
      copyRich(n, e);
    });
  }
  function addBubble(kind, text) {
    var b = document.createElement("div");
    b.className = "bubble " + kind;
    var html = kind === "bot" && Object.prototype.hasOwnProperty.call(richByText, text) ? richByText[text] : "";
    if (html) {
      b.className += " rich";
      copyRich(new DOMParser().parseFromString(html, "text/html").body, b);
    } else {
      b.textContent = text;
    }
    el("messages").appendChild(b);
    scrollToLatest();
    return b;
  }
  function addTyping() {
    var b = document.createElement("div");
    b.className = "bubble typing";
    b.textContent = "…";
    el("messages").appendChild(b);
    scrollToLatest();
    return b;
  }

  var survey = null;
  var qIndex = 0;
  var currentQuestion = null;
  var currentQuestionDisplayedText = ""; // what was actually shown for the current
    // question -- its static text, or a personalized rewrite of it (see startQuestion())
  var currentTurns = []; // this question's [{turn, prompt, answer}] so far
  var allResponses = []; // completed questions' {questionId, questionText, turns}

  // ---- Finish later. Answers are saved on the server after every question and follow-up
  // (POST /api/consensus/progress), under a random token kept in this browser and in the
  // "finish later" link. Coming back on this device, or opening the link anywhere, picks
  // up at the question that was waiting. Submitting deletes the saved copy.
  var STORE = "consensus-draft:" + surveyId;
  var params = new URLSearchParams(window.location.search);
  var token = params.get("resume") || readStore();
  var keptDays = 60;
  function readStore() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function writeStore(v) { try { if (v) localStorage.setItem(STORE, v); else localStorage.removeItem(STORE); } catch (e) {} }
  function resumeLink() {
    return window.location.origin + window.location.pathname + "?survey=" + encodeURIComponent(surveyId) + "&resume=" + encodeURIComponent(token || "");
  }
  var saving = null;
  function saveProgress(pendingPrompt) {
    var draft = { completed: allResponses, current: currentQuestion ? {
      questionId: currentQuestion.id, displayedText: currentQuestionDisplayedText, pendingPrompt: pendingPrompt,
      turns: currentTurns.map(function (t) { return { turn: t.turn, prompt: t.prompt, answer: t.answer }; }),
    } : null };
    el("saveStatus").textContent = "Saving…";
    saving = fetch("/api/consensus/progress", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ surveyId: surveyId, token: token, draft: draft }),
    }).then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); })
      .then(function (b) {
        token = b.token; keptDays = b.keptDays || keptDays; writeStore(token);
        el("saveStatus").textContent = "Progress saved";
        el("laterLink").value = resumeLink();
        el("laterNote").textContent = "Anyone with this link can see and finish your answers. Saved answers are kept for " + keptDays + " days.";
      })
      .catch(function () { el("saveStatus").textContent = "Not saved yet"; });
    return saving;
  }

  // An instantly-appearing question felt jarring next to a follow-up, which always has
  // some natural network delay -- this puts every question through the same minimum
  // "thinking" pause so the pacing feels consistent throughout the chat.
  var MIN_QUESTION_DELAY_MS = 1500;

  // isFollowUp: the prompt is a follow-up, so the question's own wording stays as it was shown.
  function askCurrentPrompt(promptText, isFollowUp) {
    if (!isFollowUp) currentQuestionDisplayedText = promptText;
    addBubble("bot", promptText);
    el("composer").hidden = false;
    el("answerInput").disabled = false;
    el("sendBtn").disabled = false;
    el("answerInput").value = "";
    el("answerInput").style.height = "auto";
    el("answerInput").focus();
    // The composer was just un-hidden, shrinking .messages -- addBubble()'s scroll
    // above ran while it was still hidden, so this question would otherwise end up
    // partly hidden behind the composer instead of fully visible above it.
    scrollToLatest();
    // Nothing to keep until something has been answered.
    if (allResponses.length || currentTurns.length) saveProgress(promptText);
  }

  // This is being sent out as a survey -- respondents need to see how far along they
  // are. Progress advances one step per BASE question completed, not per follow-up:
  // the follow-up count for any given question is a judgment call the model makes on
  // the fly (see src/consensus.js's generateFollowUp), so there's no fixed total of
  // "steps" within a question to show partial credit for -- "Question 3 of 6" is the
  // honest, stable measure, same as any traditional paginated survey.
  function updateProgressUI(index) {
    var total = survey.questions.length;
    if (!total) { el("progressBar").hidden = true; return; }
    var completed = Math.min(index, total);
    var pct = Math.round((completed / total) * 100);
    el("progressBar").hidden = false;
    el("progressFill").style.width = pct + "%";
    el("progressLabel").textContent = completed >= total
      ? "All done!"
      : "Question " + (completed + 1) + " of " + total;
  }

  function startQuestion(index) {
    if (index >= survey.questions.length) return finish();
    updateProgressUI(index);
    qIndex = index;
    currentQuestion = survey.questions[index];
    currentTurns = [];

    var typing = addTyping();
    var delay = new Promise(function (resolve) { setTimeout(resolve, MIN_QUESTION_DELAY_MS); });
    // Always calls /personalize, even for a question with no personalization set up --
    // the Worker answers those instantly with the static text (no Claude call), and
    // that quick round trip is harmless since it's hidden inside the delay above
    // anyway. Falls back to the known static text on any error, same as the Worker's
    // own fail-open behavior -- personalized wording is a nicety, never something that
    // should be able to block a respondent from moving through the survey.
    var personalize = fetch("/api/consensus/personalize", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ surveyId: surveyId, questionId: currentQuestion.id, completed: allResponses }),
    }).then(function (r) { return r.json(); })
      .then(function (data) { return (data && data.text) || currentQuestion.text; })
      .catch(function () { return currentQuestion.text; });

    Promise.all([personalize, delay]).then(function (results) {
      typing.remove();
      askCurrentPrompt(results[0]);
    });
  }

  function finish() {
    updateProgressUI(survey.questions.length);
    el("composer").hidden = true;
    el("laterBtn").hidden = true; el("laterPanel").hidden = true;
    currentQuestion = null;
    var typing = addTyping();
    // Every answer is in the saved copy before submitting, so a failed submit loses nothing.
    var ready = token ? Promise.resolve() : saveProgress("").catch(function () {});
    ready.then(function () {
      return fetch("/api/consensus/submit", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ surveyId: surveyId, token: token, responses: allResponses }),
      });
    }).then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); })
      .then(function () {
        typing.remove();
        writeStore(null);
        el("saveStatus").textContent = "";
        addBubble("bot", "Thank you! Your responses have been recorded.");
      })
      .catch(function (e) {
        typing.remove();
        addBubble("bot", "Something went wrong saving your responses: " + e.message + " Your answers are still saved here.");
        var retry = document.createElement("button");
        retry.type = "button"; retry.className = "retry"; retry.textContent = "Submit again";
        retry.addEventListener("click", function () { retry.remove(); finish(); });
        el("messages").appendChild(retry);
        scrollToLatest();
        retry.focus();
      });
  }

  // Coming back: the saved answers are shown as the chat they were, and the question or
  // follow-up that was waiting is asked again. A question the survey no longer has is
  // dropped; one added since is asked in its place.
  function resume(draft) {
    var byId = {};
    survey.questions.forEach(function (q, i) { byId[q.id] = i; });
    allResponses = (draft.completed || []).filter(function (c) { return c.questionId in byId; })
      .sort(function (a, b) { return byId[a.questionId] - byId[b.questionId]; });
    addBubble("bot", "Welcome back. Your earlier answers are below, so you can pick up where you left off.");
    allResponses.forEach(function (c) {
      c.turns.forEach(function (t) { addBubble("bot", t.prompt); addBubble("user", t.answer); });
    });
    var done = {};
    allResponses.forEach(function (c) { done[c.questionId] = true; });
    var cur = draft.current;
    if (cur && cur.questionId in byId && !done[cur.questionId] && cur.displayedText) {
      qIndex = byId[cur.questionId];
      currentQuestion = survey.questions[qIndex];
      currentQuestionDisplayedText = cur.displayedText;
      currentTurns = (cur.turns || []).map(function (t, i, all) {
        return { turn: i, prompt: t.prompt, answer: t.answer,
                 nextPrompt: i + 1 < all.length ? all[i + 1].prompt : cur.pendingPrompt };
      });
      updateProgressUI(qIndex);
      currentTurns.forEach(function (t) { addBubble("bot", t.prompt); addBubble("user", t.answer); });
      askCurrentPrompt(cur.pendingPrompt || cur.displayedText, currentTurns.length > 0);
      return;
    }
    var next = survey.questions.findIndex(function (q) { return !done[q.id]; });
    startQuestion(next < 0 ? survey.questions.length : next);
  }

  function submitAnswer() {
    var answer = el("answerInput").value.trim();
    if (!answer) return;
    addBubble("user", answer);
    el("composer").hidden = true;
    var prompt = currentTurns.length ? currentTurns[currentTurns.length - 1].nextPrompt : currentQuestionDisplayedText;
    currentTurns.push({ turn: currentTurns.length, prompt: prompt, answer: answer });

    var typing = addTyping();
    fetch("/api/consensus/followup", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        surveyId: surveyId, questionId: currentQuestion.id,
        priorAnswers: currentTurns.map(function (t) { return { prompt: t.prompt, answer: t.answer }; }),
        completed: allResponses,
      }),
    }).then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); })
      .then(function (data) {
        typing.remove();
        if (data.done) {
          allResponses.push({
            questionId: currentQuestion.id, questionText: currentQuestionDisplayedText,
            turns: currentTurns.map(function (t) { return { turn: t.turn, prompt: t.prompt, answer: t.answer }; }),
          });
          startQuestion(qIndex + 1);
          return;
        }
        currentTurns[currentTurns.length - 1].nextPrompt = data.followUp;
        askCurrentPrompt(data.followUp, true);
      })
      .catch(function (e) {
        typing.remove();
        addBubble("bot", "Sorry, something went wrong (" + e.message + "). Please try answering again.");
        el("composer").hidden = false;
        scrollToLatest(); // same as askCurrentPrompt() -- un-hiding the composer shrinks .messages
        el("answerInput").disabled = false;
        el("sendBtn").disabled = false;
      });
  }

  el("laterBtn").addEventListener("click", function () {
    var open = el("laterPanel").hidden;
    el("laterPanel").hidden = !open;
    el("laterBtn").setAttribute("aria-expanded", String(open));
    if (!open) return;
    el("laterLink").value = token ? resumeLink() : "Saving…";
    (saving || Promise.resolve()).then(function () {
      if (!token) return saveProgress(currentTurns.length ? currentTurns[currentTurns.length - 1].nextPrompt : currentQuestionDisplayedText);
    }).then(function () { el("laterLink").value = token ? resumeLink() : "Could not save yet. Please try again."; });
  });
  el("copyLaterBtn").addEventListener("click", function () {
    var link = el("laterLink");
    link.select();
    var done = function () { el("copyLaterBtn").textContent = "Copied"; setTimeout(function () { el("copyLaterBtn").textContent = "Copy link"; }, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(link.value).then(done, function () { document.execCommand("copy"); done(); });
    else { document.execCommand("copy"); done(); }
  });
  el("sendBtn").addEventListener("click", submitAnswer);
  el("answerInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAnswer(); }
  });
  el("answerInput").addEventListener("input", function () {
    var before = el("answerInput").offsetHeight;
    el("answerInput").style.height = "auto";
    el("answerInput").style.height = Math.min(140, el("answerInput").scrollHeight) + "px";
    // A taller answer box shrinks .messages. Move the messages up by the same amount so
    // the line the respondent was reading stays in view, wherever they had scrolled to.
    el("messages").scrollTop += el("answerInput").offsetHeight - before;
  });

  fetch("/api/consensus/public/" + encodeURIComponent(surveyId))
    .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); })
    .then(function (data) {
      survey = data;
      survey.questions.forEach(function (q) { if (q.html) richByText[q.text] = q.html; });
      el("surveyTitle").textContent = survey.name;
      document.title = survey.name;
      if (!survey.questions.length) { showNotice("This survey has no questions yet."); return; }
      if (!token) { startQuestion(0); return; }
      fetch("/api/consensus/progress/" + encodeURIComponent(surveyId) + "/" + encodeURIComponent(token))
        .then(function (r) { if (!r.ok) throw new Error("none"); return r.json(); })
        .then(function (b) { keptDays = b.keptDays || keptDays; resume(b.draft); })
        .catch(function () {
          // Submitted, expired or never saved: start fresh under a new token.
          token = null; writeStore(null);
          startQuestion(0);
        });
    })
    .catch(function () {
      el("surveyTitle").textContent = "Survey not found";
      showNotice("This survey link doesn't look right. Double-check the link and try again.");
    });
})();
</script>
</body>
</html>
