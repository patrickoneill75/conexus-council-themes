<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary Allocation control panel — Connector</title>
<script src="/access.js" data-app="salary-allocation" data-need="admin"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307214e'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='white'/%3E%3Crect x='7' y='15' width='11' height='3' rx='1.5' fill='%23fbae40'/%3E%3Crect x='7' y='21' width='14' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/salary-allocation/sa.css">
<script src="/salary-allocation/sa.js"></script>
</head>
<body class="sa">
<header class="sa-bar wide">
  <div class="in">
    <a class="name" href="/salary-allocation/">Salary Allocation</a>
    <span class="sub">Control panel</span>
    <div class="tools">
      <a href="/salary-allocation/">My month</a>
      <a href="/admin/">Admin hub</a>
      <button type="button" id="signOut">Sign out</button>
    </div>
  </div>
</header>

<main class="sa-wrap wide">
  <nav class="tabs" aria-label="Control panel" id="tabs">
    <a href="#allocations" data-tab="allocations">Allocations</a>
    <a href="#people" data-tab="people">People</a>
    <a href="#positions" data-tab="positions">Positions</a>
    <a href="#projects" data-tab="projects">Projects</a>
    <a href="#holidays" data-tab="holidays">Holidays</a>
  </nav>
  <p class="warn" id="loadErr" role="alert" hidden style="margin-top:20px"></p>
  <div id="view"></div>
</main>

<dialog class="sa-dlg" id="dlg" aria-labelledby="dlgTitle"></dialog>
<input type="file" id="importFile" accept=".xlsx,.csv" hidden>

<script>
(function () {
  "use strict";
  if (!window.SA) return;
  var esc = SA.esc, $ = function (id) { return document.getElementById(id); };
  var D = null;                                   // the lists, as the server holds them
  var S = { tab: "allocations", month: SA.thisMonth(), q: "", year: String(new Date().getFullYear()), peopleView: "table", draft: {}, draftMonth: "",
    sort: { allocations: { key: "last", dir: 1 }, people: { key: "last", dir: 1 }, positions: { key: "title", dir: 1 }, projects: { key: "type", dir: -1 },
      holidays: { key: "start", dir: 1 } } };
  var X = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
  var LEFT = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>';
  var RIGHT = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';
  $("signOut").addEventListener("click", SA.signOut);

  /* ---- reading the lists */
  function addMonths(m, by) { var d = new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + by, 1)); return d.toISOString().slice(0, 7); }
  function allocationFor(p, month) {
    var best = null;
    (p.allocations || []).forEach(function (a) { if (a.from <= month && (!best || a.from > best.from)) best = a; });
    return best;
  }
  function linesFor(p, month) { var a = allocationFor(p, month); return a ? a.lines : []; }
  function project(id) { return D.projects.filter(function (p) { return p.id === id; })[0]; }
  function position(id) { return D.positions.filter(function (p) { return p.id === id; })[0]; }
  function nameOf(p) { return (p.first + " " + p.last).trim() || "Open position"; }
  function titleOf(p) { var x = position(p.positionId); return x ? x.title : ""; }
  function people() { return D.people.slice().sort(function (a, b) { return (a.last || "~").localeCompare(b.last || "~") || a.first.localeCompare(b.first); }); }
  function byFunding(list) { return list.slice().sort(function (a, b) { return (a.type === b.type ? 0 : a.type === "c6" ? -1 : 1) || a.name.localeCompare(b.name); }); }
  function guess(first, last) {
    var f = first.toLowerCase().replace(/[^a-z]/g, ""), l = last.toLowerCase().replace(/[^a-z]/g, "");
    return f && l ? f[0] + l + "@conexusindiana.com" : "";
  }
  function count(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function monthNav(id, month) {
    return '<div class="monthnav"><button type="button" class="round" data-mnav="' + id + '" data-by="-1" aria-label="Previous month">' + LEFT + "</button>" +
      "<b aria-live=\"polite\">" + esc(SA.monthName(month)) + '</b><button type="button" class="round" data-mnav="' + id + '" data-by="1" aria-label="Next month">' + RIGHT + "</button></div>";
  }

  function load() {
    return SA.api("admin/data").then(function (r) { D = r.data; render(); })
      .catch(function (err) { $("loadErr").hidden = false; $("loadErr").textContent = err.message; });
  }
  function render() {
    var tab = (location.hash || "#allocations").slice(1);
    if (tab === "teams") { tab = "people"; S.peopleView = "teams"; } // the old Teams tab is now a view of People
    S.tab = ["allocations", "people", "positions", "projects", "holidays"].indexOf(tab) >= 0 ? tab : "allocations";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs a"), function (a) {
      if (a.getAttribute("data-tab") === S.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (!D) return;
    var wrap = document.querySelector(".orgwrap"), keep = wrap ? wrap.scrollLeft : 0;
    $("view").innerHTML = ({ allocations: allocations, people: peopleTab, positions: positionsTab, projects: projectsTab, holidays: holidaysTab })[S.tab]();
    wrap = document.querySelector(".orgwrap");
    if (wrap) wrap.scrollLeft = keep;
    updateBar();
    drawOrg();
  }
  window.addEventListener("hashchange", render);

  /* ---- sorting: every column header is a button; a second click turns the order around */
  function cmp(x, y) {
    if (typeof x === "number" && typeof y === "number") return x - y;
    var a = String(x), b = String(y);
    if (!a !== !b) return a ? -1 : 1; // blanks last
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  }
  function sorted(list, tab, getters) {
    var s = S.sort[tab], get = getters[s.key] || getters[Object.keys(getters)[0]];
    var blank = function (v) { return v === "" || v == null; };
    return list.slice().sort(function (a, b) {
      var x = get(a), y = get(b);
      if (blank(x) !== blank(y)) return blank(x) ? 1 : -1; // blanks last, whichever way
      return cmp(x, y) * s.dir || cmp(nameOf(a.person || a), nameOf(b.person || b));
    });
  }
  function ariaSort(tab, keys) {
    var s = S.sort[tab];
    return keys.indexOf(s.key) >= 0 ? (s.dir > 0 ? "ascending" : "descending") : "none";
  }
  function sortBtn(tab, key, label) {
    var s = S.sort[tab], on = s.key === key;
    return '<button type="button" class="sorter" data-sort="' + tab + ":" + esc(key) + '">' + esc(label) + '<span aria-hidden="true" class="arrow">' + (on ? (s.dir > 0 ? "▲" : "▼") : "") + "</span></button>";
  }
  function th(tab, key, label, attrs) {
    return "<th " + (attrs || 'scope="col"') + ' aria-sort="' + ariaSort(tab, [key]) + '">' + sortBtn(tab, key, label) + "</th>";
  }
  function team(id) { return D.teams.filter(function (t) { return t.id === id; })[0]; }
  function teamOf(p) { var t = team(p.teamId); return t ? t.name : ""; }
  function personLinks(p) {
    return [p.first ? '<button type="button" class="linkish namelink" data-person="' + esc(p.id) + '">' + esc(p.first) + "</button>" : '<button type="button" class="linkish namelink" data-person="' + esc(p.id) + '">Open position</button>',
      p.last ? '<button type="button" class="linkish namelink" data-person="' + esc(p.id) + '">' + esc(p.last) + "</button>" : ""];
  }

  /* ---- Allocations: a report, one month at a time */
  function allocations() {
    var month = S.month;
    var used = {};
    D.people.forEach(function (p) { linesFor(p, month).forEach(function (l) { used[l.projectId] = true; }); });
    var cols = byFunding(D.projects.filter(function (p) { return p.active !== false || used[p.id]; }));
    var c6 = cols.filter(function (p) { return p.type === "c6"; }).length, c3 = cols.length - c6;
    var pctOf = function (p, id) { var l = linesFor(p, month).filter(function (x) { return x.projectId === id; })[0]; return l ? l.pct : 0; };
    var totalOf = function (p) { return linesFor(p, month).reduce(function (s, l) { return s + l.pct; }, 0); };
    var getters = { first: function (p) { return p.first; }, last: function (p) { return p.last; }, total: totalOf };
    cols.forEach(function (c) { getters["p:" + c.id] = function (p) { return pctOf(p, c.id); }; });
    var list = sorted(D.people, "allocations", getters);
    if (S.draftMonth !== month) { S.draft = {}; S.draftMonth = month; }
    var tot = { c6: 0, c3: 0 }, off = [];
    var rows = list.map(function (p) {
      var sum = totalOf(p), draft = S.draft[p.id] || {};
      var cells = cols.map(function (c) {
        var n = pctOf(p, c.id), has = Object.prototype.hasOwnProperty.call(draft, c.id);
        tot[c.type] += n;
        // An inactive project is offered only to someone who has had it.
        var locked = c.active === false && !hadProject(p, c.id);
        return '<td class="pc' + (has ? " edited" : "") + (has && !validPct(draft[c.id]) ? " bad" : "") + '"><span class="cw"><input class="cell" inputmode="decimal" autocomplete="off" placeholder=" "' +
          ' data-cell="' + esc(p.id) + '" data-proj="' + esc(c.id) + '" value="' + esc(has ? draft[c.id] : n ? String(SA.r2(n)) : "") + '"' +
          ' aria-label="' + esc(nameOf(p) + ", " + c.name + ", percent of salary") + '"' + (locked ? ' disabled title="Inactive project"' : "") + '><i aria-hidden="true">%</i></span></td>';
      }).join("");
      var ok = Math.abs(sum - 100) < 0.001;
      if (!ok) off.push(nameOf(p) + " " + SA.r2(sum) + "%");
      sum = draftTotal(p, month);
      ok = Math.abs(sum - 100) < 0.001;
      return '<tr><td class="stick"><button type="button" class="linkish namelink" data-alloc="' + esc(p.id) + '">' + esc(nameOf(p)) + '</button><span class="pos">' + esc(titleOf(p)) + "</span></td>" + cells +
        '<td class="r" style="white-space:nowrap" data-total="' + esc(p.id) + '">' + totalHtml(sum) + "</td></tr>";
    }).join("");
    var fte = cols.map(function (c) { return '<td class="pc">' + (D.people.reduce(function (s, p) { return s + pctOf(p, c.id); }, 0) / 100).toFixed(2) + "</td>"; }).join("");
    var all = tot.c6 + tot.c3, open = D.people.filter(function (p) { return !p.first && !p.last; }).length;
    return '<div class="head"><div><h1>Allocations</h1><p class="lede">Type in any cell to change a split, or click a name for the full allocation. Save a change for this month only or for this month and every month after. Earlier months keep their split.</p></div>' +
      '<div class="acts">' + monthNav("report", month) + '<button type="button" class="btn" id="importBtn">Import spreadsheet</button><button type="button" class="btn" id="csvBtn">Download</button></div></div>' +
      '<div class="cards4">' +
      '<div class="stat"><p>Staff time on c6</p><p class="v">' + (tot.c6 / 100).toFixed(2) + ' FTE</p><p>' + (all ? Math.round(tot.c6 / all * 100) : 0) + "% of staff time</p></div>" +
      '<div class="stat"><p>Staff time on c3</p><p class="v">' + (tot.c3 / 100).toFixed(2) + ' FTE</p><p>' + (all ? Math.round(tot.c3 / all * 100) : 0) + "% of staff time</p></div>" +
      '<div class="stat"><p>People</p><p class="v">' + list.length + "</p><p>" + (open ? "including " + count(open, "open position", "open positions") : "no open positions") + "</p></div>" +
      '<div class="stat' + (off.length ? " warn-card" : "") + '"><p>Not at 100%</p><p class="v">' + off.length + "</p><p>" + esc(off.join(", ") || "Everyone adds up") + "</p></div></div>" +
      (list.length ? '<div class="tbl-box" style="margin-top:20px"><table class="tbl grid" style="min-width:' + (330 + cols.length * 100) + 'px"><thead><tr>' +
        '<th scope="col" rowspan="2" class="stick" style="vertical-align:bottom" aria-sort="' + ariaSort("allocations", ["first", "last"]) + '"><span class="sorters">' +
        sortBtn("allocations", "first", "First") + sortBtn("allocations", "last", "Last") + "</span></th>" +
        (c6 ? '<th colspan="' + c6 + '" class="grp c6" scope="colgroup">c6</th>' : "") + (c3 ? '<th colspan="' + c3 + '" class="grp c3" scope="colgroup">c3</th>' : "") +
        th("allocations", "total", "Total", 'scope="col" rowspan="2" class="r" style="vertical-align:bottom"') + "</tr><tr>" +
        cols.map(function (c) { return th("allocations", "p:" + c.id, c.name, 'scope="col" class="pj"'); }).join("") + "</tr></thead><tbody>" + rows +
        '<tr class="fte"><td class="stick" style="color:var(--navy)">Staff time (FTE)</td>' + fte + "<td></td></tr></tbody></table></div>" +
        '<p class="note" style="margin-top:12px">Type in any cell to change a split; a blank cell is 0%. Enter or the arrow keys move up and down, Escape undoes a cell. Click a name for the full allocation, or a column heading to sort.</p>' +
        '<div class="savebar" id="saveBar" role="region" aria-label="Unsaved changes" hidden></div>'
        : '<div class="card" style="margin-top:20px"><p style="margin:0">No one is on the list yet. Import the allocation spreadsheet (Position, First, Last, Project, Allocation, Funding Type), or add people on the People tab.</p></div>');
  }

  /* ---- Typing in the Allocations report. Edits wait in S.draft ({ personId: { projectId: "text" } }) until
   * saved for this month only or for this month and every month after. */
  function hadProject(p, id) { return (p.allocations || []).some(function (a) { return a.lines.some(function (l) { return l.projectId === id; }); }); }
  function validPct(v) { var t = String(v).trim(), n = Number(t); return t === "" || (isFinite(n) && n >= 0 && n <= 100); }
  function draftLines(p, month) {
    var draft = S.draft[p.id] || {}, out = {};
    linesFor(p, month).forEach(function (l) { out[l.projectId] = l.pct; });
    Object.keys(draft).forEach(function (id) { out[id] = Number(String(draft[id]).trim()) || 0; });
    return Object.keys(out).filter(function (id) { return out[id] > 0; }).map(function (id) { return { projectId: id, pct: out[id] }; });
  }
  function draftTotal(p, month) { return draftLines(p, month).reduce(function (s, l) { return s + l.pct; }, 0); }
  function totalHtml(sum) {
    var ok = Math.abs(sum - 100) < 0.001;
    return '<span class="' + (ok ? "" : "pill-warn") + '" style="' + (ok ? "font-weight:700;color:var(--navy)" : "") + '">' + SA.r2(sum) + "%</span>";
  }
  function draftCount() {
    var cells = 0, people = Object.keys(S.draft);
    people.forEach(function (id) { cells += Object.keys(S.draft[id]).length; });
    return { cells: cells, people: people };
  }
  function updateBar() {
    var bar = $("saveBar");
    if (!bar) return;
    var n = draftCount(), month = SA.monthOnly(S.month);
    bar.hidden = !n.cells;
    if (!n.cells) { bar.innerHTML = ""; return; }
    var bad = document.querySelectorAll("td.pc.bad").length;
    var planned = n.people.map(function (id) { return D.people.filter(function (p) { return p.id === id; })[0]; })
      .filter(function (p) { return p && (p.allocations || []).some(function (a) { return a.from > S.month; }); });
    bar.innerHTML = '<div class="sb-text"><b>' + count(n.cells, "change", "changes") + "</b> for " + count(n.people.length, "person", "people") +
      (bad ? '<span class="sb-bad">Fix the ' + count(bad, "cell", "cells") + " marked in red: a percent from 0 to 100.</span>"
        : planned.length ? '<span class="sb-note">"' + esc(month) + ' and after" replaces the changes already planned for ' + esc(planned.map(nameOf).join(", ")) + ".</span>" : "") + "</div>" +
      '<div class="sb-acts"><button type="button" class="btn ghost" data-draft="discard">Discard</button>' +
      '<button type="button" class="btn" data-draft="month"' + (bad ? " disabled" : "") + ">Save for " + esc(month) + " only</button>" +
      '<button type="button" class="btn primary" data-draft="future"' + (bad ? " disabled" : "") + ">Save for " + esc(month) + " and after</button></div>";
  }
  function saveDraft(scope) {
    var month = S.month, ids = Object.keys(S.draft), chain = Promise.resolve();
    document.querySelectorAll("[data-draft]").forEach(function (b) { b.disabled = true; });
    ids.forEach(function (pid) {
      chain = chain.then(function () {
        var p = D.people.filter(function (x) { return x.id === pid; })[0];
        if (!p) { delete S.draft[pid]; return; }
        return SA.post("admin/allocation", { personId: pid, from: month, lines: draftLines(p, month), scope: scope }).then(function (r) { D = r.data; delete S.draft[pid]; });
      });
    });
    chain.then(render).catch(function (err) { render(); alert(err.message); });
  }
  $("view").addEventListener("input", function (e) {
    var t = e.target;
    if (!t.hasAttribute || !t.hasAttribute("data-cell")) return;
    var pid = t.getAttribute("data-cell"), id = t.getAttribute("data-proj");
    var p = D.people.filter(function (x) { return x.id === pid; })[0];
    var saved = linesFor(p, S.month).filter(function (l) { return l.projectId === id; })[0];
    var d = S.draft[pid] = S.draft[pid] || {};
    // Back to what is saved is no change at all.
    if ((Number(t.value.trim()) || 0) === (saved ? saved.pct : 0) && validPct(t.value)) delete d[id]; else d[id] = t.value;
    if (!Object.keys(d).length) delete S.draft[pid];
    var td = t.closest("td");
    td.classList.toggle("edited", Object.prototype.hasOwnProperty.call(d, id));
    td.classList.toggle("bad", !validPct(t.value));
    var cell = document.querySelector('[data-total="' + pid + '"]'); if (cell) cell.innerHTML = totalHtml(draftTotal(p, S.month));
    updateBar();
  });
  $("view").addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t.hasAttribute || !t.hasAttribute("data-cell")) return;
    if (e.key === "Escape") {
      var p = D.people.filter(function (x) { return x.id === t.getAttribute("data-cell"); })[0];
      var saved = linesFor(p, S.month).filter(function (l) { return l.projectId === t.getAttribute("data-proj"); })[0];
      t.value = saved ? String(SA.r2(saved.pct)) : "";
      t.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    var by = e.key === "Enter" || e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
    if (!by) return;
    e.preventDefault();
    var col = Array.prototype.slice.call(document.querySelectorAll('input.cell[data-proj="' + t.getAttribute("data-proj") + '"]:not([disabled])'));
    var next = col[col.indexOf(t) + by];
    if (next) { next.focus(); next.select(); }
  });
  $("view").addEventListener("focusin", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-cell")) e.target.select(); });
  window.addEventListener("beforeunload", function (e) { if (draftCount().cells) { e.preventDefault(); e.returnValue = ""; } });

  /* ---- People: a table, the org chart, or the table grouped by team */
  function peopleTab() {
    var q = S.q.trim().toLowerCase();
    var seg = function (v, label) { return '<button type="button" data-view="' + v + '" aria-pressed="' + (S.peopleView === v) + '">' + label + "</button>"; };
    var top = '<div class="head"><div><h1>People</h1><p class="lede">' + count(D.people.length, "person", "people") + ". Click a name to see or change their details, team, who they report to, and allocation. Each person signs in with their email and sees only their own split.</p></div>" +
      '<div class="acts"><div class="seg" role="group" aria-label="View">' + seg("table", "Table") + seg("chart", "Org chart") + seg("teams", "Teams") + "</div>" +
      (S.peopleView !== "chart" ? '<label class="sr" for="find">Find a person</label><input class="find" id="find" placeholder="Find a person" value="' + esc(S.q) + '">' : "") +
      (S.peopleView === "teams" ? '<button type="button" class="btn" data-team="">Add team</button>' : "") +
      '<button type="button" class="btn primary" data-person="">Add person</button></div></div>';
    if (S.peopleView === "chart") return top + orgChart();
    var list = sorted(D.people.filter(function (p) { return !q || (nameOf(p) + " " + titleOf(p) + " " + teamOf(p)).toLowerCase().indexOf(q) >= 0; }), "people",
      { first: function (p) { return p.first; }, last: function (p) { return p.last; }, position: titleOf, team: teamOf });
    if (S.peopleView === "teams") return top + byTeam(list, q);
    return top + '<div class="tbl-box" style="margin-top:16px"><table class="tbl"><thead><tr>' + th("people", "first", "First") + th("people", "last", "Last") + th("people", "position", "Position") + th("people", "team", "Team") + "</tr></thead><tbody>" +
      (list.map(function (p) { var l = personLinks(p); return "<tr><td>" + l[0] + "</td><td>" + l[1] + "</td><td>" + esc(titleOf(p)) + "</td><td>" + esc(teamOf(p) || "") + "</td></tr>"; }).join("") ||
        '<tr><td colspan="4" class="muted">No one matches.</td></tr>') + "</tbody></table></div>";
  }
  /** The people table, one section per team. A team's name opens it to rename or remove; people on no team come last. */
  function byTeam(list, q) {
    var groups = D.teams.slice().sort(function (a, b) { return cmp(a.name, b.name); }).map(function (t) { return { t: t, people: list.filter(function (p) { return p.teamId === t.id; }) }; });
    groups.push({ t: null, people: list.filter(function (p) { return !team(p.teamId); }) });
    var body = groups.filter(function (g) { return g.t ? !q || g.people.length : g.people.length; }).map(function (g) {
      var head = '<tr class="teamrow"><th scope="rowgroup" colspan="3">' +
        (g.t ? '<button type="button" class="linkish namelink" data-team="' + esc(g.t.id) + '">' + esc(g.t.name) + "</button>" : "No team") +
        '<span class="n">' + count(g.people.length, "person", "people") + "</span></th></tr>";
      return "<tbody>" + head + (g.people.map(function (p) { var l = personLinks(p); return "<tr><td>" + l[0] + "</td><td>" + l[1] + "</td><td>" + esc(titleOf(p)) + "</td></tr>"; }).join("") ||
        '<tr><td colspan="3" class="muted">No one on this team yet.</td></tr>') + "</tbody>";
    }).join("");

  /** Who reports to whom, from each person's Reports to: a tree from the top down, lines drawn by drawOrg.

  /** The chart's lines: an elbow from each manager down to each report. The chain from the top to the chosen

  /* ---- Org chart zoom: the buttons, Ctrl or Cmd with the wheel (a trackpad pinch arrives this way), and two

    var px = atX == null ? w.width / 2 : atX - w.left, at = (wrap.scrollLeft + px) / old;

      })).concat([SA.r2(sum)]));
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([rows.map(function (r) { return r.map(q).join(","); }).join("\n")], { type: "text/csv" }));
    a.download = "salary-allocation-" + S.month + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---- the pop-ups */
  var dlg = $("dlg"), close = function () { dlg.close(); };
  function show(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
  function head(title, sub) {
    return '<div class="dh"><div><h2 id="dlgTitle">' + esc(title) + "</h2>" + (sub ? '<p class="note" style="font-size:14px;margin-top:2px">' + esc(sub) + "</p>" : "") + '</div><button type="button" class="x" data-close aria-label="Close">' + X + "</button></div>";
  }
  function foot(removeLabel) {
    return '<p class="err" id="dlgErr" role="alert" hidden></p><div class="foot">' + (removeLabel ? '<button type="button" class="linkish muted" data-remove>' + esc(removeLabel) + "</button>" : "") +
      '<span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" data-save>Save</button></div>';
  }
  function fail(err) { var el = $("dlgErr"); if (el) { el.hidden = false; el.textContent = err.message; } }
  var handlers = {};
  dlg.addEventListener("click", function (e) {
    if (e.target === dlg) { close(); return; }
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-close")) { close(); return; }
    if (handlers.click) handlers.click(b);
  });
  dlg.addEventListener("input", function (e) { if (handlers.input) handlers.input(e.target); });
  dlg.addEventListener("change", function (e) { if (handlers.change) handlers.change(e.target); });
  function done(r) { D = r.data; render(); close(); }

  /** A person: details and their allocation for a month, or the allocation alone (from the report). */
  function openPerson(id, allocOnly) {
    var p = id ? D.people.filter(function (x) { return x.id === id; })[0] : null;
    var st = { month: S.month, first: p ? p.first : "", last: p ? p.last : "", email: p ? p.email : "", touched: p ? p.email !== guess(p.first, p.last) : false,
      positionId: p ? p.positionId : "", teamId: p ? p.teamId || "" : "", managerId: p ? p.managerId || "" : "", lines: null, adding: false, scope: "future" };
    // Who they can report to: anyone but themselves and the people who report up to them.
    var below = function (pid) { var out = [], walk = function (m) { D.people.forEach(function (x) { if (x.managerId === m && out.indexOf(x.id) < 0) { out.push(x.id); walk(x.id); } }); }; walk(pid); return out; };
    var notManagers = p ? below(p.id).concat([p.id]) : [];
    function load(month) { st.month = month; st.lines = (p ? linesFor(p, month) : []).map(function (l) { return { projectId: l.projectId, pct: String(l.pct) }; }); st.saved = JSON.stringify(st.lines); }
    load(S.month);
    function allocHtml() {
      var total = st.lines.reduce(function (s, l) { return s + (Number(l.pct) || 0); }, 0), ok = Math.abs(total - 100) < 0.001;
      var later = p ? (p.allocations || []).filter(function (a) { return a.from > st.month; }).map(function (a) { return a.from; })[0] : null;
      var choices = D.projects.filter(function (x) { return x.active !== false && !st.lines.some(function (l) { return l.projectId === x.id; }); });
      return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:20px' + (allocOnly ? "" : ";padding-top:18px;border-top:1px solid var(--border)") + '">' +
        '<h3 style="margin:0">Allocation</h3>' + monthNav("dlg", st.month) + "</div>" +
        '<div style="margin-top:6px">' + st.lines.map(function (l, i) {
          var x = project(l.projectId) || { name: "(removed project)", type: "" };
          return '<div class="line"><span class="nm">' + esc(x.name) + ' <span class="note" style="display:inline;font-weight:600">' + esc(x.type) + "</span>" + (x.active === false ? '<span class="status-off">Inactive</span>' : "") + "</span>" +
            '<input class="pct" inputmode="decimal" data-pct="' + i + '" aria-label="Percent of salary from ' + esc(x.name) + '" value="' + esc(l.pct) + '"><span class="muted">%</span>' +
            '<button type="button" class="rm" data-rm="' + i + '" aria-label="Remove ' + esc(x.name) + '">' + X + "</button></div>";
        }).join("") + "</div>" +
        (st.adding
          ? '<div class="line"><label class="sr" for="pick">Project</label><select class="in-box" id="pick" style="height:40px;flex:1 1 auto"><option value="">Choose a project</option>' +
            choices.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name + " (" + x.type + ")") + "</option>"; }).join("") +
            '</select><button type="button" class="btn small primary" data-addpick>Add</button></div>'
          : (choices.length ? '<button type="button" class="add" data-adding>+ Add allocation</button>' : "")) +
        '<div class="tot"><span>Total</span><span class="' + (ok ? "" : "pill-warn") + '">' + SA.r2(total) + "%</span></div>" +
        (ok || !st.lines.length ? "" : '<p class="warn" style="margin:8px 0 0;font-size:14px">' + (total < 100 ? SA.r2(100 - total) + "% of the salary has no project yet. Add an allocation or raise one to reach 100%." : "This adds up to " + SA.r2(total) + "%. Lower one to reach 100%.") + "</p>") +
        (JSON.stringify(st.lines) === st.saved ? "" :
          '<fieldset class="scope"><legend class="field">Apply this change to</legend><div class="seg" role="group">' +
          '<button type="button" data-scope="month" aria-pressed="' + (st.scope === "month") + '">' + esc(SA.monthOnly(st.month)) + " only</button>" +
          '<button type="button" data-scope="future" aria-pressed="' + (st.scope === "future") + '">' + esc(SA.monthOnly(st.month)) + " and after</button></div></fieldset>") +
        '<p class="note" style="margin-top:10px">' + (st.scope === "month"
          ? "Only " + esc(SA.monthName(st.month)) + " changes. " + esc(SA.monthName(addMonths(st.month, 1))) + " keeps the split it has now."
          : "Applies to " + esc(SA.monthName(st.month)) + " and every month after" + (later ? ", replacing the change already planned for " + esc(SA.monthName(later)) : "") + ".") +
        " " + esc(SA.monthName(addMonths(st.month, -1))) + " and earlier keep their split.</p>";
    }
    function draw() {
      var positions = D.positions.filter(function (x) { return x.active !== false || x.id === st.positionId; }).sort(function (a, b) { return a.title.localeCompare(b.title); });
      show(head(p ? nameOf(p) : "Add a person", allocOnly && p ? titleOf(p) : "") +
        (allocOnly ? "" :
          '<h3>Details</h3><div class="two"><div><label class="field" for="dFirst">First name</label><input class="in-box" id="dFirst" value="' + esc(st.first) + '"></div>' +
          '<div><label class="field" for="dLast">Last name</label><input class="in-box" id="dLast" value="' + esc(st.last) + '"></div></div>' +
          '<div class="gap"><label class="field" for="dEmail">Email</label><input class="in-box" id="dEmail" type="email" value="' + esc(st.email) + '">' +
          '<p class="note">Their sign-in, the same as Partner Intelligence. Fills in as first initial and last name at conexusindiana.com. Leave the name blank for an open position.</p></div>' +
          '<div class="gap"><label class="field" for="dPos">Position</label><select class="in-box" id="dPos"><option value="">Choose a position</option>' +
          positions.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === st.positionId ? " selected" : "") + ">" + esc(x.title) + (x.active === false ? " (inactive)" : "") + "</option>"; }).join("") + "</select></div>" +
          '<div class="two"><div><label class="field" for="dTeam">Team</label><select class="in-box" id="dTeam"><option value="">No team</option>' +
          D.teams.slice().sort(function (a, b) { return cmp(a.name, b.name); }).map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === st.teamId ? " selected" : "") + ">" + esc(t.name) + "</option>"; }).join("") + "</select></div>" +
          '<div><label class="field" for="dMgr">Reports to</label><select class="in-box" id="dMgr"><option value="">No one</option>' +
          people().filter(function (x) { return notManagers.indexOf(x.id) < 0; }).map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === st.managerId ? " selected" : "") + ">" + esc(nameOf(x)) + "</option>"; }).join("") + "</select></div></div>") +
        '<div id="allocBox">' + allocHtml() + "</div>" + foot(p && !allocOnly ? "Remove this person" : ""));
    }
    function redrawAlloc() { $("allocBox").innerHTML = allocHtml(); }
    handlers = {
      input: function (t) {
        if (t.id === "dFirst" || t.id === "dLast") {
          st[t.id === "dFirst" ? "first" : "last"] = t.value;
          if (!st.touched) { st.email = guess(st.first, st.last); $("dEmail").value = st.email; }
        } else if (t.id === "dEmail") { st.email = t.value; st.touched = true; }
        else if (t.hasAttribute("data-pct")) {
          st.lines[Number(t.getAttribute("data-pct"))].pct = t.value;
          var at = t.selectionStart, i = t.getAttribute("data-pct"); redrawAlloc();
          var n = dlg.querySelector('[data-pct="' + i + '"]'); n.focus(); n.setSelectionRange(at, at);
        }
      },
      change: function (t) { if (t.id === "dPos") st.positionId = t.value; if (t.id === "dTeam") st.teamId = t.value; if (t.id === "dMgr") st.managerId = t.value; },
      click: function (b) {
        if (b.hasAttribute("data-mnav")) {
          if (JSON.stringify(st.lines) !== st.saved && !window.confirm("Leave " + SA.monthName(st.month) + " without saving its allocation?")) return;
          load(addMonths(st.month, Number(b.getAttribute("data-by")))); st.adding = false; redrawAlloc(); return;
        }
        if (b.hasAttribute("data-scope")) { st.scope = b.getAttribute("data-scope"); redrawAlloc(); return; }
        if (b.hasAttribute("data-rm")) { st.lines.splice(Number(b.getAttribute("data-rm")), 1); redrawAlloc(); return; }
        if (b.hasAttribute("data-adding")) { st.adding = true; redrawAlloc(); var s = $("pick"); if (s) s.focus(); return; }
        if (b.hasAttribute("data-addpick")) { var v = $("pick").value; if (!v) return; st.lines.push({ projectId: v, pct: "" }); st.adding = false; redrawAlloc(); dlg.querySelector('[data-pct="' + (st.lines.length - 1) + '"]').focus(); return; }
        if (b.hasAttribute("data-remove")) {
          if (!window.confirm("Remove " + nameOf(p) + "? Their allocation and saved months go with them.")) return;
          SA.post("admin/person/delete", { id: p.id }).then(done).catch(fail); return;
        }
        if (b.hasAttribute("data-save")) {
          var lines = st.lines.map(function (l) { return { projectId: l.projectId, pct: Number(l.pct) || 0 }; });
          var allocChanged = JSON.stringify(st.lines) !== st.saved;
          var before = D.people.map(function (x) { return x.id; });
          var step = allocOnly ? Promise.resolve({ data: D })
            : SA.post("admin/person", { id: p ? p.id : "", first: st.first, last: st.last, email: st.email, positionId: st.positionId, teamId: st.teamId, managerId: st.managerId });
          step.then(function (r) {
            D = r.data;
            var pid = p ? p.id : (D.people.filter(function (x) { return before.indexOf(x.id) < 0; })[0] || {}).id;
            return allocChanged && pid ? SA.post("admin/allocation", { personId: pid, from: st.month, lines: lines, scope: st.scope }) : r;
          }).then(done).catch(fail);
        }
      },
    };
    draw();
  }

  function openPosition(id) {
    var x = id ? position(id) : null;
    var held = x ? D.people.filter(function (p) { return p.positionId === x.id; }) : [];
    var named = held.filter(function (p) { return p.first || p.last; }), blank = held.filter(function (p) { return !p.first && !p.last; });
    show(head(x ? "Edit position" : "Add a position") +
      '<div class="gap"><label class="field" for="dTitle">Title</label><input class="in-box" id="dTitle" value="' + esc(x ? x.title : "") + '"></div>' +
      '<label class="check"><input type="checkbox" id="dActive"' + (!x || x.active !== false ? " checked" : "") + '> Active, offered when adding or editing a person</label>' +
      // Open only means something while no one is in the role.
      (named.length ? "" : '<label class="check"><input type="checkbox" id="dOpen"' + (blank.length ? " checked" : "") + "> Open, being filled. It shows on the Allocations report as an open position and can be given an allocation.</label>") +
      (x ? '<p style="margin:14px 0 0;color:var(--muted)">' + (named.length ? "Held by " + named.map(function (p) { return '<button type="button" class="linkish" data-holder="' + esc(p.id) + '">' + esc(nameOf(p)) + "</button>"; }).join(", ") +
        ". Renaming the title renames it for them. To remove it, give them another title first." : blank.length ? "No one is in this role yet." : "No one holds this title.") + "</p>" : "") +
      foot(x && !held.length ? "Remove this position" : ""));
    handlers = {
      click: function (b) {
        if (b.hasAttribute("data-holder")) { close(); location.hash = "#people"; openPerson(b.getAttribute("data-holder"), false); return; }
        if (b.hasAttribute("data-remove")) { SA.post("admin/position/delete", { id: x.id }).then(done).catch(fail); return; }
        if (!b.hasAttribute("data-save")) return;
        var open = $("dOpen") ? $("dOpen").checked : undefined;
        var planned = blank.some(function (p) { return (p.allocations || []).length; });
        if (open === false && planned && !confirm("Closing this position removes the open position and its allocation from every month. Close it?")) return;
        SA.post("admin/position", { id: x ? x.id : "", title: $("dTitle").value, active: $("dActive").checked, open: open }).then(done).catch(fail);
      },
    };
  }

  function openProject(id) {
    var x = id ? project(id) : null, type = x ? x.type : "c3";
    var users = x ? D.people.filter(function (p) { return (p.allocations || []).some(function (a) { return a.lines.some(function (l) { return l.projectId === x.id; }); }); }) : [];
    function draw() {
      show(head(x ? "Edit project" : "Add a project") +
        '<div class="gap"><label class="field" for="dName">Project</label><input class="in-box" id="dName" placeholder="Code and name, for example 4820 New Grant" value="' + esc(x ? x.name : "") + '"></div>' +
        '<fieldset style="border:0;margin:16px 0 0;padding:0"><legend class="field" style="padding:0">Funding</legend><div class="seg" role="group">' +
        '<button type="button" data-type="c3" aria-pressed="' + (type === "c3") + '">c3</button><button type="button" data-type="c6" aria-pressed="' + (type === "c6") + '">c6</button></div></fieldset>' +
        '<label class="check"><input type="checkbox" id="dActive"' + (!x || x.active !== false ? " checked" : "") + '> Active, offered for a new allocation</label>' +
        (x ? '<p class="note" style="font-size:14px;margin-top:14px">' + (users.length ? count(users.length, "person has", "people have") + " it in an allocation, now or in an earlier month. Make it inactive to stop offering it; to remove it, take it off their allocations first." : "No one has it in an allocation.") + "</p>" : "") +
        foot(x && !users.length ? "Remove this project" : ""));
    }
    handlers = {
      click: function (b) {
        if (b.hasAttribute("data-type")) {
          type = b.getAttribute("data-type");
          Array.prototype.forEach.call(dlg.querySelectorAll("[data-type]"), function (n) { n.setAttribute("aria-pressed", String(n.getAttribute("data-type") === type)); });
          return;
        }
        if (b.hasAttribute("data-remove")) { SA.post("admin/project/delete", { id: x.id }).then(done).catch(fail); return; }
        if (b.hasAttribute("data-save")) SA.post("admin/project", { id: x ? x.id : "", name: $("dName").value, type: type, active: $("dActive").checked }).then(done).catch(fail);
      },
    };
    draw();
  }

  function openHoliday(id) {
    var h = id ? D.holidays.filter(function (x) { return x.id === id; })[0] : null;
    show(head(h ? "Edit holiday" : "Add a holiday") +
      '<div class="gap"><label class="field" for="dName">Name</label><input class="in-box" id="dName" value="' + esc(h ? h.name : "") + '"></div>' +
      '<div class="two"><div><label class="field" for="dStart">Date</label><input class="in-box" id="dStart" type="date" value="' + esc(h ? h.start : "") + '"></div>' +
      '<div><label class="field" for="dEnd">Through (optional)</label><input class="in-box" id="dEnd" type="date" value="' + esc(h ? h.end : "") + '"></div></div>' +
      '<p class="note">Add a Through date for a holiday that spans days, such as the day after Thanksgiving. Weekends in the range are skipped.</p>' +
      foot(h ? "Remove this holiday" : ""));
    // The Through date opens on the start's month: a date picker opens on its value, or on today when empty.
    // So it follows the start until someone sets it, and a Through equal to the start is a one-day holiday.
    var follow = !(h && h.end);
    var track = function () {
      var start = $("dStart").value, end = $("dEnd");
      end.min = start;
      if (start && (follow || !end.value || end.value < start)) { end.value = start; follow = true; }
    };
    track();
    handlers = {
      input: function (el) { if (el.id === "dStart") track(); else if (el.id === "dEnd") follow = false; },
      change: function (el) { if (el.id === "dStart") track(); },
      click: function (b) {
        if (b.hasAttribute("data-remove")) { SA.post("admin/holiday/delete", { id: h.id }).then(done).catch(fail); return; }
        var start = $("dStart").value, end = $("dEnd").value;
        if (b.hasAttribute("data-save")) SA.post("admin/holiday", { id: h ? h.id : "", name: $("dName").value, start: start, end: end === start ? "" : end }).then(done).catch(fail);
      },
    };
  }

  function openTeam(id) {
    var t = id ? team(id) : null;
    var members = t ? D.people.filter(function (p) { return p.teamId === t.id; }) : [];
    show(head(t ? "Edit team" : "Add a team") +
      '<div class="gap"><label class="field" for="dName">Team</label><input class="in-box" id="dName" value="' + esc(t ? t.name : "") + '"></div>' +
      (t ? '<p style="margin:14px 0 0;color:var(--muted)">' + (members.length ? "On this team: " + members.map(function (p) { return '<button type="button" class="linkish" data-member="' + esc(p.id) + '">' + esc(nameOf(p)) + "</button>"; }).join(", ") +
        ". To remove the team, move them to another team first." : "No one is on this team.") + "</p>" : "") +
      foot(t && !members.length ? "Remove this team" : ""));
    handlers = {
      click: function (b) {
        if (b.hasAttribute("data-member")) { close(); location.hash = "#people"; openPerson(b.getAttribute("data-member"), false); return; }
        if (b.hasAttribute("data-remove")) { SA.post("admin/team/delete", { id: t.id }).then(done).catch(fail); return; }
        if (b.hasAttribute("data-save")) SA.post("admin/team", { id: t ? t.id : "", name: $("dName").value }).then(done).catch(fail);
      },
    };
  }

  render();
  load();
})();
</script>
</body>
</html>
