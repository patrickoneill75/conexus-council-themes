<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<script src="/apps.js"></script>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5;
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:32px 20px 64px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px;
           flex-wrap:wrap; margin-bottom:26px; }
  h1 { font-size:22px; font-weight:650; margin:0; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:13.5px; margin:4px 0 0; }
  a.link { color:var(--accent); font-size:13px; text-decoration:none; font-weight:600; }
  a.link:hover { text-decoration:underline; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:12px;
          padding:20px; display:flex; flex-direction:column; }
  .card h3 { margin:0 0 8px; font-size:15px; }
  .card p { margin:0; font-size:12.5px; color:var(--text-secondary); flex:1; }
  .card a.open { display:inline-block; margin-top:16px; font:inherit; font-size:12.5px;
                 font-weight:600; border-radius:8px; border:1px solid var(--accent);
                 padding:8px 12px; text-decoration:none; color:#fff; background:var(--accent); }
  .empty { color:var(--text-muted); font-size:13px; padding:40px 0; text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Connector</h1>
      <p class="sub">A hub for AI-powered tools at Conexus Indiana.</p>
    </div>
    <a class="link" href="/admin/login.html">Admin login</a>
  </header>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing is public yet.</p>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  fetch("/api/beta/app-visibility").then(function (r) { return r.json(); }).then(function (body) {
    var visibility = body.visibility || {};
    // Only "public" apps get a tile here -- no control-panel link ever appears on
    // this page. "hidden" and "admin-only" apps are reachable at their own URL if
    // someone already has the link, just not advertised here.
    var apps = APPS.filter(function (app) { return visibility[app.id] === "public"; });
    if (!apps.length) { el("empty").hidden = false; return; }
    el("grid").innerHTML = apps.map(function (app) {
      return '<div class="card">' +
        "<h3>" + esc(app.name) + "</h3>" +
        "<p>" + esc(app.description || "") + "</p>" +
        '<a class="open" href="' + esc(app.baseUrl) + '">Open &rarr;</a>' +
        "</div>";
    }).join("");
  }).catch(function () {
    el("empty").hidden = false;
    el("empty").textContent = "Couldn't load the app list -- try reloading.";
  });
})();
</script>
</body>
</html>
