<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council Themes &amp; Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">

<!-- =====================================================================
     CONFIG — the only part you edit by hand. Box and the themes content
     are all handled in the control panel at /admin.html.
     ===================================================================== -->
<script>
const CONFIG = {
  title:    "Council Meeting Survey Dashboard",
  subtitle: "Conexus Indiana",

  // The "Publish to web" link, exactly as Power BI gave it to you.
  //
  // Use the ?r=... one. Do NOT use the reportEmbed?reportId=...&autoAuth=true link —
  // that is "Embed for your organization", which makes every viewer sign in to Power BI
  // with a Conexus account. Anyone outside Conexus just hits a login wall.
  reportUrl: "https://app.powerbi.com/view?r=eyJrIjoiNmQ1ODgxMDctMThjZi00YTU3LWI1MTktMjhhMTJhZWFkMmYxIiwidCI6ImRmZTUzZWJhLWE1ZjEtNGUxMi1hMTg2LWIyNTE1NzhiMzY0MyIsImMiOjN9",

  // One entry per Power BI page, in the order you want the buttons to appear.
  // pageId is the ReportSection id from the address bar when you open that page in
  // app.powerbi.com — see the note each tab shows until you fill it in.
  pages: [
    { label: "Benchmarking",    pageId: "e2d4b56ae1d954057545" }
  ],

  themes: {
    enabled: true,
    label: "Council Themes",
    blurb: "This quarter's top issues, and what's recurred since",
    dataUrl: "/council-themes.json"
  },

  quant: {
    enabled: true,
    label: "Claude Dashboard (beta)",
    blurb: "A from-scratch rebuild of the Benchmarking report, computed entirely from uploaded survey data",
    dataUrl: "/quant-dashboard.json"
  }
};
</script>

<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6; --good:#006300; --bad:#d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5; --good:#0ca30c; --bad:#d03b3b;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5; --good:#0ca30c; --bad:#d03b3b;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; }

  header { padding:18px 20px 0; flex:none; }
  .head-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:19px; font-weight:650; margin:0; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:13px; }
  .head-tools { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button { font:inherit; border-radius:8px; border:1px solid var(--border); cursor:pointer;
           padding:7px 13px; background:var(--surface-1); color:var(--text-primary); font-size:12.5px; }
  button:hover { background:var(--wash); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* Page navigation — the whole point of this wrapper. One segmented control, so the
     pages read as a set of choices rather than a menu you have to go looking for. */
  .cutswitch { display:inline-flex; border:1px solid var(--border); border-radius:9px;
               overflow:hidden; background:var(--surface-1); flex-wrap:wrap; }
  .cutswitch button { font:inherit; font-size:13.5px; font-weight:550; padding:9px 18px;
                      border:0; border-radius:0; background:transparent; color:var(--text-secondary); }
  .cutswitch button + button { border-left:1px solid var(--border); }
  .cutswitch button:hover { background:var(--wash); color:var(--text-primary); }
  .cutswitch button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:600; }
  .cutswitch button[aria-pressed="true"]:hover { background:var(--accent); }

  main { flex:1; min-height:0; display:flex; flex-direction:column; padding:14px 20px 20px; }
  .blurb { color:var(--text-secondary); font-size:12.5px; margin:0 0 10px; min-height:18px; }
  .stage { flex:1; min-height:0; position:relative; background:var(--surface-1);
           overflow:hidden; }
  .panel { position:absolute; inset:0; display:none; overflow-y:auto; overflow-x:hidden; }
  .panel.active { display:block; }
  /* The Power BI canvas is 1920x1455. Sizing the frame to that ratio at the stage's
     full width — rather than squeezing it into the stage's height — is what stops
     Power BI's own embed from cramming the report into a small box with its own
     internal scrollbars; the page scrolls instead. */
  .panel iframe { width:100%; aspect-ratio:1920/1455; height:auto;
                  border:0; display:block; }
  .loading { position:absolute; inset:0; display:grid; place-items:center;
             color:var(--text-muted); font-size:13px; pointer-events:none; }

  /* themes */
  .pickers { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;
             padding:16px 20px; border-bottom:1px solid var(--border); flex:none; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field[hidden] { display:none; }
  .field label { font-size:11px; letter-spacing:.04em; text-transform:uppercase;
                 color:var(--text-muted); font-weight:600; }
  .field select { font:inherit; font-size:13.5px; padding:7px 10px; min-width:140px;
                  border:1px solid var(--border); border-radius:8px;
                  background:var(--page); color:var(--text-primary); }
  .field select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .stamp { margin-left:auto; font-size:12px; color:var(--text-muted); align-self:center; }

  /* .doc is the scroll container and spans the full stage width, so its scrollbar sits
     at the true right edge of the page rather than hugging the centered content. The
     content itself is centered by .doc-inner, one level in. */
  .doc { padding:26px 30px 60px; overflow-y:auto; flex:1; }
  .doc-inner { width:100%; max-width:760px; margin:0 auto; }
  .meeting { font-size:19px; font-weight:650; margin:0 0 3px; letter-spacing:-0.015em; }
  .meeting-sub { color:var(--text-muted); font-size:12.5px; margin:0 0 26px; }
  .doc section { margin:0 0 30px; }
  .doc h3 { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
            color:var(--accent); margin:0 0 12px; padding-bottom:7px;
            border-bottom:1px solid var(--border); }
  .doc .empty { color:var(--text-muted); font-size:13px; margin:0; }
  .theme-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .theme-item { border:1px solid var(--border); border-radius:10px; padding:13px 16px;
                background:var(--surface-1); }
  .theme-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px;
                margin-bottom:5px; }
  .theme-summary { font-weight:600; font-size:14px; }
  .theme-count { font-size:11.5px; color:var(--text-muted); white-space:nowrap; flex:none; }
  .theme-tag { font-size:11px; color:var(--text-muted); margin-bottom:8px; }
  .theme-example { margin:0; font-size:12.5px; color:var(--text-secondary); font-style:italic;
                    border-left:2px solid var(--border); padding-left:10px; }

  /* quant dashboard */
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
              gap:14px; margin-bottom:32px; }
  .kpi-card { border:1px solid var(--border); border-radius:10px; padding:16px 18px;
              background:var(--surface-1); }
  .kpi-label { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
               color:var(--text-muted); margin-bottom:8px; }
  .kpi-value { font-size:28px; font-weight:650; letter-spacing:-0.01em; margin-bottom:6px; }
  .kpi-delta { font-size:12.5px; font-weight:600; }
  .kpi-delta.up { color:var(--good); }
  .kpi-delta.down { color:var(--bad); }
  .kpi-delta.flat { color:var(--text-muted); }
  .kpi-compare { font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .chart-svg { width:100%; height:auto; overflow:visible; }
  .chart-legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; }
  .chart-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
  .chart-swatch { width:10px; height:10px; border-radius:2px; flex:none; }

  .notice { margin:24px 30px; padding:18px 20px; max-width:700px; border:1px solid var(--border);
            border-left:3px solid var(--accent); border-radius:10px; background:var(--wash);
            font-size:13.5px; }
  .notice h3 { margin:0 0 8px; font-size:14px; border:0; padding:0;
               text-transform:none; letter-spacing:0; color:var(--text-primary); }
  .notice ol { margin:8px 0 0; padding-left:20px; }
  .notice li { margin-bottom:7px; padding-left:0; }
  .notice li::before { display:none; }
  code { background:var(--wash); border:1px solid var(--border); border-radius:5px;
         padding:1px 5px; font-size:12.5px; }
  a { color:var(--accent); }

  @media (max-width:640px) {
    header { padding:14px 12px 0; } main { padding:12px; }
    .cutswitch { width:100%; } .cutswitch button { flex:1 1 auto; padding:9px 12px; }
    .doc { padding:20px; } .pickers { padding:12px; }
    .field { flex:1 1 130px; } .field select { width:100%; min-width:0; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1 id="title"></h1>
    <span class="sub" id="subtitle"></span>
    <div class="head-tools">
      <button id="linkBtn" type="button" title="Copy a link that opens on this page">Copy link</button>
      <button id="fullBtn" type="button">Full screen</button>
      <button id="themeBtn" type="button">Dark mode</button>
    </div>
  </div>
  <div class="cutswitch" id="nav" role="group" aria-label="Dashboard pages"></div>
</header>

<main>
  <p class="blurb" id="blurb"></p>
  <div class="stage" id="stage"></div>
</main>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var nav = el("nav"), stage = el("stage"), blurb = el("blurb");

  el("title").textContent = CONFIG.title || "Dashboard";
  el("subtitle").textContent = CONFIG.subtitle || "";

  /* ---------- theme ---------- */
  (function theme() {
    var saved = null;
    try { saved = localStorage.getItem("themes-theme"); } catch (e) {}
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    function isDark() {
      var set = document.documentElement.getAttribute("data-theme");
      if (set) return set === "dark";
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function label() { el("themeBtn").textContent = isDark() ? "Light mode" : "Dark mode"; }
    label();
    el("themeBtn").addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("themes-theme", next); } catch (e) {}
      label();
    });
  })();

  /* ---------- tabs ---------- */
  var tabs = CONFIG.pages.map(function (p, i) {
    return { key: "p" + i, kind: "report", label: p.label, blurb: p.blurb || "",
             pageId: p.pageId, slot: i + 1 };
  });
  if (CONFIG.themes && CONFIG.themes.enabled) {
    tabs.push({ key: "themes", kind: "themes",
                label: CONFIG.themes.label || "Themes", blurb: CONFIG.themes.blurb || "" });
  }
  if (CONFIG.quant && CONFIG.quant.enabled) {
    tabs.push({ key: "quant", kind: "quant",
                label: CONFIG.quant.label || "Claude Dashboard (beta)", blurb: CONFIG.quant.blurb || "" });
  }
  tabs.forEach(function (t) {
    t.slug = String(t.label).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t.label;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { show(t.key, true); });
    t.button = b;
    nav.appendChild(b);
  });

  function reportSrc(pageId) {
    var base = CONFIG.reportUrl.trim();
    var join = base.indexOf("?") === -1 ? "?" : "&";
    return base + join + "pageName=" + encodeURIComponent(pageId) +
      "&navContentPaneEnabled=false&filterPaneEnabled=false";
  }

  /* Each report page gets its own frame, created the first time you open that tab and
     then kept alive — so the first click loads and every click after is instant. */
  function mount(t) {
    if (t.panel) return t.panel;
    var panel = document.createElement("div");
    panel.className = "panel";
    if (t.kind === "report") {
      if (!t.pageId || /^PASTE_PAGE_ID/.test(t.pageId)) {
        panel.innerHTML = setupNotice(t);
      } else {
        var load = document.createElement("div");
        load.className = "loading";
        load.textContent = "Loading " + t.label + "…";
        var f = document.createElement("iframe");
        f.src = reportSrc(t.pageId); f.title = t.label; f.allowFullscreen = true;
        f.addEventListener("load", function () { load.remove(); });
        panel.appendChild(load); panel.appendChild(f);
      }
    } else if (t.kind === "themes") {
      panel.appendChild(buildThemes());
    } else {
      panel.appendChild(buildQuant());
    }
    stage.appendChild(panel);
    t.panel = panel;
    return panel;
  }

  /* Shown in place of the report until its page id is filled in. It names the exact
     placeholder to replace, because with several pages "paste the id" is ambiguous and
     pasting the right id into the wrong slot looks like the report is broken. */
  function setupNotice(t) {
    return '<div class="notice"><h3>' + t.label + " isn't wired up yet</h3>" +
      "<p>Open <code>public/index.html</code> in GitHub's web editor and replace " +
      "<code>PASTE_PAGE_ID_" + t.slot + "</code> — the one on the <b>" + t.label +
      "</b> line — with this page's id.</p><ol>" +
      "<li>Open the report in <b>app.powerbi.com</b>, not the shared view link.</li>" +
      "<li>Click <b>" + t.label + "</b> in Power BI's own page list.</li>" +
      "<li>The address bar reads <code>.../reports/&lt;report id&gt;/<b>ReportSection…</b>" +
      "?experience=power-bi</code>. Copy the <code>ReportSection…</code> piece — everything " +
      "after the last slash and before the <code>?</code>.</li>" +
      "<li>Paste it in, commit, and this tab loads.</li></ol></div>";
  }

  var current = null;
  function show(key, pushHash) {
    var t = null;
    tabs.forEach(function (x) { if (x.key === key) t = x; });
    if (!t) t = tabs[0];
    if (!t) return;
    mount(t);
    tabs.forEach(function (x) {
      var on = x === t;
      x.button.setAttribute("aria-pressed", on ? "true" : "false");
      if (x.panel) x.panel.classList.toggle("active", on);
    });
    blurb.textContent = t.blurb || "";
    current = t;
    if (pushHash) history.replaceState(null, "", "#" + t.slug);
  }

  nav.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var i = tabs.indexOf(current);
    if (i < 0) return;
    e.preventDefault();
    var n = (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    show(tabs[n].key, true);
    tabs[n].button.focus();
  });

  el("linkBtn").addEventListener("click", function () {
    var btn = this;
    var url = location.href.split("#")[0] + "#" + (current ? current.slug : "");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { btn.textContent = "Copied"; })
        .catch(function () { btn.textContent = "Copy failed"; });
    }
    setTimeout(function () { btn.textContent = "Copy link"; }, 1600);
  });

  el("fullBtn").addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  });
  document.addEventListener("fullscreenchange", function () {
    el("fullBtn").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
  });

  /* =================== council themes =================== */
  var themeDocs = [];

  function buildThemes() {
    var wrap = document.createElement("div");
    wrap.style.cssText = "position:absolute;inset:0;display:flex;flex-direction:column";
    wrap.innerHTML =
      '<div class="pickers">' +
        '<div class="field"><label for="f-year">Year</label><select id="f-year"></select></div>' +
        '<div class="field"><label for="f-qtr">Quarter</label><select id="f-qtr"></select></div>' +
        '<div class="field"><label for="f-reg">Region</label><select id="f-reg"></select></div>' +
        '<div class="stamp" id="stamp"></div>' +
      '</div><div class="doc" id="doc"></div>';
    loadThemes(wrap);
    return wrap;
  }

  /* council-themes.json is keyed by Survey ID ("{year}-{quarter} {region}", e.g.
     "2026-Q3 Central") -> { current, qoq, yoy, generated, sourceFile }. */
  var SURVEY_ID_RE = /^(\d{4})-(Q[1-4]) (.+)$/;

  function loadThemes(wrap) {
    var doc = wrap.querySelector("#doc");
    doc.innerHTML = '<div class="doc-inner"><p style="color:var(--text-muted)">Loading…</p></div>';
    fetch(CONFIG.themes.dataUrl + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        themeDocs = Object.keys(data || {}).map(function (sid) {
          var m = SURVEY_ID_RE.exec(sid);
          if (!m) return null;
          var d = data[sid] || {};
          return { sid: sid, year: m[1], quarter: m[2], region: m[3],
                    current: d.current || [], qoq: d.qoq || [], yoy: d.yoy || [],
                    generated: d.generated, sourceFile: d.sourceFile };
        }).filter(Boolean);

        if (!themeDocs.length) {
          wrap.querySelector(".pickers").style.display = "none";
          doc.innerHTML = '<div class="doc-inner"><div class="notice" style="margin:0">' +
            "<h3>Nothing published yet</h3>" +
            '<p>Open the <a href="/admin.html">control panel</a>, log in with Box, choose the ' +
            "Synthesis Data File and New Survey Directory, then upload a survey and click " +
            "<b>Analyze</b> — or run <b>Run full re-analysis</b> to publish whatever history " +
            "is already in the Synthesis Data File.</p></div></div>";
          return;
        }
        wrap.querySelector(".pickers").style.display = "";
        wirePickers(wrap);
      });
  }

  function wirePickers(wrap) {
    var yEl = wrap.querySelector("#f-year"), qEl = wrap.querySelector("#f-qtr"),
        rEl = wrap.querySelector("#f-reg");
    function uniq(a) { var seen = {}, out = []; a.forEach(function (v) {
      if (!seen[v]) { seen[v] = 1; out.push(v); } }); return out; }
    function fill(sel, vals, keep) {
      sel.innerHTML = "";
      vals.forEach(function (v) {
        var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o);
      });
      if (keep && vals.indexOf(keep) >= 0) sel.value = keep;
    }
    var years = uniq(themeDocs.map(function (d) { return d.year; })).sort().reverse();
    function refreshQ() {
      fill(qEl, uniq(themeDocs.filter(function (d) { return d.year === yEl.value; })
        .map(function (d) { return d.quarter; })).sort().reverse(), qEl.value);
    }
    function refreshR() {
      fill(rEl, uniq(themeDocs.filter(function (d) {
        return d.year === yEl.value && d.quarter === qEl.value;
      }).map(function (d) { return d.region; })).sort(), rEl.value);
    }
    function render() {
      var hit = null;
      themeDocs.forEach(function (d) {
        if (d.year === yEl.value && d.quarter === qEl.value && d.region === rEl.value) hit = d;
      });
      var gd = hit && hit.generated ? new Date(hit.generated) : null;
      wrap.querySelector("#stamp").textContent = gd && !isNaN(gd) ?
        "Published " + gd.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "";
      renderMeeting(wrap.querySelector("#doc"), hit);
    }
    fill(yEl, years); refreshQ(); refreshR(); render();
    yEl.addEventListener("change", function () { refreshQ(); refreshR(); render(); });
    qEl.addEventListener("change", function () { refreshR(); render(); });
    rEl.addEventListener("change", render);
  }

  var THEME_SECTIONS = [
    { key: "current", title: "This quarter's top issues", empty: "No issues surfaced this quarter." },
    { key: "qoq", title: "Recurring since last quarter", empty: "Nothing recurred from last quarter." },
    { key: "yoy", title: "Recurring over the last year", empty: "Nothing recurred over the last year." }
  ];

  /* Builds DOM nodes and sets textContent, so nothing Claude wrote into a theme is
     ever interpreted as markup. */
  function renderMeeting(doc, hit) {
    doc.textContent = "";
    var inner = document.createElement("div");
    inner.className = "doc-inner";
    doc.appendChild(inner);

    if (!hit) {
      var none = document.createElement("p");
      none.style.color = "var(--text-muted)";
      none.textContent = "No themes published for that meeting yet.";
      inner.appendChild(none);
      return;
    }
    var h = document.createElement("p");
    h.className = "meeting";
    h.textContent = hit.year + " " + hit.quarter + " " + hit.region + " Council Meeting";
    inner.appendChild(h);

    var sub = document.createElement("p");
    sub.className = "meeting-sub";
    sub.textContent = "Themes from the " + hit.quarter + " " + hit.year + " meeting" +
      (hit.sourceFile ? " · " + hit.sourceFile : "");
    inner.appendChild(sub);

    THEME_SECTIONS.forEach(function (sec) {
      var items = hit[sec.key] || [];
      var section = document.createElement("section");
      var t = document.createElement("h3");
      t.textContent = sec.title;
      section.appendChild(t);

      if (!items.length) {
        var p = document.createElement("p");
        p.className = "empty";
        p.textContent = sec.empty;
        section.appendChild(p);
      } else {
        var list = document.createElement("ul");
        list.className = "theme-list";
        items.forEach(function (item) {
          var li = document.createElement("li");
          li.className = "theme-item";

          var head = document.createElement("div");
          head.className = "theme-head";
          var summary = document.createElement("span");
          summary.className = "theme-summary";
          summary.textContent = item.summary || "";
          head.appendChild(summary);
          if (item.count) {
            var count = document.createElement("span");
            count.className = "theme-count";
            count.textContent = item.count + (item.count === 1 ? " mention" : " mentions");
            head.appendChild(count);
          }
          li.appendChild(head);

          if (item.category || item.subcategory) {
            var tag = document.createElement("div");
            tag.className = "theme-tag";
            tag.textContent = [item.category, item.subcategory].filter(Boolean).join(" / ");
            li.appendChild(tag);
          }
          if (item.example) {
            var ex = document.createElement("blockquote");
            ex.className = "theme-example";
            ex.textContent = item.example;
            li.appendChild(ex);
          }
          list.appendChild(li);
        });
        section.appendChild(list);
      }
      inner.appendChild(section);
    });
    doc.scrollTop = 0;
  }

  /* =================== claude dashboard (beta) =================== */
  var quantDocs = [];
  var QUARTER_ORDER = ["Q1", "Q2", "Q3", "Q4"];
  var CATEGORY_ORDER = ["Meeting logistics", "Prepared", "Overall value", "Presentation", "Panel", "Workshop"];
  var CATEGORY_COLOR = {
    "Meeting logistics": "#2a78d6", "Prepared": "#d6852a", "Overall value": "#0ca30c",
    "Presentation": "#a52ad6", "Panel": "#d62a55", "Workshop": "#2ad6c4"
  };

  function quarterTotal(d) { return d.year * 4 + QUARTER_ORDER.indexOf(d.quarter); }
  function docLabel(d) { return d.year + " " + d.quarter + " " + d.region; }

  function buildQuant() {
    var wrap = document.createElement("div");
    wrap.style.cssText = "position:absolute;inset:0;display:flex;flex-direction:column";
    wrap.innerHTML =
      '<div class="pickers">' +
        '<div class="field"><label for="q-meeting">Meeting</label><select id="q-meeting"></select></div>' +
        '<div class="field"><label for="q-compare">Compare to</label><select id="q-compare">' +
          '<option value="prev">Previous quarter</option>' +
          '<option value="yoy">Same quarter last year</option>' +
          '<option value="avg">All-time average</option>' +
          '<option value="specific">Specific meeting…</option>' +
        '</select></div>' +
        '<div class="field" id="q-compare-meeting-field" hidden>' +
          '<label for="q-compare-meeting">Which meeting</label><select id="q-compare-meeting"></select></div>' +
        '<div class="stamp" id="q-stamp"></div>' +
      '</div><div class="doc" id="q-doc"></div>';
    loadQuant(wrap);
    return wrap;
  }

  /* quant-dashboard.json is keyed by Survey ID, same convention as council-themes.json,
     -> { avgAttendees, responses, responseRate, byCategory, generated, sourceFile }. */
  function loadQuant(wrap) {
    var doc = wrap.querySelector("#q-doc");
    doc.innerHTML = '<div class="doc-inner"><p style="color:var(--text-muted)">Loading…</p></div>';
    fetch(CONFIG.quant.dataUrl + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        quantDocs = Object.keys(data || {}).map(function (sid) {
          var m = SURVEY_ID_RE.exec(sid);
          if (!m) return null;
          var d = data[sid] || {};
          return { sid: sid, year: Number(m[1]), quarter: m[2], region: m[3],
                    avgAttendees: d.avgAttendees, responses: d.responses,
                    responseRate: d.responseRate, byCategory: d.byCategory || {},
                    generated: d.generated, sourceFile: d.sourceFile };
        }).filter(Boolean);

        if (!quantDocs.length) {
          wrap.querySelector(".pickers").style.display = "none";
          doc.innerHTML = '<div class="doc-inner"><div class="notice" style="margin:0">' +
            "<h3>Nothing published yet</h3>" +
            '<p>Open the <a href="/admin.html">control panel</a>, log in with Box, choose the ' +
            "Quant Data Folder, upload a survey (alongside the Council Meeting Helper and " +
            "Content Categories reference files), then click <b>Update Dashboard</b>.</p></div></div>";
          return;
        }
        wrap.querySelector(".pickers").style.display = "";
        wireQuantPickers(wrap);
      });
  }

  function wireQuantPickers(wrap) {
    var mEl = wrap.querySelector("#q-meeting"), cEl = wrap.querySelector("#q-compare"),
        cmField = wrap.querySelector("#q-compare-meeting-field"), cmEl = wrap.querySelector("#q-compare-meeting");

    var sorted = quantDocs.slice().sort(function (a, b) { return quarterTotal(b) - quarterTotal(a); });
    mEl.innerHTML = "";
    sorted.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d.sid; o.textContent = docLabel(d);
      mEl.appendChild(o);
    });

    function refreshCompareMeetingOptions() {
      var selected = mEl.value;
      cmEl.innerHTML = "";
      sorted.filter(function (d) { return d.sid !== selected; }).forEach(function (d) {
        var o = document.createElement("option");
        o.value = d.sid; o.textContent = docLabel(d);
        cmEl.appendChild(o);
      });
    }

    function render() {
      refreshCompareMeetingOptions();
      cmField.hidden = cEl.value !== "specific";
      var meeting = null;
      quantDocs.forEach(function (d) { if (d.sid === mEl.value) meeting = d; });
      var gd = meeting && meeting.generated ? new Date(meeting.generated) : null;
      wrap.querySelector("#q-stamp").textContent = gd && !isNaN(gd) ?
        "Published " + gd.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "";
      renderQuantMeeting(wrap.querySelector("#q-doc"), meeting, cEl.value, cmEl.value);
    }

    mEl.addEventListener("change", render);
    cEl.addEventListener("change", render);
    cmEl.addEventListener("change", render);
    render();
  }

  function findByOffset(meeting, quartersBack) {
    var target = quarterTotal(meeting) - quartersBack;
    var hit = null;
    quantDocs.forEach(function (d) {
      if (d.region === meeting.region && quarterTotal(d) === target) hit = d;
    });
    return hit;
  }

  function allTimeAverage(excludeSid) {
    var pool = quantDocs.filter(function (d) { return d.sid !== excludeSid; });
    if (!pool.length) return null;
    function avg(key) {
      var vals = pool.map(function (d) { return d[key]; }).filter(function (v) { return v != null; });
      if (!vals.length) return null;
      return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    }
    return { avgAttendees: avg("avgAttendees"), responses: avg("responses"), responseRate: avg("responseRate") };
  }

  var KPI_DEFS = [
    { key: "avgAttendees", label: "Avg Attendees", fmt: function (v) { return Math.round(v).toLocaleString("en-US"); } },
    { key: "responses", label: "Responses", fmt: function (v) { return Math.round(v).toLocaleString("en-US"); } },
    { key: "responseRate", label: "Response Rate", fmt: function (v) { return Math.round(v * 100) + "%"; } }
  ];

  function renderQuantMeeting(doc, meeting, compareMode, compareSid) {
    doc.textContent = "";
    var inner = document.createElement("div");
    inner.className = "doc-inner";
    doc.appendChild(inner);

    if (!meeting) {
      var none = document.createElement("p");
      none.style.color = "var(--text-muted)";
      none.textContent = "No data published for that meeting yet.";
      inner.appendChild(none);
      return;
    }

    var h = document.createElement("p");
    h.className = "meeting";
    h.textContent = docLabel(meeting) + " Council Meeting";
    inner.appendChild(h);

    var sub = document.createElement("p");
    sub.className = "meeting-sub";
    sub.textContent = "Benchmarking data from the " + meeting.quarter + " " + meeting.year + " meeting" +
      (meeting.sourceFile ? " · " + meeting.sourceFile : "");
    inner.appendChild(sub);

    /* ---- KPI cards ---- */
    var compareDoc = null, compareLabel = "";
    if (compareMode === "prev") {
      compareDoc = findByOffset(meeting, 1);
      compareLabel = compareDoc ? "vs " + docLabel(compareDoc) : "No previous quarter published for " + meeting.region + ".";
    } else if (compareMode === "yoy") {
      compareDoc = findByOffset(meeting, 4);
      compareLabel = compareDoc ? "vs " + docLabel(compareDoc) : "No year-ago quarter published for " + meeting.region + ".";
    } else if (compareMode === "specific") {
      quantDocs.forEach(function (d) { if (d.sid === compareSid) compareDoc = d; });
      compareLabel = compareDoc ? "vs " + docLabel(compareDoc) : "";
    } else {
      var avgDoc = allTimeAverage(meeting.sid);
      compareDoc = avgDoc;
      compareLabel = avgDoc ? "vs all-time average (" + (quantDocs.length - 1) + " other meeting" +
        (quantDocs.length - 1 === 1 ? "" : "s") + ")" : "Not enough data yet.";
    }

    var grid = document.createElement("div");
    grid.className = "kpi-grid";
    KPI_DEFS.forEach(function (kpi) {
      var card = document.createElement("div");
      card.className = "kpi-card";

      var label = document.createElement("div");
      label.className = "kpi-label";
      label.textContent = kpi.label;
      card.appendChild(label);

      var value = document.createElement("div");
      value.className = "kpi-value";
      var v = meeting[kpi.key];
      value.textContent = v == null ? "—" : kpi.fmt(v);
      card.appendChild(value);

      var cv = compareDoc ? compareDoc[kpi.key] : null;
      if (v != null && cv != null) {
        var delta = v - cv;
        var deltaEl = document.createElement("div");
        var dir = Math.abs(delta) < (kpi.key === "responseRate" ? 0.001 : 0.5) ? "flat" : (delta > 0 ? "up" : "down");
        deltaEl.className = "kpi-delta " + dir;
        var sign = delta > 0 ? "+" : (delta < 0 ? "−" : "");
        deltaEl.textContent = (dir === "flat" ? "No change" : sign + kpi.fmt(Math.abs(delta)));
        card.appendChild(deltaEl);
      }
      var cmp = document.createElement("div");
      cmp.className = "kpi-compare";
      cmp.textContent = compareLabel;
      card.appendChild(cmp);

      grid.appendChild(card);
    });
    inner.appendChild(grid);

    /* ---- metrics-over-time chart ---- */
    var section = document.createElement("section");
    var t = document.createElement("h3");
    t.textContent = "Metrics over time";
    section.appendChild(t);

    var series = quantDocs.filter(function (d) { return d.region === meeting.region; })
      .sort(function (a, b) { return quarterTotal(a) - quarterTotal(b); });
    var categories = CATEGORY_ORDER.filter(function (c) {
      return series.some(function (d) { return d.byCategory && d.byCategory[c] != null; });
    });

    if (series.length < 2 || !categories.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Not enough published history for " + meeting.region + " yet to chart a trend.";
      section.appendChild(p);
    } else {
      section.appendChild(buildQuantChart(series, categories));
    }
    inner.appendChild(section);
    doc.scrollTop = 0;
  }

  var SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(name, attrs) {
    var node = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  function buildQuantChart(series, categories) {
    var box = document.createElement("div");
    var W = 720, H = 260, ML = 34, MR = 12, MT = 12, MB = 28;
    var plotW = W - ML - MR, plotH = H - MT - MB;
    var n = series.length;

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "chart-svg", role: "img",
      "aria-label": "Metrics over time" });

    function x(i) { return n <= 1 ? ML + plotW / 2 : ML + (i / (n - 1)) * plotW; }
    function y(v) { return MT + (1 - Math.max(0, Math.min(5, v)) / 5) * plotH; }

    // gridlines + y-axis labels, 0..5
    for (var g = 0; g <= 5; g++) {
      var gy = y(g);
      svg.appendChild(svgEl("line", { x1: ML, x2: W - MR, y1: gy, y2: gy, stroke: "var(--grid)", "stroke-width": 1 }));
      var gl = svgEl("text", { x: ML - 8, y: gy + 3, "text-anchor": "end", "font-size": 10, fill: "var(--text-muted)" });
      gl.textContent = String(g);
      svg.appendChild(gl);
    }

    // x-axis labels
    series.forEach(function (d, i) {
      var lx = svgEl("text", { x: x(i), y: H - 8, "text-anchor": "middle", "font-size": 10, fill: "var(--text-muted)" });
      lx.textContent = d.quarter + " '" + String(d.year).slice(-2);
      svg.appendChild(lx);
    });

    categories.forEach(function (cat) {
      var color = CATEGORY_COLOR[cat] || "var(--accent)";
      var run = [];
      function flush() {
        if (run.length > 1) {
          svg.appendChild(svgEl("polyline", {
            points: run.map(function (pt) { return pt[0] + "," + pt[1]; }).join(" "),
            fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
          }));
        }
        run.forEach(function (pt) {
          svg.appendChild(svgEl("circle", { cx: pt[0], cy: pt[1], r: 2.5, fill: color }));
        });
        run = [];
      }
      series.forEach(function (d, i) {
        var v = d.byCategory && d.byCategory[cat];
        if (v == null) { flush(); return; }
        run.push([x(i), y(v)]);
      });
      flush();
    });

    box.appendChild(svg);

    var legend = document.createElement("div");
    legend.className = "chart-legend";
    categories.forEach(function (cat) {
      var item = document.createElement("div");
      item.className = "chart-legend-item";
      var swatch = document.createElement("span");
      swatch.className = "chart-swatch";
      swatch.style.background = CATEGORY_COLOR[cat] || "var(--accent)";
      item.appendChild(swatch);
      var label = document.createElement("span");
      label.textContent = cat;
      item.appendChild(label);
      legend.appendChild(item);
    });
    box.appendChild(legend);

    return box;
  }

  /* ---------- boot ---------- */
  var fromHash = null;
  tabs.forEach(function (t) { if (t.slug === location.hash.replace(/^#/, "")) fromHash = t; });
  show(fromHash ? fromHash.key : tabs[0].key, false);
  window.addEventListener("hashchange", function () {
    tabs.forEach(function (t) {
      if (t.slug === location.hash.replace(/^#/, "") && t !== current) show(t.key, false);
    });
  });
})();
</script>
</body>
</html>
