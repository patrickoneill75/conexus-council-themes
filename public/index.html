<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Connector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<!-- Connector's home page is the sign-in page: nothing on the site is public. It is themed like the
     admin pages (navy bar, light page, white card, Aptos). /admin/login.html forwards here, so every
     "sign in first" redirect (?next=) and every reset link (?reset=) still lands on this page. -->
<style>
  :root {
    color-scheme: light;
    --navy:#07214E; --blue:#325EAE; --page:#ffffff; --text:#16202B; --muted:#4A5663;
    --rule:#E1E2E9; --btn-border:#C9CDD8; --soft:#F3F5F9; --bar-text:#C9D3E3;
    --good:#1E7B45; --bad:#B3361A;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --navy:#E6ECF7; --blue:#6E95D8; --page:#0F1520; --text:#E4E8EF; --muted:#A3AEBD;
    --rule:#273244; --btn-border:#3A475C; --soft:#18202D; --bar-text:#C9D3E3;
    --good:#5CC48A; --bad:#F08A6C;
  } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--soft); color:var(--text);
         font:15px/1.5 Aptos,"Segoe UI",Arial,sans-serif; }
  .appbar { background:#07214E; color:#fff; }
  .appbar .in { max-width:960px; margin:0 auto; padding:0 32px; min-height:56px; display:flex; align-items:center; }
  .brand { font-size:15px; font-weight:600; }
  main { flex:1 1 auto; display:flex; align-items:flex-start; justify-content:center; padding:72px 16px 96px; }
  .wrap { width:100%; max-width:420px; }
  h1 { margin:0 0 6px; font-size:30px; line-height:1.15; font-weight:600; color:var(--navy); letter-spacing:-0.01em; }
  .sub { margin:0 0 24px; font-size:14px; color:var(--muted); }
  .card { background:var(--page); border:1px solid var(--rule); border-radius:8px; padding:24px 28px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 4px; }
  label:first-of-type { margin-top:0; }
  input[type=text], input[type=email], input[type=password] {
    width:100%; font:inherit; font-size:15px; padding:9px 11px; border-radius:4px;
    border:1px solid var(--btn-border); background:var(--page); color:var(--text); }
  input:focus { outline:2px solid var(--blue); outline-offset:1px; }
  button { width:100%; font:inherit; font-size:14px; font-weight:600; border-radius:4px; cursor:pointer;
           padding:10px 16px; margin-top:18px; background:#325EAE; border:1px solid #325EAE; color:#fff; }
  button:hover { background:#07214E; border-color:#07214E; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  button.ghost { background:none; border-color:transparent; color:var(--blue); font-weight:600; margin-top:12px; }
  button.ghost:hover { background:none; text-decoration:underline; }
  .msg { font-size:13.5px; margin:10px 0 0; min-height:1em; }
  .msg.err { color:var(--bad); }
  .msg.ok { color:var(--good); }
  .msg.muted { color:var(--muted); }
  .toggle-row { text-align:center; }
  @media (max-width:600px) { .appbar .in { padding:0 16px; } main { padding-top:40px; } .card { padding:20px; } }
</style>
</head>
<body>
<header class="appbar"><div class="in"><span class="brand">Connector</span></div></header>
<main>
<div class="wrap">
  <h1>Sign in</h1>
  <p class="sub">Conexus Indiana staff tools. Sign in with your Connector account.</p>

  <div class="card" id="loginCard">
    <label for="loginId">Email or username</label>
    <input type="text" id="loginId" autocomplete="username">
    <label for="loginPw">Password</label>
    <input type="password" id="loginPw" autocomplete="current-password">
    <button type="button" id="loginBtn">Sign in</button>
    <p class="msg" id="loginMsg"></p>
    <div class="toggle-row">
      <button type="button" class="ghost" id="showSetupBtn">Set up new account / Forgot password</button>
    </div>
  </div>

  <div class="card" id="setupCard" hidden>
    <div id="setupEmailStep">
      <label for="setupEmail">Email address</label>
      <input type="email" id="setupEmail" autocomplete="email">
      <button type="button" id="setupCheckBtn">Continue</button>
      <p class="msg" id="setupCheckMsg"></p>
    </div>
    <div id="setupPasswordStep" hidden>
      <label for="setupUsername">Choose a username</label>
      <input type="text" id="setupUsername" autocomplete="username">
      <label for="setupPassword">Choose a password</label>
      <input type="password" id="setupPassword" autocomplete="new-password">
      <p class="msg muted">At least 8 characters.</p>
      <button type="button" id="setupCompleteBtn">Set password &amp; sign in</button>
      <p class="msg" id="setupCompleteMsg"></p>
    </div>
    <div class="toggle-row">
      <button type="button" class="ghost" id="showLoginBtn">Back to sign in</button>
    </div>
  </div>
</div>
</main>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };

  function api(path, body) {
    return fetch("/api/beta/" + path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
        return data;
      });
    });
  }

  /* After signing in, go back to the page that sent you here (?next=), or to the hub. Only a page on
     this site is followed: resolving it against this origin and comparing origins also catches tricks a
     simple prefix check misses, such as a tab between two slashes, which browsers drop. */
  function nextPage() {
    var n = "";
    try { n = new URLSearchParams(window.location.search).get("next") || ""; } catch (e) {}
    if (n.charAt(0) !== "/") return "/admin/index.html";
    try {
      var u = new URL(n, window.location.origin);
      if (u.origin === window.location.origin && ["/", "/index.html", "/admin/login.html"].indexOf(u.pathname) < 0) return u.pathname + u.search + u.hash;
    } catch (e) {}
    return "/admin/index.html";
  }

  function goToPlatform(token) {
    try { sessionStorage.setItem("beta-token", token); } catch (e) {}
    window.location.href = nextPage();
  }

  /* A reset link from an admin: ?reset=<signed link>. It names the account it is for. */
  var resetLink = "", resetFor = "";
  try {
    resetLink = new URLSearchParams(window.location.search).get("reset") || "";
    if (resetLink) {
      var part = resetLink.split(".")[0].replace(/-/g, "+").replace(/_/g, "/");
      resetFor = JSON.parse(decodeURIComponent(escape(atob(part + "===".slice((part.length + 3) % 4))))).resetFor || "";
    }
  } catch (e) { resetLink = ""; resetFor = ""; }

  /* resume an existing session (not when following a reset link, which is for setting a password) */
  try {
    if (!resetLink && sessionStorage.getItem("beta-token")) {
      window.location.href = nextPage();
    }
  } catch (e) {}

  el("loginBtn").addEventListener("click", function () {
    var identifier = el("loginId").value.trim();
    var password = el("loginPw").value;
    if (!identifier || !password) {
      el("loginMsg").className = "msg err";
      el("loginMsg").textContent = "Enter your email/username and password.";
      return;
    }
    el("loginBtn").disabled = true;
    el("loginMsg").className = "msg muted";
    el("loginMsg").textContent = "Signing in…";
    api("login", { identifier: identifier, password: password })
      .then(function (data) { goToPlatform(data.token); })
      .catch(function (e) {
        el("loginBtn").disabled = false;
        el("loginMsg").className = "msg err";
        el("loginMsg").textContent = e.message;
      });
  });
  el("loginPw").addEventListener("keydown", function (e) { if (e.key === "Enter") el("loginBtn").click(); });
  el("loginId").addEventListener("keydown", function (e) { if (e.key === "Enter") el("loginPw").focus(); });

  function showSetup() {
    el("loginCard").hidden = true;
    el("setupCard").hidden = false;
    el("setupEmailStep").hidden = false;
    el("setupPasswordStep").hidden = true;
    el("setupCheckMsg").textContent = "";
    el("setupCompleteMsg").textContent = "";
  }
  function showLogin() {
    el("setupCard").hidden = true;
    el("loginCard").hidden = false;
  }
  el("showSetupBtn").addEventListener("click", showSetup);
  el("showLoginBtn").addEventListener("click", showLogin);

  el("setupCheckBtn").addEventListener("click", function () {
    var email = el("setupEmail").value.trim();
    if (!email) {
      el("setupCheckMsg").className = "msg err";
      el("setupCheckMsg").textContent = "Enter an email address.";
      return;
    }
    el("setupCheckBtn").disabled = true;
    el("setupCheckMsg").className = "msg muted";
    el("setupCheckMsg").textContent = "Checking…";
    fetch("/api/beta/setup-check", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: email, reset: resetLink }),
    }).then(function (r) { return r.json(); }).then(function (data) {
      el("setupCheckBtn").disabled = false;
      if (!data.allowed) {
        el("setupCheckMsg").className = "msg err";
        el("setupCheckMsg").textContent = data.reason || "That email can't set up a password right now.";
        return;
      }
      el("setupCheckMsg").textContent = "";
      el("setupEmailStep").hidden = true;
      el("setupPasswordStep").hidden = false;
      var suggested = email.split("@")[0].replace(/[^a-z0-9._-]/gi, "");
      if (!el("setupUsername").value) el("setupUsername").value = suggested;
    }).catch(function () {
      el("setupCheckBtn").disabled = false;
      el("setupCheckMsg").className = "msg err";
      el("setupCheckMsg").textContent = "Something went wrong -- try again.";
    });
  });

  el("setupCompleteBtn").addEventListener("click", function () {
    var email = el("setupEmail").value.trim();
    var username = el("setupUsername").value.trim();
    var password = el("setupPassword").value;
    if (!username || password.length < 8) {
      el("setupCompleteMsg").className = "msg err";
      el("setupCompleteMsg").textContent = "Choose a username and a password of at least 8 characters.";
      return;
    }
    el("setupCompleteBtn").disabled = true;
    el("setupCompleteMsg").className = "msg muted";
    el("setupCompleteMsg").textContent = "Saving…";
    api("setup-complete", { email: email, username: username, password: password, reset: resetLink })
      .then(function (data) { goToPlatform(data.token); })
      .catch(function (e) {
        el("setupCompleteBtn").disabled = false;
        el("setupCompleteMsg").className = "msg err";
        el("setupCompleteMsg").textContent = e.message;
      });
  });
  // Opened from a reset link: go straight to setting a new password for that account.
  if (resetLink && resetFor) {
    showSetup();
    el("setupEmail").value = resetFor;
    el("setupEmail").readOnly = true;
    el("setupCheckBtn").click();
  }
})();
</script>
</body>
</html>
