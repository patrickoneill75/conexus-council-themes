<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Intelligence — Connector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307214e'/%3E%3Ccircle cx='11' cy='16' r='4' fill='white'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23fbae40'/%3E%3Ccircle cx='22' cy='22' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/partner-intel/pi.css">
<style>html { visibility:hidden; }</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <h1>Partner Intelligence</h1>
      <p class="sub">What partners are stuck on, and who can help. Conexus staff only.</p>
    </div>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home">Home</a>
      <a href="#/programs" data-r="programs">Programs</a>
      <a href="#/companies" data-r="companies">Companies</a>
      <a href="#/ask" data-r="ask">Ask</a>
      <a href="#/explore" data-r="explore">Explore</a>
    </nav>
    <div class="tools">
      <span id="whoami"></span>
      <a href="/partner-intel/control-panel/">Control panel</a>
      <button class="link" id="signOut">Sign out</button>
    </div>
  </div>
  <main id="view"></main>
</div>

<script src="/partner-intel/pi.js"></script>
<script>
(function () {
  "use strict";
  if (!window.PI) return;
  document.documentElement.style.visibility = "visible";
  var el = function (id) { return document.getElementById(id); };
  var esc = PI.esc;
  var view = el("view");
  el("signOut").addEventListener("click", PI.signOut);
  PI.whoami(el("whoami"));

  var state = { days: 30, exact: false, membersOnly: false, programDays: 0, programRank: "distinct", explore: { facets: null },
                sources: {}, sourceList: null };
  var chosen = {}; // source folders switched on; shared by Home, Ask and Explore

  function loadSources() {
    return state.sourceList ? Promise.resolve(state.sourceList)
      : PI.api("facets").then(function (r) { state.sourceList = r.sources; return r.sources; });
  }
  function chosenList() { return Object.keys(chosen).filter(function (k) { return chosen[k]; }); }
  function sourceParam() { var l = chosenList(); return l.length ? "&source=" + encodeURIComponent(l.join("|")) : ""; }
  function chipsHtml() {
    if (!state.sourceList || !state.sourceList.length) return "";
    return '<div class="row small" style="margin-bottom:12px"><span class="muted">Source folder</span><div class="chips" style="margin-top:0" data-chips>' +
      state.sourceList.map(function (s) {
        return '<button class="chip btn' + (chosen[s.value] ? " on" : "") + '" data-s="' + esc(s.value) + '">' + esc(s.value) + ' <span style="opacity:.7">' + s.count + "</span></button>";
      }).join("") + "</div>" + (chosenList().length ? '<button class="link small" data-clear>Clear</button>' : "") + "</div>";
  }
  function wireChips(root, onChange) {
    Array.prototype.forEach.call(root.querySelectorAll("[data-chips] button"), function (b) {
      b.addEventListener("click", function () { var k = b.getAttribute("data-s"); chosen[k] = !chosen[k]; onChange(); });
    });
    var clear = root.querySelector("[data-clear]");
    if (clear) clear.addEventListener("click", function () { chosen = {}; onChange(); });
  }
  var seq = 0; // drops the answer to a request that a newer navigation has made stale

  function emptyState(err) {
    if (err && err.body && err.body.empty) {
      return '<div class="card"><div class="empty"><b>There is no data yet.</b><br>Open the ' +
        '<a href="/partner-intel/control-panel/">control panel</a>, choose the Box folder, and run the first scan.</div></div>';
    }
    return '<div class="card"><div class="msg err">' + esc(err.message || "Something went wrong.") + "</div></div>";
  }

  function loading(text) { return '<div class="card"><span class="spinner"></span>' + esc(text) + "</div>"; }

  /* ------------------------------------------------------------------ Trending topics
     Used by Home and by every program. The page appears at once; the Claude-written bullets
     fill in after, because writing them takes a few seconds the first time. */
  var PAGE = 5;

  function pctOf(x) { var p = Math.round(x * 100); return x && !p ? "<1%" : p + "%"; }

  function topicCard(t, n) {
    var meta = (t.companyCount ? t.companyCount + " compan" + (t.companyCount === 1 ? "y" : "ies") + " &middot; " : "") +
      t.meetingCount + " meeting" + (t.meetingCount === 1 ? "" : "s") + (t.highUrgency ? " &middot; called urgent in " + t.highUrgency : "");
    if (t.programMeetings) {
      meta += " &middot; in " + t.meetingCount + " of " + t.programMeetings + " meetings here, vs " + pctOf(t.elsewhereShare) + " elsewhere";
    }
    return '<div class="topic" data-topic="' + esc(t.topic) + '"><h3>' + (n + 1) + ". " + esc(t.label) + '</h3><p class="meta">' + meta + "</p>" +
      (t.companies.length ? '<div class="chips">' + t.companies.slice(0, 6).map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("") +
        (t.companies.length > 6 ? '<span class="chip">+' + (t.companies.length - 6) + " more</span>" : "") + "</div>" : "") +
      '<div data-body>' + (t.summary ? bulletsHtml(t.summary) : '<div class="pending"><span class="spinner"></span>Writing the summary…</div>') + "</div></div>";
  }

  function bulletsHtml(summary) {
    return '<ul class="bullets">' + summary.bullets.map(function (b) {
      return '<li><details class="bullet"><summary><span class="txt">' + esc(b.text) + '</span></summary><div class="examples">' +
        b.examples.map(function (i) { return PI.insightCard(i, { why: false }); }).join("") + "</div></details></li>";
    }).join("") + "</ul>";
  }

  function fallbackHtml(t, note) {
    return (note ? '<p class="small muted" style="margin:10px 0 0">' + esc(note) + "</p>" : "") +
      (t.examples && t.examples.length ? '<details class="src"><summary>Examples</summary>' + t.examples.map(function (i) { return PI.insightCard(i, { why: false }); }).join("") + "</details>" : "");
  }

  /** Cards for t[from..to), then the summaries the page does not have yet. scope is the filter
   * set the topics were ranked under; the server recomputes the evidence from it. */
  function showTopics(box, trending, from, to, scope, mine) {
    var chunk = trending.slice(from, to);
    box.insertAdjacentHTML("beforeend", chunk.map(function (t, k) { return topicCard(t, from + k); }).join(""));
    var need = chunk.filter(function (t) { return !t.summary; });
    if (!need.length) return;
    PI.post("summarize", Object.assign({}, scope, { topics: need.map(function (t) { return t.topic; }) })).then(function (r) {
      if (mine !== seq) return;
      need.forEach(function (t) {
        var body = box.querySelector('.topic[data-topic="' + t.topic + '"] [data-body]');
        if (!body) return;
        body.innerHTML = r.summaries[t.topic] ? bulletsHtml(r.summaries[t.topic])
          : fallbackHtml(t, r.unavailable || "No summary could be written for this topic.");
      });
    }).catch(function (err) {
      if (mine !== seq) return;
      need.forEach(function (t) {
        var body = box.querySelector('.topic[data-topic="' + t.topic + '"] [data-body]');
        if (body) body.innerHTML = fallbackHtml(t, "The summary could not be written: " + err.message);
      });
    });
  }

  function renderTrending(box, trending, scope, mine) {
    if (!trending.length) { box.innerHTML = '<div class="empty">No topics in this selection.</div>'; return; }
    var shown = 0;
    box.innerHTML = '<div data-list></div><div data-more></div>';
    var list = box.querySelector("[data-list]"), more = box.querySelector("[data-more]");
    function next() {
      var to = Math.min(trending.length, shown + PAGE);
      showTopics(list, trending, shown, to, scope, mine);
      shown = to;
      more.innerHTML = shown < trending.length ? '<div class="row" style="margin-top:12px"><button id="moreTopics">Show ' + Math.min(PAGE, trending.length - shown) + " more topics</button></div>" : "";
      var btn = more.querySelector("#moreTopics");
      if (btn) btn.addEventListener("click", next);
    }
    next();
  }

  /* ------------------------------------------------------------------ Dashboard bar */
  // Issues coral, solutions sky, wins brand blue, other a neutral. This order and these three
  // passed the palette check (adjacent pairs separate for colour-blind readers). Text on each
  // fill is chosen for contrast: navy on coral and sky, white on blue.
  var SEGS = [["issues", "Issues", "#F26B43", "#07214E"], ["solutions", "Solutions", "#00B0F0", "#07214E"],
              ["wins", "Wins", "#325EAE", "#FFFFFF"], ["other", "Other", "#CBD0DA", "#16202B"]];

  function dashboardHtml(d) {
    var total = d.issues + d.solutions + d.wins + d.other;
    if (!total) return "";
    var pct = function (n) { var p = Math.round(n * 100 / total); return n && !p ? "<1%" : p + "%"; };
    var tile = function (n, label, sub) { return '<span class="stat"><b>' + n.toLocaleString() + "</b><span>" + label + "</span>" + (sub ? "<small>" + sub + "</small>" : "") + "</span>"; };
    var span = d.first && d.last ? PI.fmtDate(d.first).replace(/ \d+,/, "") + " to " + PI.fmtDate(d.last).replace(/ \d+,/, "") : "";
    var label = SEGS.map(function (s) { return s[1] + " " + d[s[0]] + " (" + pct(d[s[0]]) + ")"; }).join(", ");
    return '<div class="dash"><div class="tiles">' + tile(d.insights, "insights", span) +
      tile(d.partners, "partners", d.members + " are members") + tile(d.meetings, "meetings") + tile(d.programs, "programs") + "</div>" +
      '<div class="sbar" role="img" aria-label="' + esc("Insights by type: " + label) + '">' + SEGS.filter(function (s) { return d[s[0]]; }).map(function (s) {
        return '<div class="seg" data-name="' + s[1] + '" data-n="' + d[s[0]] + '" style="flex:' + d[s[0]] + ' 1 0;background:' + s[2] + ";color:" + s[3] +
          '" data-tip="' + esc(s[1] + ": " + d[s[0]].toLocaleString() + " (" + pct(d[s[0]]) + ")") + '"></div>';
      }).join("") + "</div>" +
      '<div class="legend">' + SEGS.map(function (s) {
        return "<span><i style=\"background:" + s[2] + '"></i>' + s[1] + " <b>" + d[s[0]].toLocaleString() + "</b> &middot; " + pct(d[s[0]]) + "</span>";
      }).join("") + "</div>" +
      '<table class="sr-only"><caption>Insights by type</caption><thead><tr><th>Type</th><th>Insights</th></tr></thead><tbody>' +
      SEGS.map(function (s) { return "<tr><td>" + s[1] + "</td><td>" + d[s[0]] + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }

  /** A label goes inside a segment only when the rendered text fits with room to spare. */
  function fitSegmentLabels(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".sbar .seg"), function (seg) {
      var span = document.createElement("span");
      span.textContent = seg.getAttribute("data-name") + " " + Number(seg.getAttribute("data-n")).toLocaleString();
      seg.appendChild(span);
      // Padding on both sides plus a little air; otherwise the label is left to the legend below.
      if (span.offsetWidth + 24 > seg.clientWidth) seg.removeChild(span);
    });
  }

  /* ------------------------------------------------------------------ Home */
  function home() {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    var statusQ = state.membersOnly ? "&status=Active" : "";
    loadSources().then(function () {
      return PI.api("home?days=" + state.days + (state.exact ? "&exact=1" : "") + statusQ + sourceParam());
    }).then(function (d) {
      if (mine !== seq) return;
      var html = chipsHtml() + '<div class="row small" style="margin:-4px 0 12px"><label><input type="checkbox" id="mem"' + (state.membersOnly ? " checked" : "") + "> Members only</label></div>" +
        dashboardHtml(d.dashboard) +
        '<div class="row spread" style="margin-bottom:14px">' +
        '<div class="seg" id="win">' + [30, 60, 90].map(function (n) {
          return '<button data-d="' + n + '"' + (state.days === n ? ' class="on"' : "") + ">Last " + n + " days</button>";
        }).join("") + "</div>" +
        '<div class="row small"><label><input type="checkbox" id="exact"' + (state.exact ? " checked" : "") + "> Exact dates only</label></div></div>";
      if (d.counts.estimatedDates && !state.exact) {
        html += '<p class="small muted" style="margin:-4px 0 12px">' + d.counts.estimatedDates +
          " item" + (d.counts.estimatedDates === 1 ? "" : "s") + " in this window use the Box upload date because the notes carry no date. They are marked.</p>";
      }
      html += "<h2>Trending topics</h2>" +
        '<p class="sub">The topics raised by the most companies since ' + esc(PI.fmtDate(d.since)) + ". Open a point to see who said it." +
        (d.uncategorized ? " " + d.uncategorized + " issue" + (d.uncategorized === 1 ? "" : "s") + " did not fit a topic and are not ranked." : "") + '</p><div id="trend"></div>';
      view.innerHTML = html;
      fitSegmentLabels(view);
      renderTrending(el("trend"), d.trending, { days: state.days, exact: state.exact, source: chosenList(), status: state.membersOnly ? ["Active"] : [] }, mine);
      Array.prototype.forEach.call(view.querySelectorAll("#win button"), function (b) {
        b.addEventListener("click", function () { state.days = Number(b.getAttribute("data-d")); home(); });
      });
      el("exact").addEventListener("change", function (e) { state.exact = e.target.checked; home(); });
      el("mem").addEventListener("change", function (e) { state.membersOnly = e.target.checked; home(); });
      wireChips(view, home);
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /* ------------------------------------------------------------------ Programs */
  var KIND_LABEL = { cohort: "Cohort", company: "Company", meeting: "Meeting" };

  function updateBanner(needs) {
    return needs ? '<div class="banner">Meetings are grouped approximately until the one-time update is applied. Open the <a href="/partner-intel/control-panel/">control panel</a> and use the button at the top. It takes about a minute and uses no Claude.</div>' : "";
  }

  function programs() {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("programs").then(function (r) {
      if (mine !== seq) return;
      view.innerHTML = updateBanner(r.needsUpdate) + "<h2>Programs</h2>" +
        '<p class="sub">Each source folder is a program. Open one for its trending topics and its meetings.</p><div class="pgrid" style="margin-top:14px">' +
        r.programs.map(function (p) {
          return '<a class="pcard" href="#/program/' + encodeURIComponent(p.name) + '"><b>' + esc(p.name) + "</b>" +
            (p.internal ? " " + PI.pill("info", "Conexus internal") : "") +
            '<div class="small muted" style="margin-top:6px">' + p.meetings + " meeting" + (p.meetings === 1 ? "" : "s") + " &middot; " + p.notes + " notes" +
            (p.companies ? " &middot; " + p.companies + " companies" : "") + "</div>" +
            '<div class="small muted">' + (p.last ? "Latest " + esc(PI.fmtDate(p.last)) : "") + "</div></a>";
        }).join("") + "</div>";
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  function meetingCard(program, m) {
    var c = m.counts;
    var parts = [c.issues && c.issues + " issue" + (c.issues === 1 ? "" : "s"), c.solutions && c.solutions + " solution" + (c.solutions === 1 ? "" : "s"),
      c.wins && c.wins + " win" + (c.wins === 1 ? "" : "s"), c.other && c.other + " other"].filter(Boolean).join(" &middot; ");
    return '<a class="mcard" href="#/meeting/' + encodeURIComponent(program) + "/" + encodeURIComponent(m.id) + '">' +
      '<div class="head" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="t">' + esc(m.label) + "</span>" + PI.pill("info", KIND_LABEL[m.kind] || "Meeting") + "</div>" +
      '<div class="small muted" style="margin-top:2px">' + esc(PI.fmtDate(m.date)) + (m.estimated ? " " + PI.pill("est", "estimated date") : "") +
      (m.kind !== "company" && m.companyCount ? " &middot; " + m.companyCount + " compan" + (m.companyCount === 1 ? "y" : "ies") : "") + " &middot; " + parts + "</div>" +
      (m.topics.length ? '<div class="chips">' + m.topics.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + "</div>" : "") + "</a>";
  }

  function program(name) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("program?name=" + encodeURIComponent(name) + "&days=" + state.programDays + "&rank=" + state.programRank).then(function (r) {
      if (mine !== seq) return;
      var p = r.program;
      var html = updateBanner(r.needsUpdate) + '<p class="small"><a href="#/programs">&larr; All programs</a></p>' +
        '<div class="row spread"><div><h2 style="font-size:20px">' + esc(p.name) + "</h2>" +
        '<p class="sub">' + p.meetings + " meeting" + (p.meetings === 1 ? "" : "s") + " &middot; " + p.notes + " notes" +
        (p.first ? " &middot; " + esc(PI.fmtDate(p.first)) + " to " + esc(PI.fmtDate(p.last)) : "") + (p.internal ? " &middot; Conexus internal" : "") + "</p></div>" +
        '<div class="seg" id="pwin">' + [[90, "Last 90 days"], [365, "Last year"], [0, "All time"]].map(function (w) {
          return '<button data-d="' + w[0] + '"' + (state.programDays === w[0] ? ' class="on"' : "") + ">" + w[1] + "</button>";
        }).join("") + "</div></div>" +
        '<div class="row spread" style="margin-top:22px"><h2 style="margin:0">Trending topics</h2><div class="seg" id="prank">' +
        [["distinct", "Most distinctive"], ["common", "Most raised"]].map(function (w) {
          return '<button data-r="' + w[0] + '"' + (state.programRank === w[0] ? ' class="on"' : "") + ">" + w[1] + "</button>";
        }).join("") + "</div></div><p class=\"sub\">" +
        (state.programRank === "common" ? "The topics raised in the most meetings of this program, as on Home."
          : "The topics that set this program apart: raised in many of its meetings and less often in other programs.") +
        (state.programDays ? " Window applied." : "") + "</p><div id=\"trend\"></div>" +
        '<h2 style="margin-top:26px">Recent data</h2><p class="sub">Grouped by date, and by cohort, company or meeting. Open one for its issues, solutions and wins.</p>' +
        '<div id="meetings"></div><div id="moreM"></div>';
      view.innerHTML = html;
      renderTrending(el("trend"), r.trending, { days: state.programDays, source: [name] }, mine);
      var shown = 0;
      function more() {
        var to = Math.min(r.meetings.length, shown + 12);
        el("meetings").insertAdjacentHTML("beforeend", r.meetings.slice(shown, to).map(function (m) { return meetingCard(name, m); }).join(""));
        shown = to;
        el("moreM").innerHTML = shown < r.meetings.length ? '<div class="row" style="margin-top:12px"><button id="moreMeet">Show more</button></div>'
          : (r.meetingTotal > r.meetings.length ? '<p class="small muted">Showing the latest ' + r.meetings.length + " of " + r.meetingTotal + ".</p>" : "");
        var b = el("moreMeet"); if (b) b.addEventListener("click", more);
      }
      if (!r.meetings.length) el("meetings").innerHTML = '<div class="empty">No data in this program yet.</div>'; else more();
      Array.prototype.forEach.call(view.querySelectorAll("#prank button"), function (b) {
        b.addEventListener("click", function () { state.programRank = b.getAttribute("data-r"); program(name); });
      });
      Array.prototype.forEach.call(view.querySelectorAll("#pwin button"), function (b) {
        b.addEventListener("click", function () { state.programDays = Number(b.getAttribute("data-d")); program(name); });
      });
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  function meeting(name, id) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("meeting?program=" + encodeURIComponent(name) + "&id=" + encodeURIComponent(id)).then(function (r) {
      if (mine !== seq) return;
      var m = r.meeting;
      function section(title, items) {
        return items.length ? '<h2 style="margin-top:22px">' + esc(title) + " (" + items.length + ")</h2>" + items.map(function (i) { return PI.insightCard(i); }).join("") : "";
      }
      view.innerHTML = '<p class="small"><a href="#/program/' + encodeURIComponent(name) + '">&larr; ' + esc(name) + "</a></p>" +
        '<div class="card"><div class="row" style="gap:8px"><h2 style="font-size:20px">' + esc(m.label) + "</h2>" + PI.pill("info", KIND_LABEL[m.kind] || "Meeting") + "</div>" +
        '<p class="sub">' + esc(PI.fmtDate(m.date)) + (m.estimated ? " " + PI.pill("est", "estimated date") : "") +
        (m.companyCount ? " &middot; " + m.companyCount + " compan" + (m.companyCount === 1 ? "y" : "ies") + ": " + m.companies.map(esc).join(", ") : "") + "</p>" +
        '<p class="small muted" style="margin:6px 0 0">From ' + m.files.map(esc).join(", ") + "</p></div>" +
        section("Issues", r.issues) + section("Solutions", r.solutions) + section("Wins", r.wins) + section("Other", r.other);
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /* ------------------------------------------------------------------ Ask */
  function ask() {
    var mine = ++seq;
    view.innerHTML = '<div class="card"><h2>Who can we connect them with?</h2>' +
      '<p class="desc">Describe what the partner needs. The answer lists companies whose own meeting notes show they have solved or offer it, with the evidence.</p>' +
      '<div id="askSrc"></div><textarea id="q" rows="3" maxlength="600" placeholder="A partner is looking for something to help them with an AI-powered quality system. Who can we connect them with?"></textarea>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="go">Find matches</button><span id="busy"></span></div></div>' +
      '<div id="out"></div><div id="recent"></div>';
    var q = el("q");
    function drawChips() { el("askSrc").innerHTML = chipsHtml(); wireChips(el("askSrc"), drawChips); }
    loadSources().then(function () { if (mine === seq) drawChips(); }).catch(function () {});
    function run() {
      var question = q.value.trim();
      if (question.length < 8) { el("out").innerHTML = '<div class="msg err">Ask a full question, such as what the partner needs.</div>'; return; }
      el("go").disabled = true;
      el("busy").innerHTML = '<span class="spinner"></span>Reading the notes…';
      PI.post("ask", { question: question, sources: chosenList() }).then(function (a) {
        el("out").innerHTML = renderAnswer(a);
        loadRecent();
      }).catch(function (err) { el("out").innerHTML = emptyState(err); })
        .then(function () { el("go").disabled = false; el("busy").innerHTML = ""; });
    }
    el("go").addEventListener("click", run);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); });
    function loadRecent() {
      PI.api("recent-questions").then(function (r) {
        if (mine !== seq || !r.items.length) return;
        el("recent").innerHTML = '<div class="card"><h3>Recent questions</h3>' + r.items.slice(0, 8).map(function (it) {
          return '<div class="small" style="margin-top:8px"><button class="link" data-q="' + esc(it.question) + '">' + esc(it.question) +
            '</button> <span class="muted">' + esc(PI.fmtStamp(it.at)) + "</span></div>";
        }).join("") + "</div>";
        Array.prototype.forEach.call(el("recent").querySelectorAll("button[data-q]"), function (b) {
          b.addEventListener("click", function () { q.value = b.getAttribute("data-q"); run(); });
        });
      }).catch(function () {});
    }
    loadRecent();
  }

  function renderAnswer(a) {
    var html = '<div class="card">';
    if (a.ranking === "keyword") html += '<div class="banner">Ranked by keyword match only. Claude is not set up for this tool yet, so the order and wording are not reviewed.</div>';
    if (a.summary) html += '<p style="margin:0 0 4px"><b>' + esc(a.summary) + "</b></p>";
    html += '<p class="small muted" style="margin:0 0 6px">' + (a.cached ? "Saved answer from " + esc(PI.fmtStamp(a.askedAt)) + ". " : "") +
      "Looked at " + a.considered.insights + " solutions, offers and wins.</p>";
    if (!a.matches.length) html += '<div class="empty">No partner in the notes clearly does this.</div>';
    a.matches.forEach(function (m, n) {
      var c = m.company;
      html += '<div class="item"><div class="rank"><div class="n">' + (n + 1) + '</div><div style="flex:1">' +
        '<div class="head"><a class="co" href="#/company/' + encodeURIComponent(c.id) + '">' + esc(c.name) + "</a>" +
        PI.pill(m.strength === "high" ? "good" : m.strength === "medium" ? "medium" : "low", m.strength + " match") +
        PI.pill("info", c.industry) + PI.pill(c.status === "Active" ? "good" : "info", PI.statusLabel[c.status] || c.status) + "</div>" +
        '<div class="detail">' + esc(m.why) + "</div>" +
        (m.caution ? '<div class="caution"><b>Check first:</b> ' + esc(m.caution) + "</div>" : "") +
        (c.contacts && c.contacts.length ? '<div class="small muted">Contacts on file: ' + c.contacts.map(esc).join(", ") + "</div>" : "") +
        '<details class="src"><summary>Evidence (' + m.evidence.length + ")</summary>" +
        m.evidence.map(function (i) { return PI.insightCard(i, { company: false }); }).join("") + "</details>" +
        "</div></div></div>";
    });
    if (a.gaps) html += '<p class="small" style="margin-top:12px"><b>Not covered:</b> ' + esc(a.gaps) + "</p>";
    return html + "</div>";
  }

  /* ------------------------------------------------------------------ Companies */
  function companies() {
    var mine = ++seq;
    view.innerHTML = '<div class="card"><div class="fields">' +
      '<div><label class="field" for="cq">Search</label><input id="cq" placeholder="Company name"></div>' +
      '<div><label class="field" for="ci">Industry</label><select id="ci"><option value="">All</option></select></div>' +
      '<div><label class="field" for="cs">Member status</label><select id="cs"><option value="">All</option>' +
      '<option value="Active">Member</option><option value="Inactive">Former member</option><option value="Non-member">Not a member</option></select></div>' +
      '<div style="align-self:end"><label><input type="checkbox" id="cw" checked> Only companies with notes</label></div></div></div>' +
      '<div class="card" id="clist">' + "</div>";
    function load() {
      var qs = "companies?q=" + encodeURIComponent(el("cq").value) + (el("ci").value ? "&industry=" + encodeURIComponent(el("ci").value) : "") +
        (el("cs").value ? "&status=" + encodeURIComponent(el("cs").value) : "") + (el("cw").checked ? "&withInsights=1" : "");
      PI.api(qs).then(function (r) {
        if (mine !== seq) return;
        if (el("ci").options.length === 1) {
          el("ci").innerHTML = '<option value="">All</option>' + r.industries.map(function (i) { return "<option>" + esc(i) + "</option>"; }).join("");
        }
        el("clist").innerHTML = r.items.length ? "<table><thead><tr><th>Company</th><th>Industry</th><th>Status</th><th>Notes</th><th>Problems</th><th>Solutions</th><th>Wins</th><th>Last mentioned</th></tr></thead><tbody>" +
          r.items.map(function (c) {
            return '<tr class="click" data-id="' + esc(c.id) + '"><td><b>' + esc(c.name) + "</b></td><td>" + esc(c.industry) + "</td><td>" +
              esc(PI.statusLabel[c.status] || c.status) + "</td><td>" + c.insights + "</td><td>" + c.problems + "</td><td>" + c.solutions +
              "</td><td>" + c.wins + "</td><td>" + (c.last ? esc(PI.fmtDate(c.last)) : "") + "</td></tr>";
          }).join("") + "</tbody></table>" : '<div class="empty">No companies match.</div>';
        Array.prototype.forEach.call(el("clist").querySelectorAll("tr.click"), function (tr) {
          tr.addEventListener("click", function () { location.hash = "#/company/" + encodeURIComponent(tr.getAttribute("data-id")); });
        });
      }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
    }
    var t;
    el("cq").addEventListener("input", function () { clearTimeout(t); t = setTimeout(load, 250); });
    ["ci", "cs", "cw"].forEach(function (id) { el(id).addEventListener("change", load); });
    load();
  }

  function column(title, hint, items, kind) {
    var html = '<section class="card"><h3>' + esc(title) + '</h3><p class="desc">' + esc(hint) + "</p>";
    if (!items.length) return html + '<div class="muted small">None recorded yet.</div></section>';
    items.forEach(function (it) {
      var i = it.lead || it;
      html += '<div class="item' + (kind === "issue" && (i.urgency === "high" || i.urgency === "medium") ? " u-" + i.urgency : "") + '">' +
        (it.label ? '<div class="head">' + PI.pill("info", it.label) + (it.count > 1 ? PI.pill("info", it.count + " meetings") : "") + "</div>" : "") +
        '<div class="title">' + esc(i.title) + "</div><div class=\"detail\">" + esc(i.detail) + "</div>" +
        (i.urgencyReason && kind === "issue" ? '<div class="why"><b>Why it is urgent:</b> ' + esc(i.urgencyReason) + "</div>" : "") +
        '<div class="meta">' + esc(PI.fmtDate(i.date)) + (i.estimated ? " " + PI.pill("est", "estimated date") : "") +
        (i.eventType ? " &middot; " + esc(i.eventType) : "") + "</div>" +
        '<details class="src"><summary>Source</summary><blockquote>&ldquo;' + esc(i.quote) + "&rdquo;</blockquote></details></div>";
    });
    return html + "</section>";
  }

  function company(id) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("company?id=" + encodeURIComponent(id)).then(function (p) {
      if (mine !== seq) return;
      var c = p.company;
      var html = '<p class="small"><a href="#/companies">&larr; All companies</a></p>' +
        '<div class="card"><div class="row spread"><div><h2 style="font-size:20px">' + esc(c.name) + "</h2>" +
        '<div class="row" style="margin-top:6px">' + PI.pill("info", c.industry) + PI.pill(c.status === "Active" ? "good" : "info", PI.statusLabel[c.status] || c.status) +
        (c.program ? PI.pill("info", c.program) : "") + "</div></div>" +
        "<div>" + [["insights", "notes"], ["meetings", "meetings"], ["problems", "problems"], ["solutions", "solutions"], ["wins", "wins"]].map(function (k) {
          return '<span class="stat"><b>' + p.counts[k[0]] + "</b><span>" + k[1] + "</span></span>";
        }).join("") + "</div></div>" +
        (c.contacts.length ? '<p class="small muted" style="margin:10px 0 0">Contacts on file: ' + c.contacts.map(esc).join(", ") + "</p>" : "") +
        (c.source === "notes" ? '<p class="small muted" style="margin:6px 0 0">This company is in the notes but not on the partner list. Add it in the control panel to give it an industry.</p>' : "") + "</div>" +
        '<div class="grid3">' +
        column("Recent wins", "The latest results this company reported.", p.recentWins, "win") +
        column("Top issues", "Open problems and asks, ranked by urgency and how recent they are.", p.topIssues, "issue") +
        column("Top solutions", "What this company has built, solved or offers.", p.topSolutions, "solution") + "</div>";
      if (p.meetings.length) {
        html += '<div class="card"><h3>Meetings in the notes</h3><div class="chips">' + p.meetings.map(function (m) {
          return '<span class="chip">' + esc(PI.fmtDate(m.date)) + (m.estimated ? " (est.)" : "") + " &middot; " + esc(m.series || m.eventType) + "</span>";
        }).join("") + "</div></div>";
      }
      view.innerHTML = html;
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /* ------------------------------------------------------------------ Explore */
  var KINDS = ["problem", "solution", "win", "offer", "ask", "equipment", "news", "commitment"];

  function explore() {
    var mine = ++seq;
    var offset = 0;
    view.innerHTML = '<div class="card"><div id="exSrc"></div><div class="fields">' +
      '<div><label class="field" for="eq">Search</label><input id="eq" placeholder="Words in the note or company"></div>' +
      '<div><label class="field" for="ek">Type</label><select id="ek"><option value="">All types</option>' + KINDS.map(function (k) { return '<option value="' + k + '">' + PI.kindLabel[k] + "</option>"; }).join("") + "</select></div>" +
      '<div><label class="field" for="et">Topic</label><select id="et"><option value="">All topics</option></select></div>' +
      '<div><label class="field" for="ei">Industry</label><select id="ei"><option value="">All industries</option></select></div>' +
      '<div><label class="field" for="es">Member status</label><select id="es"><option value="">All</option><option value="Active">Member</option><option value="Inactive">Former member</option><option value="Non-member">Not a member</option></select></div>' +
      '<div><label class="field" for="ee">Event</label><select id="ee"><option value="">All events</option></select></div>' +
      '<div><label class="field" for="eu">Urgency</label><select id="eu"><option value="">Any</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div>' +
      '<div><label class="field" for="ed">When</label><select id="ed"><option value="">Any time</option><option value="30">Last 30 days</option><option value="60">Last 60 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select></div>' +
      '</div><div class="row small" style="margin-top:12px"><label><input type="checkbox" id="ex"> Exact dates only</label>' +
      '<label><input type="checkbox" id="in"> Include Conexus board and internal notes</label>' +
      '<label>Sort <select id="so"><option value="date">Newest first</option><option value="urgency">Most urgent first</option></select></label>' +
      '<button class="tiny" id="reset">Reset</button></div></div><div id="results"></div>';

    function qs(withOffset) {
      var p = [];
      function add(k, v) { if (v) p.push(k + "=" + encodeURIComponent(v)); }
      add("q", el("eq").value.trim()); add("kind", el("ek").value); add("topic", el("et").value); add("industry", el("ei").value);
      add("status", el("es").value); add("eventType", el("ee").value); add("urgency", el("eu").value); add("days", el("ed").value);
      if (el("ex").checked) p.push("exact=1");
      if (el("in").checked) p.push("internal=1");
      add("sort", el("so").value);
      if (chosenList().length) add("source", chosenList().join("|"));
      p.push("limit=25"); if (withOffset) p.push("offset=" + offset);
      return p.join("&");
    }
    function fillFacets(f) {
      function opts(id, list, all) {
        var cur = el(id).value;
        el(id).innerHTML = '<option value="">' + all + "</option>" + list.map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + " (" + o.count + ")</option>";
        }).join("");
        el(id).value = cur;
      }
      opts("et", f.topic, "All topics"); opts("ei", f.industry, "All industries"); opts("ee", f.eventType, "All events");
    }
    function load(append) {
      if (!append) offset = 0;
      PI.api("insights?" + qs(true)).then(function (r) {
        if (mine !== seq) return;
        if (!state.explore.facets) { state.explore.facets = r.facets; fillFacets(r.facets); }
        if (!append) el("results").innerHTML = '<p class="small muted" id="count"></p><div id="rows"></div><div id="moreWrap"></div>';
        el("count").textContent = r.total + " result" + (r.total === 1 ? "" : "s");
        var items = r.items.map(function (i) { return PI.insightCard(i); }).join("");
        el("rows").insertAdjacentHTML("beforeend", items || (append ? "" : '<div class="card empty">Nothing matches those filters.</div>'));
        var hasMore = offset + r.items.length < r.total;
        el("moreWrap").innerHTML = hasMore ? '<div class="row" style="margin-top:12px"><button id="moreBtn">Show more</button></div>' : "";
        if (hasMore) el("moreBtn").addEventListener("click", function () { offset += 25; load(true); });
      }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
    }
    function drawChips() { el("exSrc").innerHTML = chipsHtml(); wireChips(el("exSrc"), function () { drawChips(); load(false); }); }
    loadSources().then(function () { if (mine === seq) drawChips(); }).catch(function () {});
    var t;
    el("eq").addEventListener("input", function () { clearTimeout(t); t = setTimeout(function () { load(false); }, 250); });
    ["ek", "et", "ei", "es", "ee", "eu", "ed", "ex", "in", "so"].forEach(function (id) { el(id).addEventListener("change", function () { load(false); }); });
    el("reset").addEventListener("click", explore);
    load(false);
  }

  /* ------------------------------------------------------------------ router */
  function route() {
    var h = location.hash.replace(/^#\/?/, "") || "home";
    var parts = h.split("/");
    var name = parts[0];
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {
      a.classList.toggle("on", a.getAttribute("data-r") === (name === "company" ? "companies" : (name === "program" || name === "meeting") ? "programs" : name));
    });
    if (name === "programs") programs();
    else if (name === "program" && parts[1]) program(decodeURIComponent(parts[1]));
    else if (name === "meeting" && parts[2]) meeting(decodeURIComponent(parts[1]), decodeURIComponent(parts[2]));
    else if (name === "ask") ask();
    else if (name === "companies") companies();
    else if (name === "company" && parts[1]) company(decodeURIComponent(parts[1]));
    else if (name === "explore") explore();
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
