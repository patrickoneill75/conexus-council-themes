<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Intelligence — Connector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307214e'/%3E%3Ccircle cx='11' cy='16' r='4' fill='white'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23fbae40'/%3E%3Ccircle cx='22' cy='22' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/partner-intel/pi.css">
<style>html { visibility:hidden; }</style>
</head>
<body class="pi-app">
<header class="appbar">
  <div class="in">
    <div class="appname">Partner Intelligence</div>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/home" data-r="home"><span>Home</span></a>
      <a href="#/programs" data-r="programs"><span>Programs</span></a>
      <a href="#/companies" data-r="companies"><span>Companies</span></a>
      <a href="#/ask" data-r="ask"><span>Ask</span></a>
      <a href="#/explore" data-r="explore"><span>Explore</span></a>
    </nav>
    <div class="tools">
      <span id="whoami"></span>
      <a href="/partner-intel/control-panel/">Control panel</a>
      <button class="link" id="signOut">Sign out</button>
    </div>
  </div>
</header>
<div class="wrap">
  <main id="view"></main>
</div>

<script src="/partner-intel/pi.js"></script>
<script>
(function () {
  "use strict";
  if (!window.PI) return;
  document.documentElement.style.visibility = "visible";
  var el = function (id) { return document.getElementById(id); };
  var esc = PI.esc;
  var view = el("view");
  el("signOut").addEventListener("click", PI.signOut);
  PI.whoami(el("whoami"));

  var state = { days: 90, programDays: 0, explore: { facets: null }, sourceList: null };
  var chosen = ""; // the program (source folder) chosen on Ask and Explore; "" is all of them

  var ARROW = '<svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg>';
  var BACK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8H3M7 3.5 2.5 8 7 12.5"/></svg>';
  var GO = '<svg class="go-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg>';
  var MARK = '<svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="47.94 -0.00 356.86 177.97" fill="currentColor"><path d="M 271.15 88.98 L 226.36 133.77 L 181.57 88.98 L 226.36 44.18 L 271.15 88.98 "/><path d="M 315.67 -0.00 C 291.20 -0.00 269.02 9.86 252.92 25.84 C 249.32 29.41 242.22 36.53 242.22 36.53 L 277.51 71.82 C 277.51 71.82 284.34 65.01 287.85 61.49 C 294.96 54.32 304.81 49.88 315.67 49.88 C 337.26 49.88 354.83 67.41 354.90 88.98 C 354.83 110.55 337.26 128.08 315.67 128.08 C 304.81 128.08 294.96 123.63 287.85 116.47 C 284.34 112.94 277.51 106.13 277.51 106.13 L 242.22 141.42 C 242.22 141.42 249.32 148.55 252.92 152.11 C 269.02 168.09 291.20 177.96 315.67 177.96 C 364.85 177.96 404.72 138.14 404.79 88.98 C 404.72 39.82 364.85 -0.00 315.67 -0.00 "/><path d="M 137.05 -0.00 C 161.52 -0.00 183.70 9.86 199.80 25.84 C 203.40 29.41 210.50 36.53 210.50 36.53 L 175.21 71.82 C 175.21 71.82 168.38 65.01 164.87 61.49 C 157.76 54.32 147.91 49.88 137.05 49.88 C 115.46 49.88 97.89 67.41 97.82 88.98 C 97.89 110.55 115.46 128.08 137.05 128.08 C 147.91 128.08 157.76 123.63 164.87 116.47 C 168.38 112.94 175.21 106.13 175.21 106.13 L 210.50 141.42 C 210.50 141.42 203.40 148.55 199.80 152.11 C 183.70 168.09 161.52 177.96 137.05 177.96 C 87.87 177.96 48.00 138.14 47.93 88.98 C 48.00 39.82 87.87 -0.00 137.05 -0.00 "/></svg>';
  function backLink(href, text) { return '<a class="back" href="' + href + '">' + BACK + esc(text) + "</a>"; }

  function loadSources() {
    return state.sourceList ? Promise.resolve(state.sourceList)
      : PI.api("facets").then(function (r) { state.sourceList = r.sources; return r.sources; });
  }
  function chosenList() { return chosen ? [chosen] : []; }
  /** The program dropdown on Ask and Explore. */
  function sourceSelect(id, label) {
    return '<div><label class="field" for="' + id + '">' + esc(label) + '</label><select id="' + id + '"><option value="">All programs</option>' +
      (state.sourceList || []).map(function (s) {
        return '<option value="' + esc(s.value) + '"' + (chosen === s.value ? " selected" : "") + ">" + esc(s.value) + "</option>";
      }).join("") + "</select></div>";
  }
  var seq = 0; // drops the answer to a request that a newer navigation has made stale

  function emptyState(err) {
    if (err && err.body && err.body.empty) {
      return '<div class="card"><div class="empty"><b>There is no data yet.</b><br>Open the ' +
        '<a href="/partner-intel/control-panel/">control panel</a>, choose the Box folder, and run the first scan.</div></div>';
    }
    return '<div class="card"><div class="msg err">' + esc(err.message || "Something went wrong.") + "</div></div>";
  }

  function loading(text) { return '<div class="card"><span class="spinner"></span>' + esc(text) + "</div>"; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* ------------------------------------------------------------------ Numbered topics
     Used for trending topics, a company's topics and Ask's matches. Each is a circle with a short
     line hanging below it. Opening one fills the circle, highlights its first word or two, and runs
     the line down beside what opens underneath. One opens at a time in a list. */

  /** The highlighted part of a name: the first word, or the first two when the first is four letters or fewer. */
  function hlWords(name) {
    var words = String(name || "").split(" ");
    var short = words[0].replace(/[^A-Za-z0-9]/g, "").length <= 4 && words.length > 1;
    return words.slice(0, short ? 2 : 1).join(" ").replace(/[,;:.]+$/, "");
  }
  function hlName(name) {
    var first = hlWords(name);
    return '<span class="hl">' + esc(first) + "</span>" + esc(String(name).slice(first.length));
  }
  /** One numbered row. hl is the heading level for the page; body is what opens beneath it. */
  function topicRow(n, name, metaHtml, body, open, opts) {
    opts = opts || {};
    var hl = opts.hl || "h3";
    return '<section class="tp' + (open ? " open" : "") + '"' + (opts.topic ? ' data-topic="' + esc(opts.topic) + '"' : "") + ">" +
      "<" + hl + ' class="thead-h"><button type="button" class="tp-row" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="circ" aria-hidden="true">' + n + "</span>" +
      '<span><span class="tname">' + hlName(name) + (opts.after || "") + '</span><span class="tmeta">' + (metaHtml || "") + "</span></span></button></" + hl + ">" +
      '<i class="tline hint" aria-hidden="true"></i>' +
      '<div class="tbody" data-body' + (open ? "" : " hidden") + ">" + body + "</div></section>";
  }
  function animate(node, cls) {
    if (!node) return;
    node.classList.remove("c-open", "c-close", "grow", "shrink");
    void node.offsetWidth; // restart the animation when the same one runs twice in a row
    node.classList.add(cls);
  }
  document.addEventListener("animationend", function (e) {
    if (e.target.classList) e.target.classList.remove("c-open", "c-close", "grow", "shrink", "hint", "a-shrink", "a-expand");
  });
  function setTopic(card, open, quiet) {
    var was = card.classList.contains("open");
    card.classList.toggle("open", open);
    card.querySelector(".tp-row").setAttribute("aria-expanded", open ? "true" : "false");
    card.querySelector("[data-body]").hidden = !open;
    if (quiet || was === open) return;
    animate(card.querySelector(".circ"), open ? "c-open" : "c-close");
    animate(card.querySelector(".tline"), open ? "grow" : "shrink");
  }
  // Opening a topic closes whichever topic in the same list was open.
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest(".tp-row");
    if (!btn) return;
    var card = btn.closest(".tp");
    var opening = !card.classList.contains("open");
    Array.prototype.forEach.call(card.parentNode.querySelectorAll(":scope > .tp"), function (c) {
      c.querySelector(".tline").classList.remove("hint");
      if (c !== card && c.classList.contains("open")) setTopic(c, false);
    });
    setTopic(card, opening);
  });

  /** Points on a light blue block. The plus button, or "See examples" after the text, opens the
   * notes behind a point; the plus squeezes and pops into a minus while they are open. */
  function pointsHtml(points, label) {
    return '<ul class="bullets">' + points.map(function (b) {
      return '<li class="bpt"><button type="button" class="pm" data-pt aria-expanded="false" aria-label="Show ' + label + '"><i class="h"></i><i class="v"></i></button>' +
        '<div><span class="txt">' + b.text + '</span><button type="button" class="see" data-pt>See ' + label + "</button>" +
        '<div class="examples" hidden>' + b.examples + "</div></div></li>";
    }).join("") + "</ul>";
  }
  function bulletsHtml(summary) {
    return '<div class="band">' + pointsHtml(summary.bullets.map(function (b) {
      return { text: esc(b.text), examples: b.examples.map(function (i) { return PI.insightCard(i); }).join("") };
    }), "examples") + "</div>";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-pt]");
    if (!b) return;
    var li = b.closest(".bpt");
    var ex = li.querySelector(".examples");
    ex.hidden = !ex.hidden;
    var pm = li.querySelector(".pm");
    var label = pm.getAttribute("aria-label").replace(/^(Show|Hide) /, "");
    pm.setAttribute("aria-expanded", ex.hidden ? "false" : "true");
    pm.setAttribute("aria-label", (ex.hidden ? "Show " : "Hide ") + label);
    pm.classList.remove("a-shrink", "a-expand"); void pm.offsetWidth;
    pm.classList.add(ex.hidden ? "a-expand" : "a-shrink");
    li.querySelector(".see").textContent = (ex.hidden ? "See " : "Hide ") + label;
  });

  /* ------------------------------------------------------------------ Trending topics
     Used by Home and by every program. The page appears at once; the Claude-written bullets
     fill in after, because writing them takes a few seconds the first time. */
  var PAGE = 5;

  /** "5 companies across 6 meetings." The count the ranking rests on. */
  function topicMeta(t) {
    return (t.companyCount ? plural(t.companyCount, "company", "companies") + " across " : "") +
      plural(t.meetingCount, "meeting", "meetings") + ".";
  }
  function topicCard(t, n, hl, open) {
    return topicRow(n + 1, t.label, esc(topicMeta(t)),
      t.summary ? bulletsHtml(t.summary) : '<div class="band"><div class="pending"><span class="spinner"></span>Writing the summary…</div></div>',
      open, { hl: hl, topic: t.topic });
  }

  function fallbackHtml(t, note) {
    return '<div class="band">' + (note ? '<p class="small muted" style="margin:0">' + esc(note) + "</p>" : "") +
      (t.examples && t.examples.length ? '<details class="src"><summary>Examples</summary>' + t.examples.map(function (i) { return PI.insightCard(i); }).join("") + "</details>" : "") + "</div>";
  }

  /** Cards for t[from..to), then the summaries the page does not have yet. scope is the filter
   * set the topics were ranked under; the server recomputes the evidence from it. */
  function showTopics(box, trending, from, to, scope, mine, hl) {
    var chunk = trending.slice(from, to);
    box.insertAdjacentHTML("beforeend", chunk.map(function (t, k) { return topicCard(t, from + k, hl, from + k === 0); }).join(""));
    var need = chunk.filter(function (t) { return !t.summary; });
    if (!need.length) return;
    // Wait a moment before asking for summaries. Someone clicking through windows and filters
    // would otherwise start a paid Claude call for every view they pass through.
    setTimeout(function () { if (mine === seq) writeSummaries(box, need, scope, mine); }, SUMMARY_DELAY_MS);
  }

  var SUMMARY_DELAY_MS = 700;

  function writeSummaries(box, need, scope, mine) {
    PI.post("summarize", Object.assign({}, scope, { topics: need.map(function (t) { return t.topic; }) })).then(function (r) {
      if (mine !== seq) return;
      need.forEach(function (t) {
        var body = box.querySelector('.tp[data-topic="' + t.topic + '"] [data-body]');
        if (!body) return;
        body.innerHTML = r.summaries[t.topic] ? bulletsHtml(r.summaries[t.topic])
          : fallbackHtml(t, r.unavailable || "No summary could be written for this topic.");
      });
    }).catch(function (err) {
      if (mine !== seq) return;
      need.forEach(function (t) {
        var body = box.querySelector('.tp[data-topic="' + t.topic + '"] [data-body]');
        if (body) body.innerHTML = fallbackHtml(t, "The summary could not be written: " + err.message);
      });
    });
  }

  function renderTrending(box, trending, scope, mine, hl, foot) {
    if (!trending.length) { box.innerHTML = '<div class="card"><div class="empty">No topics in this selection.</div></div>'; return; }
    var shown = 0;
    box.innerHTML = '<div class="card" style="padding-top:10px"><div class="tlist" data-list></div><div data-more></div>' + (foot || "") + "</div>";
    var list = box.querySelector("[data-list]"), more = box.querySelector("[data-more]");
    function next() {
      var to = Math.min(trending.length, shown + PAGE);
      showTopics(list, trending, shown, to, scope, mine, hl);
      shown = to;
      var left = Math.min(PAGE, trending.length - shown);
      more.innerHTML = shown < trending.length ? '<div class="tmore"><button class="more" data-moretopics>Show ' + plural(left, "more topic", "more topics") + "</button></div>" : "";
      var btn = more.querySelector("[data-moretopics]");
      if (btn) btn.addEventListener("click", next);
    }
    next();
  }

  function windowButtons(id, choices, current) {
    return '<div class="seg" id="' + id + '" role="group" aria-label="Time window">' + choices.map(function (w) {
      return '<button data-d="' + w[0] + '"' + (current === w[0] ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + ">" + w[1] + "</button>";
    }).join("") + "</div>";
  }

  /* ------------------------------------------------------------------ Home */
  function home() {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    // Home covers every source folder and every company. Folders are chosen on Ask and Explore,
    // and a program's own page ranks that folder alone.
    PI.api("home?days=" + state.days).then(function (d) {
      if (mine !== seq) return;
      view.innerHTML = '<h1>Trending topics</h1><p class="lede">What the most partner companies have raised since ' + esc(PI.fmtDate(d.since)) + ".</p>" +
        '<div style="margin-top:28px">' + windowButtons("win", [[30, "30 days"], [60, "60 days"], [90, "90 days"]], state.days) + '</div><div id="trend"></div>';
      var foot = '<div class="topicfoot"><b>Note</b><span>Topics rank by how many partner companies raised them. A company counts once per topic.' +
        (d.uncategorized ? " " + esc(plural(d.uncategorized, "issue", "issues")) + " did not fit a topic and are not ranked." : "") + "</span>" +
        "<b>Source</b><span>Meeting notes in Box, " + esc(PI.fmtDate(d.since)) + " to today.</span></div>";
      renderTrending(el("trend"), d.trending, { days: state.days, exact: false, source: [], status: [] }, mine, "h2", foot);
      Array.prototype.forEach.call(view.querySelectorAll("#win button"), function (b) {
        b.addEventListener("click", function () { state.days = Number(b.getAttribute("data-d")); home(); });
      });
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /* ------------------------------------------------------------------ Programs */
  var KIND_LABEL = { cohort: "Cohort", company: "Company", meeting: "Meeting" };

  function updateBanner(needs) {
    return needs ? '<div class="banner">Meetings are grouped approximately until the one-time update is applied. Open the <a href="/partner-intel/control-panel/">control panel</a> and use the button at the top. It takes about a minute and uses no Claude.</div>' : "";
  }

  function programs() {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("programs").then(function (r) {
      if (mine !== seq) return;
      view.innerHTML = updateBanner(r.needsUpdate) + "<h1>Programs</h1>" +
        '<p class="lede">Each source folder in Box is a program. Open one for its trending topics and its meetings.</p><div class="pgrid">' +
        r.programs.map(function (p) {
          return '<a class="pcard" href="#/program/' + encodeURIComponent(p.name) + '"><span class="pn">' + esc(p.name) + "</span>" +
            (p.internal ? '<span class="pint">Conexus internal</span>' : "") +
            '<span class="pl">' + (p.last ? "Latest notes " + esc(PI.fmtDate(p.last)) : "No dated notes yet") + "</span>" + GO + "</a>";
        }).join("") + "</div>";
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /** One meeting in a program: a large date, its name and kind, and the topics it covered. */
  function meetingRow(program, m) {
    var d = PI.fmtDate(m.date).replace(",", "").split(" ");
    return '<a class="mrow" href="#/meeting/' + encodeURIComponent(program) + "/" + encodeURIComponent(m.id) + '">' +
      '<span class="md"><b>' + esc(d[0] + " " + (d[1] || "")) + "</b><span>" + esc(d[2] || "") + "</span></span>" +
      '<span><span class="mt">' + esc(m.label) + '</span><span class="mk">' + esc(KIND_LABEL[m.kind] || "Meeting") +
      (m.estimated ? " &middot; estimated date" : "") + "</span>" +
      (m.topics.length ? '<span class="mtop">Topics: ' + esc(m.topics.join(", ")) + "</span>" : "") + "</span>" + GO + "</a>";
  }

  function program(name) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("program?name=" + encodeURIComponent(name) + "&days=" + state.programDays).then(function (r) {
      if (mine !== seq) return;
      var p = r.program;
      view.innerHTML = updateBanner(r.needsUpdate) + backLink("#/programs", "All programs") + "<h1>" + esc(p.name) + "</h1>" +
        '<p class="lede">' + (p.first ? "Notes from " + esc(PI.fmtDate(p.first)) + " to " + esc(PI.fmtDate(p.last)) + "." : "No dated notes yet.") +
        (p.internal ? " Conexus internal." : "") + "</p>" +
        '<div style="margin-top:28px">' + windowButtons("pwin", [[90, "Last 90 days"], [365, "Last year"], [0, "All time"]], state.programDays) + "</div>" +
        '<h2 class="subh">Trending topics</h2><p class="secsub">The topics raised by the most companies in this program' +
        (state.programDays ? " in the window" : "") + '.</p><div id="trend"></div>' +
        '<h2 class="subh">Recent data</h2><p class="secsub">Grouped by date, and by cohort, company or meeting. Open one for its issues, solutions and wins.</p>' +
        '<div class="card" style="padding:8px 36px"><div id="meetings"></div></div><div id="moreM"></div>';
      renderTrending(el("trend"), r.trending, { days: state.programDays, source: [name] }, mine, "h3");
      var shown = 0;
      function more() {
        var to = Math.min(r.meetings.length, shown + 12);
        el("meetings").insertAdjacentHTML("beforeend", r.meetings.slice(shown, to).map(function (m) { return meetingRow(name, m); }).join(""));
        shown = to;
        el("moreM").innerHTML = shown < r.meetings.length ? '<p style="margin:22px 0 0"><button class="more" id="moreMeet">Show more</button></p>'
          : (r.meetingTotal > r.meetings.length ? '<p class="secsub" style="margin-top:14px">Showing the latest meetings. Older ones are on Explore.</p>' : "");
        var b = el("moreMeet"); if (b) b.addEventListener("click", more);
      }
      if (!r.meetings.length) el("meetings").innerHTML = '<div class="empty">No data in this program yet.</div>'; else more();
      Array.prototype.forEach.call(view.querySelectorAll("#pwin button"), function (b) {
        b.addEventListener("click", function () { state.programDays = Number(b.getAttribute("data-d")); program(name); });
      });
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  var SECTION_SHOWN = 3; // notes per meeting section before "Show all"

  function meeting(name, id) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("meeting?program=" + encodeURIComponent(name) + "&id=" + encodeURIComponent(id)).then(function (r) {
      if (mine !== seq) return;
      var m = r.meeting;
      function section(title, noun, items) {
        if (!items.length) return "";
        var cards = items.map(function (i) { return PI.insightCard(i, { action: isIssue(i) ? findButton(i, i.company && i.company.id) : "" }); });
        return '<section class="card"><h2>' + esc(title) + "</h2><div>" + cards.slice(0, SECTION_SHOWN).join("") +
          (cards.length > SECTION_SHOWN ? '<div hidden data-rest>' + cards.slice(SECTION_SHOWN).join("") + "</div>" : "") + "</div>" +
          (cards.length > SECTION_SHOWN ? '<p style="margin:6px 0 0"><button class="more" data-show-rest>Show all ' + noun + "</button></p>" : "") + "</section>";
      }
      view.innerHTML = backLink("#/program/" + encodeURIComponent(name), name) + "<h1>" + esc(m.label) + "</h1>" +
        '<p class="lede">' + esc(PI.fmtDate(m.date)) + (m.estimated ? " (estimated date)" : "") + ". " + esc(KIND_LABEL[m.kind] || "Meeting") +
        (m.companyCount ? " with " + esc(plural(m.companyCount, "company", "companies")) : "") + ".</p>" +
        '<p class="secsub" style="margin-top:10px;max-width:860px">' + (m.companyCount ? esc(m.companies.join(", ").replace(/\.+$/, "")) + ". " : "") +
        "From " + PI.fileLinks(m.files) + ".</p>" +
        section("Issues", "issues", r.issues) + section("Solutions", "solutions", r.solutions) + section("Wins", "wins", r.wins) + section("Other", "other notes", r.other);
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }
  // "Show all" under a section, or "View all" under a company column, shows the rest in place.
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-show-rest]");
    if (!b) return;
    var rest = b.closest("section").querySelector("[data-rest]");
    if (rest) rest.hidden = false;
    b.parentNode.remove();
  });

  /* ------------------------------------------------------------------ Ask */
  function ask() {
    var mine = ++seq;
    view.innerHTML = "<h1>Ask</h1>" +
      '<p class="lede">Describe what a partner needs. The answer lists companies whose own notes show they have solved or offer it, with the evidence.</p>' +
      '<div class="card" style="margin-top:32px"><label class="field" for="q">What does the partner need?</label>' +
      '<textarea id="q" rows="3" maxlength="600" placeholder="A partner is looking for something to help them with an AI-powered quality system. Who can we connect them with?"></textarea>' +
      '<div id="excl"></div><div class="row" style="margin-top:16px;align-items:flex-end;gap:14px 18px"><div id="askSrc" style="width:260px"></div>' +
      '<button class="primary" id="go">Find matches</button><span id="busy"></span></div></div>' +
      '<div id="out"></div><div id="recent"></div>';
    var q = el("q");
    function drawSources() {
      el("askSrc").innerHTML = sourceSelect("src", "Search in");
      el("src").addEventListener("change", function (e) { chosen = e.target.value; });
    }
    drawSources();
    loadSources().then(function () { if (mine === seq) drawSources(); }).catch(function () {});
    var exclude = null;
    function run() {
      var question = q.value.trim();
      if (question.length < 8) { el("out").innerHTML = '<div class="card"><div class="msg err">Ask a full question, such as what the partner needs.</div></div>'; return; }
      el("go").disabled = true;
      el("busy").innerHTML = '<span class="spinner"></span>Reading the notes…';
      PI.post("ask", { question: question, sources: chosenList(), exclude: exclude ? exclude.id : "" }).then(function (a) {
        if (mine !== seq) return;
        el("out").innerHTML = renderAnswer(a);
        loadRecent();
      }).catch(function (err) { if (mine === seq) el("out").innerHTML = emptyState(err); })
        .then(function () { if (mine === seq) { el("go").disabled = false; el("busy").innerHTML = ""; } });
    }
    el("go").addEventListener("click", run);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); });
    // Arrived from "Find solution" on a company's issue: ask at once, leaving that company out.
    // Editing the question means a new search, so the exclusion is dropped.
    q.addEventListener("input", function () { if (exclude) { exclude = null; el("excl").innerHTML = ""; } });
    if (askPrefill) {
      var pre = askPrefill; askPrefill = null;
      q.value = pre.question;
      exclude = pre.exclude ? { id: pre.exclude, name: pre.name } : null;
      el("excl").innerHTML = exclude ? '<p class="secsub" style="margin:8px 0 0">Looking for partners other than ' + esc((exclude.name || "the company with the issue").replace(/\.+$/, "")) + ".</p>" : "";
      run();
    }
    function loadRecent() {
      PI.api("recent-questions").then(function (r) {
        if (mine !== seq || !r.items.length) return;
        el("recent").innerHTML = '<div class="card"><h2>Recent questions</h2><ul class="recent">' + r.items.slice(0, 8).map(function (it) {
          return '<li><button class="link" data-q="' + esc(it.question) + '">' + esc(it.question) + '</button><span class="small muted">' + esc(PI.fmtStamp(it.at)) + "</span></li>";
        }).join("") + "</ul></div>";
        Array.prototype.forEach.call(el("recent").querySelectorAll("button[data-q]"), function (b) {
          b.addEventListener("click", function () { q.value = b.getAttribute("data-q"); run(); });
        });
      }).catch(function () {});
    }
    loadRecent();
  }

  function companyFacts(c) {
    return [c.industry, PI.statusLabel[c.status] || c.status].filter(Boolean).map(esc).join(". ") + ".";
  }

  function renderAnswer(a) {
    var html = '<div class="card">';
    if (a.ranking === "keyword") html += '<div class="banner">Ranked by keyword match only. Claude is not set up for this tool yet, so the order and wording are not reviewed.</div>';
    if (a.summary) html += '<p class="answer">' + esc(a.summary) + "</p>";
    html += '<p class="secsub" style="margin:8px 0 0">' + (a.cached ? "Saved answer from " + esc(PI.fmtStamp(a.askedAt)) + ". " : "") +
      "Looked at " + a.considered.insights + " solutions, offers and wins.</p>";
    if (!a.matches.length) html += '<div class="empty">No partner in the notes clearly does this.' +
      (a.peers && a.peers.length ? " Partners working through the same thing are listed below." : "") + "</div>";
    html += '<div class="tlist" style="margin-top:18px;border-top:1px solid var(--rule)">' + a.matches.map(function (m, n) {
      var c = m.company;
      var strength = m.strength === "high" ? "High match" : m.strength === "medium" ? "Medium match" : "Low match";
      var body = '<div class="band"><p class="why">' + esc(m.why) + "</p>" +
        (m.caution ? '<p class="caution"><b>Check first:</b> ' + esc(m.caution) + "</p>" : "") +
        (c.contacts && c.contacts.length ? '<p class="secsub" style="margin-top:10px">Contacts on file: ' + c.contacts.map(esc).join(", ") + "</p>" : "") +
        '<div style="margin-top:18px">' + pointsHtml(m.evidence.map(function (i) {
          return { text: "<b>" + esc(i.title) + "</b>", examples: PI.insightCard(i, { company: false }) };
        }), "note") + "</div>" +
        '<p style="margin:16px 0 0"><a class="arrowlink" href="#/company/' + encodeURIComponent(c.id) + '">Open ' + esc(c.name) + ARROW + "</a></p></div>";
      return topicRow(n + 1, c.name, esc(strength + ". " + companyFacts(c)), body, n === 0);
    }).join("") + "</div>";
    if (a.gaps) html += '<p class="secsub" style="margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)"><b style="color:var(--navy)">Not covered:</b> ' + esc(a.gaps) + "</p>";
    if (a.searchTerms && a.searchTerms.length) {
      html += '<p class="secsub" style="margin-top:8px">Also searched for: ' + a.searchTerms.map(esc).join(", ") + ".</p>";
    }
    html += "</div>";
    // Companies working through the same thing: a peer to compare notes with, not a solution.
    if (a.peers && a.peers.length) {
      html += '<div class="card"><h2>Working through the same thing</h2><p class="desc">Partners whose notes show the same issue, ' +
        "an ask for help with it, or a plan to tackle it. Found by matching words, not ranked by Claude.</p>" +
        a.peers.map(function (p) {
          return p.evidence.map(function (i) { return PI.insightCard(Object.assign({}, i, { company: p.company })); }).join("");
        }).join("") + "</div>";
    }
    return html;
  }

  /* ------------------------------------------------------------------ Companies */
  // Columns of the companies table: [sort key, heading]. Alphabetical by name until a heading is
  // clicked; clicking it again reverses. Kept while the page is open, so Back returns to it.
  var COMPANY_COLS = [["name", "Company"], ["industry", "Industry"], ["status", "Status"], ["last", "Last mentioned"]];
  var companySort = { key: "name", dir: "asc" };

  function companies() {
    var mine = ++seq;
    view.innerHTML = "<h1>Companies</h1>" +
      '<p class="lede">Every partner company in the notes. Open one for its issues, solutions and wins.</p>' +
      '<div class="card" style="margin-top:32px;padding:24px 28px"><div class="fields">' +
      '<div><label class="field" for="cq">Search</label><input id="cq" placeholder="Company name"></div>' +
      '<div><label class="field" for="ci">Industry</label><select id="ci"><option value="">All</option></select></div>' +
      '<div><label class="field" for="cs">Member status</label><select id="cs"><option value="">All</option>' +
      '<option value="Active">Member</option><option value="Inactive">Former member</option><option value="Non-member">Not a member</option></select></div>' +
      '<div style="align-self:end;height:46px;display:flex;align-items:center"><label class="chk"><input type="checkbox" id="cw" checked> Only companies with notes</label></div></div></div>' +
      '<div class="card" id="clist" style="padding:12px 28px 20px"></div><p class="secsub" style="margin-top:14px">Pick a column heading to sort.</p>';
    function load() {
      var qs = "companies?q=" + encodeURIComponent(el("cq").value) + (el("ci").value ? "&industry=" + encodeURIComponent(el("ci").value) : "") +
        (el("cs").value ? "&status=" + encodeURIComponent(el("cs").value) : "") + (el("cw").checked ? "&withInsights=1" : "") +
        "&sort=" + companySort.key + "&dir=" + companySort.dir;
      PI.api(qs).then(function (r) {
        if (mine !== seq) return;
        if (el("ci").options.length === 1) {
          el("ci").innerHTML = '<option value="">All</option>' + r.industries.map(function (i) { return "<option>" + esc(i) + "</option>"; }).join("");
        }
        el("clist").innerHTML = r.items.length ? '<table class="tbl"><thead><tr>' + COMPANY_COLS.map(function (col) {
            var on = companySort.key === col[0];
            return '<th aria-sort="' + (on ? (companySort.dir === "asc" ? "ascending" : "descending") : "none") + '"><button class="sorter' + (on ? " on" : "") +
              '" data-sort="' + col[0] + '">' + col[1] + '<span class="arrow" aria-hidden="true">' + (on ? (companySort.dir === "asc" ? "&#9650;" : "&#9660;") : "") + "</span></button></th>";
          }).join("") + "</tr></thead><tbody>" +
          r.items.map(function (c) {
            return '<tr class="click" data-id="' + esc(c.id) + '"><td class="cn">' + esc(c.name) + "</td><td>" + esc(c.industry) + "</td><td>" +
              esc(PI.statusLabel[c.status] || c.status) + "</td><td>" + (c.last ? esc(PI.fmtDate(c.last)) : "") + "</td></tr>";
          }).join("") + "</tbody></table>" : '<div class="empty">No companies match.</div>';
        Array.prototype.forEach.call(el("clist").querySelectorAll("tr.click"), function (tr) {
          tr.addEventListener("click", function () { location.hash = "#/company/" + encodeURIComponent(tr.getAttribute("data-id")); });
        });
        Array.prototype.forEach.call(el("clist").querySelectorAll("button.sorter"), function (b) {
          b.addEventListener("click", function () {
            var key = b.getAttribute("data-sort");
            var textual = key === "name" || key === "industry" || key === "status";
            companySort = companySort.key === key ? { key: key, dir: companySort.dir === "asc" ? "desc" : "asc" } : { key: key, dir: textual ? "asc" : "desc" };
            load();
          });
        });
      }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
    }
    var t;
    el("cq").addEventListener("input", function () { clearTimeout(t); t = setTimeout(load, 250); });
    ["ci", "cs", "cw"].forEach(function (id) { el(id).addEventListener("change", load); });
    load();
  }

  /* ------------------------------------------------------------------ Company page */
  // Tabs, in order. Overview, Issues, Solutions and Wins are topic views from company/topics:
  // issues include asks (a company asking for help is stating an issue), solutions include offers
  // and equipment, and the Overview is all three together. Notes lists everything, newest first,
  // and Contacts lists everyone on file at the company.
  var ICONS = {
    overview: '<rect x="4" y="4" width="11" height="11" rx="3"/><rect x="19" y="4" width="11" height="11" rx="3"/><rect x="4" y="19" width="11" height="11" rx="3"/><rect x="19" y="19" width="11" height="11" rx="3"/>',
    issues: '<circle cx="17" cy="17" r="13"/><path d="M17 10v8"/><circle cx="17" cy="23.5" r="0.6" fill="currentColor"/>',
    solutions: '<path d="M13 26h8M14 30h6M17 4a9 9 0 0 0-5.5 16.1c1 .8 1.5 1.8 1.5 2.9h8c0-1.1.5-2.1 1.5-2.9A9 9 0 0 0 17 4z"/>',
    wins: '<path d="M8 30V5M8 5h17l-3.5 6L25 17H8"/>',
    meetings: '<rect x="5" y="7" width="24" height="22" rx="3"/><path d="M5 14h24M11 4v6M23 4v6"/>',
    notes: '<path d="M9 4h12l6 6v20H9z"/><path d="M21 4v6h6M13 17h10M13 22h10"/>',
    contacts: '<circle cx="17" cy="11.5" r="6"/><path d="M6 30c1.4-6.2 5.8-9.5 11-9.5s9.6 3.3 11 9.5"/>'
  };
  var COMPANY_TABS = [
    { id: "overview", label: "Overview", list: "all", noun: ["mention", "mentions"],
      note: "Every topic this company has raised, with its issues, solutions and wins together." },
    { id: "issues", label: "Issues", list: "issues", noun: ["issue", "issues"], note: "What this company is stuck on, by topic." },
    { id: "solutions", label: "Solutions", list: "solutions", noun: ["solution", "solutions"], note: "What this company has solved, offers or owns, by topic." },
    { id: "wins", label: "Wins", list: "wins", noun: ["win", "wins"], note: "What has gone well for this company, by topic." },
    { id: "meetings", label: "Meetings", note: "Every meeting this company appears in, newest first, with the files in Box they came from." },
    { id: "notes", label: "Notes", kinds: "", note: "Everything recorded about this company, newest first." },
    { id: "contacts", label: "Contacts", note: "Everyone on file at this company." }
  ];
  var OLD_TABS = { problems: "issues" }; // links saved before the tabs were renamed
  function tabHref(id, tab) { return "#/company/" + encodeURIComponent(id) + (tab && tab !== "overview" ? "/" + tab : ""); }

  /** The question "Find solution" puts to Ask: the issue in its own words, at most 600 characters. */
  function issueQuestion(i) {
    var q = "Who can help with this: " + (i.title || "") + (i.detail ? ". " + i.detail : "");
    return q.length > 600 ? q.slice(0, 597) + "..." : q;
  }
  function findButton(i, companyId) {
    return '<button class="find" data-find="' + esc(issueQuestion(i)) + '" data-co="' + esc(companyId || "") +
      '" data-co-name="' + esc((i.company && i.company.name) || "") + '">Find solution' + ARROW + "</button>";
  }
  var isIssue = function (i) { return i.kind === "problem" || i.kind === "ask"; };
  /** A row as a note; an issue carries Find solution at the end of its date and source line. */
  function rowCard(i, companyId) {
    return PI.insightCard(i, { company: false, action: isIssue(i) ? findButton(i, companyId) : "" });
  }

  function company(id, tab) {
    var mine = ++seq;
    tab = OLD_TABS[tab] || tab;
    var current = COMPANY_TABS.filter(function (t) { return t.id === tab; })[0] || COMPANY_TABS[0];
    var at = COMPANY_TABS.indexOf(current);
    view.innerHTML = loading("Loading…");
    PI.api("company?id=" + encodeURIComponent(id)).then(function (p) {
      if (mine !== seq) return;
      var c = p.company;
      var facts = [c.industry, c.program].filter(Boolean);
      if (c.status && c.status !== "Active") facts.push(PI.statusLabel[c.status] || c.status);
      // A member gets the Conexus mark beside its name, the way a verified account gets a check.
      var badge = c.status === "Active" ? '<span class="cm" title="Conexus Indiana council member">' + MARK + "<span>Council Member</span></span>" : "";
      var html = backLink("#/companies", "All companies") +
        '<h1 class="coname"><span>' + esc(c.name) + "</span>" + badge + "</h1>" +
        (facts.length ? '<p class="lede">' + facts.map(esc).join(". ") + ".</p>" : "") +
        (c.source === "notes" ? '<p class="secsub">This company is in the notes but not on the partner list. Add it in the control panel to give it an industry.</p>' : "") +
        '<nav class="ctabs" aria-label="Company sections">' + COMPANY_TABS.map(function (t) {
          return '<a href="' + tabHref(c.id, t.id) + '"' + (t.id === current.id ? ' class="on" aria-current="page"' : "") + ">" +
            '<svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[t.id] + "</svg>" +
            esc(t.label) + "</a>";
        }).join("") + "</nav>" +
        '<section class="tabpanel' + (at === 0 ? " first" : at === COMPANY_TABS.length - 1 ? " last" : "") + '"><p class="secsub" style="margin:0">' + esc(current.note) + '</p><div id="tabBody"></div></section>';
      view.innerHTML = html;
      var body = el("tabBody");
      if (current.list) {
        topicsTab(body, c, current, mine);
      } else if (current.id === "meetings") {
        body.innerHTML = p.meetings.length ? '<table class="tbl docs" style="margin-top:14px"><thead><tr><th>Date</th><th>Meeting</th><th>Files in Box</th></tr></thead><tbody>' +
          p.meetings.map(function (m) {
            return "<tr><td class=\"nowrap\">" + esc(PI.fmtDate(m.date)) + (m.estimated ? " " + PI.pill("est", "estimated date") : "") + "</td>" +
              '<td class="cn">' + esc(m.label || m.series || m.eventType) + (m.programs.length ? ' <span class="muted small" style="font-weight:400">&middot; ' + esc(m.programs.join(", ")) + "</span>" : "") + "</td>" +
              "<td>" + (PI.fileLinks(m.files) || '<span class="muted">No file</span>') + "</td></tr>";
          }).join("") + "</tbody></table>" +
          (p.meetingTotal > p.meetings.length ? '<p class="secsub">Showing the latest meetings. The rest are on the Notes tab.</p>' : "")
          : '<div class="empty">No meetings recorded yet.</div>';
      } else if (current.id === "contacts") {
        var people = c.people || [];
        var source = { upload: "Contacts upload", roster: "Member roster", both: "Roster and contacts upload" };
        body.innerHTML = people.length ? '<table class="tbl" style="margin-top:14px"><thead><tr><th>Name</th><th>Title</th><th>Email</th><th>Source</th></tr></thead><tbody>' +
          people.map(function (x) {
            return '<tr><td class="cn">' + esc(x.name) + "</td><td>" + esc(x.title) + "</td><td>" +
              (x.email ? '<a href="mailto:' + esc(x.email) + '">' + esc(x.email) + "</a>" : "") + "</td><td>" + esc(source[x.source] || "") + "</td></tr>";
          }).join("") + "</tbody></table>" +
          '<p class="secsub" style="margin-top:14px">Everyone at this company in the contacts list uploaded in the control panel, plus anyone named on the member roster.</p>'
          : '<div class="empty">No contacts on file. Upload the contacts list in the <a href="/partner-intel/control-panel/">control panel</a>.</div>';
      } else {
        listTab(body, c, current, mine);
      }
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  // Overview, Issues, Solutions and Wins: by topic across all the notes, or the latest source's
  // topics. The choice holds while moving between tabs and companies.
  var topicsMode = "topic";
  function topicsTab(body, c, tab, mine) {
    body.innerHTML = '<p class="small muted" style="margin-top:14px"><span class="spinner"></span>Loading…</p>';
    PI.api("company/topics?id=" + encodeURIComponent(c.id) + "&list=" + tab.list).then(function (r) {
      if (mine !== seq) return;
      if (!r.total) { body.innerHTML = '<div class="empty">No ' + (tab.list === "all" ? "issues, solutions or wins" : tab.noun[1]) + " recorded yet.</div>"; return; }
      body.innerHTML = '<div class="row spread toolbar"><div class="seg soft" id="pmode" role="group" aria-label="View">' +
        [["topic", "By topic"], ["latest", "Latest source"]].map(function (m) {
          return '<button data-mode="' + m[0] + '">' + m[1] + "</button>";
        }).join("") + '</div></div><div id="pview"></div><p class="secsub" id="pnote" style="margin-top:14px"></p>';
      function draw() {
        Array.prototype.forEach.call(el("pmode").querySelectorAll("button"), function (b) {
          var on = b.getAttribute("data-mode") === topicsMode;
          b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        el("pnote").textContent = topicsMode === "latest" ? "Ranked by how often each topic came up in that meeting."
          : "Most mentioned first. Recent notes count more." + (tab.list === "all" || tab.list === "issues" ? " Resolved issues are not counted." : "");
        if (topicsMode === "latest") latestSource(el("pview"), r, tab, c.id); else byTopic(el("pview"), r, tab, c.id);
      }
      el("pmode").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-mode]");
        if (!b) return;
        topicsMode = b.getAttribute("data-mode");
        draw();
      });
      draw();
    }).catch(function (err) { if (mine === seq) body.innerHTML = emptyState(err); });
  }

  /** "Last raised Oct 5, 2026." The topic's notes say the rest. */
  function topicSentence(t, inMeeting) {
    return !inMeeting && t.last ? "Last raised " + PI.fmtDate(t.last) + "." : "";
  }

  var COLUMN_SHOWN = 3; // notes per Overview column before "View all"

  /** Numbered topics that open to their notes. On the Overview a topic opens to three columns,
   * each showing its first three notes and a "View all" button for the rest. */
  function topicList(topics, tab, companyId, inMeeting) {
    return '<div class="tlist">' + topics.map(function (t, n) {
      var inner;
      if (tab.list === "all") {
        inner = '<div class="band"><div class="cols3">' + [["Issues", "issues"], ["Solutions", "solutions"], ["Wins", "wins"]].map(function (col) {
          var rows = t.items.filter(function (i) { return PI.categoryOf(i.kind) === col[1]; });
          var cards = rows.map(function (i) { return rowCard(i, companyId); });
          return '<section><h4 class="colh">' + col[0] + "</h4>" +
            (rows.length ? cards.slice(0, COLUMN_SHOWN).join("") +
              (rows.length > COLUMN_SHOWN ? '<div hidden data-rest>' + cards.slice(COLUMN_SHOWN).join("") + "</div>" +
                '<p class="colmore"><button class="find" data-show-rest>View all ' + col[1] + ARROW + "</button></p>" : "")
            : '<p class="muted small" style="margin:12px 0 0">None in this topic.</p>') + "</section>";
        }).join("") + "</div></div>";
      } else {
        inner = '<div class="band notes">' + t.items.map(function (i) { return rowCard(i, companyId); }).join("") + "</div>";
      }
      return topicRow(n + 1, t.label, esc(topicSentence(t, inMeeting)), inner, false,
        { after: t.mentions ? "" : '<span class="allres">All resolved</span>' });
    }).join("") + "</div>";
  }

  function byTopic(box, r, tab, companyId) {
    box.innerHTML = topicList(r.byTopic, tab, companyId, false);
  }

  function latestSource(box, r, tab, companyId) {
    var opts = r.latest.map(function (s, k) {
      return '<option value="' + k + '">' + esc(PI.fmtDate(s.date) + " · " + (s.label || s.eventType || "Meeting")) + "</option>";
    }).join("");
    box.innerHTML = (r.latest.length > 1 ? '<div style="max-width:520px;margin:14px 0 8px"><label class="field" for="psrc">Source</label><select id="psrc">' + opts + "</select></div>" : "") +
      '<div id="psrcBody"></div>' +
      (r.sourceTotal > r.latest.length ? '<p class="secsub" style="margin-top:16px">Only the latest sources are listed. By topic covers them all.</p>' : "");
    function show(k) {
      var s = r.latest[k];
      el("psrcBody").innerHTML = '<div style="margin:16px 0 4px"><h3>' + esc(s.label || s.eventType || "Meeting") + "</h3>" +
        '<p class="secsub" style="margin:4px 0 0">' + esc(PI.fmtDate(s.date)) + (s.estimated ? " " + PI.pill("est", "estimated date") : "") +
        (s.programs.length ? ". " + esc(s.programs.join(", ")) : "") + "." +
        (s.files.length ? " From " + PI.fileLinks(s.files) : "") + "</p></div>" +
        topicList(s.topics, tab, companyId, true);
    }
    var sel = el("psrc");
    if (sel) sel.addEventListener("change", function () { show(Number(sel.value)); });
    show(0);
  }

  /** A company's full list for one tab, newest first, 50 at a time. */
  function listTab(body, c, tab, mine) {
    var offset = 0;
    body.innerHTML = '<div id="clist" style="margin-top:14px"></div><div id="cmore"></div>';
    function page() {
      return PI.api("insights?company=" + encodeURIComponent(c.id) + (tab.kinds ? "&kind=" + encodeURIComponent(tab.kinds) : "") +
        "&sort=date&limit=50&offset=" + offset).then(function (r) {
        if (mine !== seq) return;
        if (!r.total) { el("clist").innerHTML = '<div class="empty">None recorded yet.</div>'; return; }
        // Every issue carries a Find solution button, on Notes as on the topic tabs.
        el("clist").insertAdjacentHTML("beforeend", r.items.map(function (i) { return rowCard(i, c.id); }).join(""));
        offset += r.items.length;
        el("cmore").innerHTML = offset < r.total ? '<p style="margin:12px 0 0"><button class="more" id="cmoreBtn">Show more</button></p>' : "";
        var b = el("cmoreBtn"); if (b) b.addEventListener("click", function () { b.disabled = true; page(); });
      }).catch(function (err) { if (mine === seq) el("clist").innerHTML = emptyState(err); });
    }
    page();
  }

  // "Find solution": put the issue to Ask, leaving out the company that has it.
  var askPrefill = null;
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-find]");
    if (!b) return;
    askPrefill = { question: b.getAttribute("data-find"), exclude: b.getAttribute("data-co"), name: b.getAttribute("data-co-name") };
    location.hash = "#/ask";
  });

  /* ------------------------------------------------------------------ Explore */
  var KINDS = ["problem", "solution", "win", "offer", "ask", "equipment", "news", "commitment"];

  function explore() {
    var mine = ++seq;
    var offset = 0;
    view.innerHTML = "<h1>Explore</h1>" +
      '<p class="lede">Every note from every program, newest first. Filter by type, topic, company or meeting.</p>' +
      '<div class="card" style="margin-top:32px;padding:26px 28px"><div class="fields">' +
      '<div style="grid-column:span 2"><label class="field" for="eq">Search</label><input id="eq" placeholder="Words in the note or company" style="width:100%"></div>' +
      '<div id="exSrc">' + sourceSelect("ep", "Program") + "</div>" +
      '<div><label class="field" for="ek">Type</label><select id="ek"><option value="">All types</option>' + KINDS.map(function (k) { return '<option value="' + k + '">' + PI.kindLabel[k] + "</option>"; }).join("") + "</select></div>" +
      '<div><label class="field" for="et">Topic</label><select id="et"><option value="">All topics</option></select></div>' +
      '<div><label class="field" for="ei">Industry</label><select id="ei"><option value="">All industries</option></select></div>' +
      '<div><label class="field" for="es">Member status</label><select id="es"><option value="">All</option><option value="Active">Member</option><option value="Inactive">Former member</option><option value="Non-member">Not a member</option></select></div>' +
      '<div><label class="field" for="ee">Event</label><select id="ee"><option value="">All events</option></select></div>' +
      '<div><label class="field" for="ed">When</label><select id="ed"><option value="">Any time</option><option value="30">Last 30 days</option><option value="60">Last 60 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select></div>' +
      '</div><div class="row" style="margin-top:18px;gap:12px 26px"><label class="chk"><input type="checkbox" id="ex"> Exact dates only</label>' +
      '<label class="chk"><input type="checkbox" id="in"> Include Conexus board and internal notes</label>' +
      '<button class="link" id="reset" style="margin-left:auto">Reset filters</button></div></div><div id="results"></div>';

    function qs(withOffset) {
      var p = [];
      function add(k, v) { if (v) p.push(k + "=" + encodeURIComponent(v)); }
      add("q", el("eq").value.trim()); add("kind", el("ek").value); add("topic", el("et").value); add("industry", el("ei").value);
      add("status", el("es").value); add("eventType", el("ee").value); add("days", el("ed").value);
      if (el("ex").checked) p.push("exact=1");
      if (el("in").checked) p.push("internal=1");
      p.push("sort=date");
      if (chosenList().length) add("source", chosenList().join("|"));
      p.push("limit=25"); if (withOffset) p.push("offset=" + offset);
      return p.join("&");
    }
    function fillFacets(f) {
      function opts(id, list, all) {
        var cur = el(id).value;
        el(id).innerHTML = '<option value="">' + all + "</option>" + list.map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>";
        }).join("");
        el(id).value = cur;
      }
      opts("et", f.topic, "All topics"); opts("ei", f.industry, "All industries"); opts("ee", f.eventType, "All events");
    }
    function load(append) {
      if (!append) offset = 0;
      PI.api("insights?" + qs(true)).then(function (r) {
        if (mine !== seq) return;
        if (!state.explore.facets) state.explore.facets = r.facets;
        if (el("et").options.length === 1) fillFacets(state.explore.facets);
        if (!append) el("results").innerHTML = '<p class="secsub" style="margin:26px 0 0"><b style="color:var(--navy)" id="count"></b></p><div class="card" style="margin-top:12px" id="rows"></div><div id="moreWrap"></div>';
        el("count").textContent = r.total + " note" + (r.total === 1 ? "" : "s");
        var items = r.items.map(function (i) { return PI.insightCard(i, { action: isIssue(i) ? findButton(i, i.company && i.company.id) : "" }); }).join("");
        el("rows").insertAdjacentHTML("beforeend", items || (append ? "" : '<div class="empty">Nothing matches those filters.</div>'));
        var hasMore = offset + r.items.length < r.total;
        el("moreWrap").innerHTML = hasMore ? '<p style="margin:22px 0 0"><button class="more" id="moreBtn">Show more</button></p>' : "";
        if (hasMore) el("moreBtn").addEventListener("click", function () { offset += 25; load(true); });
      }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
    }
    function wireSource() { el("ep").addEventListener("change", function (e) { chosen = e.target.value; load(false); }); }
    wireSource();
    loadSources().then(function () { if (mine === seq) { el("exSrc").innerHTML = sourceSelect("ep", "Program"); wireSource(); } }).catch(function () {});
    var t;
    el("eq").addEventListener("input", function () { clearTimeout(t); t = setTimeout(function () { load(false); }, 250); });
    ["ek", "et", "ei", "es", "ee", "ed", "ex", "in"].forEach(function (id) { el(id).addEventListener("change", function () { load(false); }); });
    el("reset").addEventListener("click", function () { chosen = ""; explore(); });
    load(false);
  }

  /* ------------------------------------------------------------------ router */
  function route() {
    var h = location.hash.replace(/^#\/?/, "") || "home";
    var parts = h.split("/");
    var name = parts[0];
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {
      var on = a.getAttribute("data-r") === (name === "company" ? "companies" : (name === "program" || name === "meeting") ? "programs" : name);
      a.classList.toggle("on", on);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (name === "programs") programs();
    else if (name === "program" && parts[1]) program(decodeURIComponent(parts[1]));
    else if (name === "meeting" && parts[2]) meeting(decodeURIComponent(parts[1]), decodeURIComponent(parts[2]));
    else if (name === "ask") ask();
    else if (name === "companies") companies();
    else if (name === "company" && parts[1]) company(decodeURIComponent(parts[1]), parts[2] || "overview");
    else if (name === "explore") explore();
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
