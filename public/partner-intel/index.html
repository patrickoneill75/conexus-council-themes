<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Intelligence — Connector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307214e'/%3E%3Ccircle cx='11' cy='16' r='4' fill='white'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23fbae40'/%3E%3Ccircle cx='22' cy='22' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/partner-intel/pi.css">
<style>html { visibility:hidden; }</style>
</head>
<body>
<header class="appbar">
  <div class="in">
    <div class="appname">Partner Intelligence</div>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/home" data-r="home">Home</a>
      <a href="#/programs" data-r="programs">Programs</a>
      <a href="#/companies" data-r="companies">Companies</a>
      <a href="#/ask" data-r="ask">Ask</a>
      <a href="#/explore" data-r="explore">Explore</a>
    </nav>
    <div class="tools">
      <span id="whoami"></span>
      <a href="/partner-intel/control-panel/">Control panel</a>
      <button class="link" id="signOut">Sign out</button>
    </div>
  </div>
</header>
<div class="wrap">
  <main id="view"></main>
</div>

<script src="/partner-intel/pi.js"></script>
<script>
(function () {
  "use strict";
  if (!window.PI) return;
  document.documentElement.style.visibility = "visible";
  var el = function (id) { return document.getElementById(id); };
  var esc = PI.esc;
  var view = el("view");
  el("signOut").addEventListener("click", PI.signOut);
  PI.whoami(el("whoami"));

  var state = { days: 90, exact: false, membersOnly: false, programDays: 0, explore: { facets: null },
                sources: {}, sourceList: null };
  var chosen = {}; // source folders switched on; shared by Home, Ask and Explore

  function loadSources() {
    return state.sourceList ? Promise.resolve(state.sourceList)
      : PI.api("facets").then(function (r) { state.sourceList = r.sources; return r.sources; });
  }
  function chosenList() { return Object.keys(chosen).filter(function (k) { return chosen[k]; }); }
  function sourceParam() { var l = chosenList(); return l.length ? "&source=" + encodeURIComponent(l.join("|")) : ""; }
  function chipsHtml() {
    if (!state.sourceList || !state.sourceList.length) return "";
    return '<div class="row small" style="margin-bottom:12px"><span class="muted">Source folder</span><div class="chips" style="margin-top:0" data-chips>' +
      state.sourceList.map(function (s) {
        return '<button class="chip btn' + (chosen[s.value] ? " on" : "") + '" data-s="' + esc(s.value) + '">' + esc(s.value) + ' <span style="opacity:.7">' + s.count + "</span></button>";
      }).join("") + "</div>" + (chosenList().length ? '<button class="link small" data-clear>Clear</button>' : "") + "</div>";
  }
  function wireChips(root, onChange) {
    Array.prototype.forEach.call(root.querySelectorAll("[data-chips] button"), function (b) {
      b.addEventListener("click", function () { var k = b.getAttribute("data-s"); chosen[k] = !chosen[k]; onChange(); });
    });
    var clear = root.querySelector("[data-clear]");
    if (clear) clear.addEventListener("click", function () { chosen = {}; onChange(); });
  }
  var seq = 0; // drops the answer to a request that a newer navigation has made stale

  function emptyState(err) {
    if (err && err.body && err.body.empty) {
      return '<div class="card"><div class="empty"><b>There is no data yet.</b><br>Open the ' +
        '<a href="/partner-intel/control-panel/">control panel</a>, choose the Box folder, and run the first scan.</div></div>';
    }
    return '<div class="card"><div class="msg err">' + esc(err.message || "Something went wrong.") + "</div></div>";
  }

  function loading(text) { return '<div class="card"><span class="spinner"></span>' + esc(text) + "</div>"; }

  /* ------------------------------------------------------------------ Trending topics
     Used by Home and by every program. The page appears at once; the Claude-written bullets
     fill in after, because writing them takes a few seconds the first time. */
  var PAGE = 5;
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /** "5 companies across 6 meetings." Counts only; the companies are named in the examples. */
  function topicMeta(t) {
    return (t.companyCount ? plural(t.companyCount, "company", "companies") + " across " : "") +
      plural(t.meetingCount, "meeting", "meetings") + ".";
  }

  /** A numbered topic. Its heading is a button that opens the Claude-written summary; opening
   * one topic closes the others in the list. hl is the heading level for the page. */
  function topicCard(t, n, hl, open) {
    hl = hl || "h3";
    return '<section class="topic" data-topic="' + esc(t.topic) + '"><' + hl + ' class="thead-h"><button type="button" class="thead" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="bignum">' + (n + 1) + '</span><span class="ttxt"><span class="tname">' + esc(t.label) + '</span><span class="tmeta">' + esc(topicMeta(t)) + "</span></span>" +
      '<span class="tgl" aria-hidden="true">' + (open ? "Hide" : "Show") + "</span></button></" + hl + ">" +
      '<div class="tbody" data-body' + (open ? "" : " hidden") + ">" + (t.summary ? bulletsHtml(t.summary) : '<div class="pending"><span class="spinner"></span>Writing the summary…</div>') + "</div></section>";
  }
  function setOpen(card, open) {
    var btn = card.querySelector(".thead");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.querySelector(".tgl").textContent = open ? "Hide" : "Show";
    card.querySelector("[data-body]").hidden = !open;
  }
  // Opening a topic closes whichever topic in the same list was open.
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest(".topic .thead");
    if (!btn) return;
    var card = btn.closest(".topic");
    var opening = btn.getAttribute("aria-expanded") !== "true";
    Array.prototype.forEach.call(card.parentNode.querySelectorAll(".topic"), function (c) { if (c !== card) setOpen(c, false); });
    setOpen(card, opening);
  });

  /** A topic's summary points on a shaded block. The plus button, or "See examples" after the
   * text, opens the notes behind a point; both turn to their closing form while it is open. */
  function bulletsHtml(summary) {
    return '<div class="band"><ul class="bullets">' + summary.bullets.map(function (b) {
      return '<li class="bpt"><button type="button" class="pm" data-pt aria-expanded="false" aria-label="Show examples">+</button>' +
        '<div><span class="txt">' + esc(b.text) + '</span><button type="button" class="see" data-pt>See examples</button>' +
        '<div class="examples" hidden>' + b.examples.map(function (i) { return PI.insightCard(i); }).join("") + "</div></div></li>";
    }).join("") + "</ul></div>";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-pt]");
    if (!b) return;
    var li = b.closest(".bpt");
    var ex = li.querySelector(".examples");
    ex.hidden = !ex.hidden;
    var pm = li.querySelector(".pm");
    pm.textContent = ex.hidden ? "+" : "\u2212";
    pm.setAttribute("aria-expanded", ex.hidden ? "false" : "true");
    pm.setAttribute("aria-label", ex.hidden ? "Show examples" : "Hide examples");
    li.querySelector(".see").textContent = ex.hidden ? "See examples" : "Hide examples";
  });

  function fallbackHtml(t, note) {
    return (note ? '<p class="small muted" style="margin:10px 0 0">' + esc(note) + "</p>" : "") +
      (t.examples && t.examples.length ? '<details class="src"><summary>Examples</summary>' + t.examples.map(function (i) { return PI.insightCard(i); }).join("") + "</details>" : "");
  }

  /** Cards for t[from..to), then the summaries the page does not have yet. scope is the filter
   * set the topics were ranked under; the server recomputes the evidence from it. */
  function showTopics(box, trending, from, to, scope, mine, hl) {
    var chunk = trending.slice(from, to);
    box.insertAdjacentHTML("beforeend", chunk.map(function (t, k) { return topicCard(t, from + k, hl, from + k === 0); }).join(""));
    var need = chunk.filter(function (t) { return !t.summary; });
    if (!need.length) return;
    // Wait a moment before asking for summaries. Someone clicking through windows and filters
    // would otherwise start a paid Claude call for every view they pass through.
    setTimeout(function () { if (mine === seq) writeSummaries(box, need, scope, mine); }, SUMMARY_DELAY_MS);
  }

  var SUMMARY_DELAY_MS = 700;

  function writeSummaries(box, need, scope, mine) {
    PI.post("summarize", Object.assign({}, scope, { topics: need.map(function (t) { return t.topic; }) })).then(function (r) {
      if (mine !== seq) return;
      need.forEach(function (t) {
        var body = box.querySelector('.topic[data-topic="' + t.topic + '"] [data-body]');
        if (!body) return;
        body.innerHTML = r.summaries[t.topic] ? bulletsHtml(r.summaries[t.topic])
          : fallbackHtml(t, r.unavailable || "No summary could be written for this topic.");
      });
    }).catch(function (err) {
      if (mine !== seq) return;
      need.forEach(function (t) {
        var body = box.querySelector('.topic[data-topic="' + t.topic + '"] [data-body]');
        if (body) body.innerHTML = fallbackHtml(t, "The summary could not be written: " + err.message);
      });
    });
  }

  function renderTrending(box, trending, scope, mine, hl) {
    if (!trending.length) { box.innerHTML = '<div class="empty">No topics in this selection.</div>'; return; }
    var shown = 0;
    box.innerHTML = '<div class="topics" data-list></div><div data-more></div>';
    var list = box.querySelector("[data-list]"), more = box.querySelector("[data-more]");
    function next() {
      var to = Math.min(trending.length, shown + PAGE);
      showTopics(list, trending, shown, to, scope, mine, hl);
      shown = to;
      var left = Math.min(PAGE, trending.length - shown);
      more.innerHTML = shown < trending.length ? '<div class="row" style="margin-top:36px"><button id="moreTopics">Show ' + plural(left, "more topic", "more topics") + "</button></div>" : "";
      var btn = more.querySelector("#moreTopics");
      if (btn) btn.addEventListener("click", next);
    }
    next();
  }

  /* ------------------------------------------------------------------ Home */
  function home() {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    // Home covers every source folder. Folders are chosen on Ask and Explore, and a program's
    // own page ranks that folder alone.
    PI.api("home?days=" + state.days + (state.exact ? "&exact=1" : "") + (state.membersOnly ? "&status=Active" : "")).then(function (d) {
      if (mine !== seq) return;
      var html = '<h1>Trending topics</h1><p class="lede">What the most partner companies have raised since ' + esc(PI.fmtDate(d.since)) + ".</p>" +
        '<div class="row spread homebar"><div class="seg" id="win" role="group" aria-label="Time window">' + [30, 60, 90].map(function (n) {
          return '<button data-d="' + n + '"' + (state.days === n ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + ">Last " + n + " days</button>";
        }).join("") + "</div>" +
        '<div class="row small" style="gap:20px"><label><input type="checkbox" id="mem"' + (state.membersOnly ? " checked" : "") + "> Members only</label>" +
        '<label><input type="checkbox" id="exact"' + (state.exact ? " checked" : "") + "> Exact dates only</label></div></div>";
      var notes = [];
      if (d.counts.estimatedDates && !state.exact) {
        notes.push(plural(d.counts.estimatedDates, "note", "notes") + " in this window carry no date in the text, so they use the Box upload date.");
      }
      if (d.uncategorized) notes.push(plural(d.uncategorized, "issue", "issues") + " did not fit a topic and are not ranked.");
      html += '<p class="small muted homenote">' + esc(notes.join(" ")) + '</p><div id="trend"></div>';
      view.innerHTML = html;
      renderTrending(el("trend"), d.trending, { days: state.days, exact: state.exact, source: [], status: state.membersOnly ? ["Active"] : [] }, mine, "h2");
      Array.prototype.forEach.call(view.querySelectorAll("#win button"), function (b) {
        b.addEventListener("click", function () { state.days = Number(b.getAttribute("data-d")); home(); });
      });
      el("exact").addEventListener("change", function (e) { state.exact = e.target.checked; home(); });
      el("mem").addEventListener("change", function (e) { state.membersOnly = e.target.checked; home(); });
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /* ------------------------------------------------------------------ Programs */
  var KIND_LABEL = { cohort: "Cohort", company: "Company", meeting: "Meeting" };

  function updateBanner(needs) {
    return needs ? '<div class="banner">Meetings are grouped approximately until the one-time update is applied. Open the <a href="/partner-intel/control-panel/">control panel</a> and use the button at the top. It takes about a minute and uses no Claude.</div>' : "";
  }

  function programs() {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("programs").then(function (r) {
      if (mine !== seq) return;
      view.innerHTML = updateBanner(r.needsUpdate) + "<h2>Programs</h2>" +
        '<p class="sub">Each source folder is a program. Open one for its trending topics and its meetings.</p><div class="pgrid" style="margin-top:14px">' +
        r.programs.map(function (p) {
          return '<a class="pcard" href="#/program/' + encodeURIComponent(p.name) + '"><b>' + esc(p.name) + "</b>" +
            (p.internal ? " " + PI.pill("info", "Conexus internal") : "") +
            '<div class="small muted" style="margin-top:6px">' + p.meetings + " meeting" + (p.meetings === 1 ? "" : "s") + " &middot; " + p.notes + " notes" +
            (p.companies ? " &middot; " + p.companies + " companies" : "") + "</div>" +
            '<div class="small muted">' + (p.last ? "Latest " + esc(PI.fmtDate(p.last)) : "") + "</div></a>";
        }).join("") + "</div>";
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  function meetingCard(program, m) {
    var c = m.counts;
    var parts = [c.issues && c.issues + " issue" + (c.issues === 1 ? "" : "s"), c.solutions && c.solutions + " solution" + (c.solutions === 1 ? "" : "s"),
      c.wins && c.wins + " win" + (c.wins === 1 ? "" : "s"), c.other && c.other + " other"].filter(Boolean).join(" &middot; ");
    return '<a class="mcard" href="#/meeting/' + encodeURIComponent(program) + "/" + encodeURIComponent(m.id) + '">' +
      '<div class="head" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="t">' + esc(m.label) + "</span>" + PI.pill("info", KIND_LABEL[m.kind] || "Meeting") + "</div>" +
      '<div class="small muted" style="margin-top:2px">' + esc(PI.fmtDate(m.date)) + (m.estimated ? " " + PI.pill("est", "estimated date") : "") +
      (m.kind !== "company" && m.companyCount ? " &middot; " + m.companyCount + " compan" + (m.companyCount === 1 ? "y" : "ies") : "") + " &middot; " + parts + "</div>" +
      (m.topics.length ? '<div class="chips">' + m.topics.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + "</div>" : "") + "</a>";
  }

  function program(name) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("program?name=" + encodeURIComponent(name) + "&days=" + state.programDays).then(function (r) {
      if (mine !== seq) return;
      var p = r.program;
      var html = updateBanner(r.needsUpdate) + '<p class="small"><a href="#/programs">&larr; All programs</a></p>' +
        '<div class="row spread"><div><h2 style="font-size:20px">' + esc(p.name) + "</h2>" +
        '<p class="sub">' + p.meetings + " meeting" + (p.meetings === 1 ? "" : "s") + " &middot; " + p.notes + " notes" +
        (p.first ? " &middot; " + esc(PI.fmtDate(p.first)) + " to " + esc(PI.fmtDate(p.last)) : "") + (p.internal ? " &middot; Conexus internal" : "") + "</p></div>" +
        '<div class="seg" id="pwin">' + [[90, "Last 90 days"], [365, "Last year"], [0, "All time"]].map(function (w) {
          return '<button data-d="' + w[0] + '"' + (state.programDays === w[0] ? ' class="on"' : "") + ">" + w[1] + "</button>";
        }).join("") + "</div></div>" +
        '<h2 style="margin-top:22px">Trending topics</h2><p class="sub">The topics raised by the most companies in this program' +
        (state.programDays ? " in the window" : "") + ".</p><div id=\"trend\"></div>" +
        '<h2 style="margin-top:26px">Recent data</h2><p class="sub">Grouped by date, and by cohort, company or meeting. Open one for its issues, solutions and wins.</p>' +
        '<div id="meetings"></div><div id="moreM"></div>';
      view.innerHTML = html;
      renderTrending(el("trend"), r.trending, { days: state.programDays, source: [name] }, mine);
      var shown = 0;
      function more() {
        var to = Math.min(r.meetings.length, shown + 12);
        el("meetings").insertAdjacentHTML("beforeend", r.meetings.slice(shown, to).map(function (m) { return meetingCard(name, m); }).join(""));
        shown = to;
        el("moreM").innerHTML = shown < r.meetings.length ? '<div class="row" style="margin-top:12px"><button id="moreMeet">Show more</button></div>'
          : (r.meetingTotal > r.meetings.length ? '<p class="small muted">Showing the latest ' + r.meetings.length + " of " + r.meetingTotal + ".</p>" : "");
        var b = el("moreMeet"); if (b) b.addEventListener("click", more);
      }
      if (!r.meetings.length) el("meetings").innerHTML = '<div class="empty">No data in this program yet.</div>'; else more();
      Array.prototype.forEach.call(view.querySelectorAll("#pwin button"), function (b) {
        b.addEventListener("click", function () { state.programDays = Number(b.getAttribute("data-d")); program(name); });
      });
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  function meeting(name, id) {
    var mine = ++seq;
    view.innerHTML = loading("Loading…");
    PI.api("meeting?program=" + encodeURIComponent(name) + "&id=" + encodeURIComponent(id)).then(function (r) {
      if (mine !== seq) return;
      var m = r.meeting;
      function section(title, items) {
        return items.length ? '<h2 style="margin-top:22px">' + esc(title) + " (" + items.length + ")</h2>" + items.map(function (i) { return PI.insightCard(i); }).join("") : "";
      }
      view.innerHTML = '<p class="small"><a href="#/program/' + encodeURIComponent(name) + '">&larr; ' + esc(name) + "</a></p>" +
        '<div class="card"><div class="row" style="gap:8px"><h2 style="font-size:20px">' + esc(m.label) + "</h2>" + PI.pill("info", KIND_LABEL[m.kind] || "Meeting") + "</div>" +
        '<p class="sub">' + esc(PI.fmtDate(m.date)) + (m.estimated ? " " + PI.pill("est", "estimated date") : "") +
        (m.companyCount ? " &middot; " + m.companyCount + " compan" + (m.companyCount === 1 ? "y" : "ies") + ": " + m.companies.map(esc).join(", ") : "") + "</p>" +
        '<p class="small muted" style="margin:6px 0 0">From ' + PI.fileLinks(m.files) + "</p></div>" +
        section("Issues", r.issues) + section("Solutions", r.solutions) + section("Wins", r.wins) + section("Other", r.other);
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  /* ------------------------------------------------------------------ Ask */
  function ask() {
    var mine = ++seq;
    view.innerHTML = '<div class="card"><h2>Who can we connect them with?</h2>' +
      '<p class="desc">Describe what the partner needs. The answer lists companies whose own meeting notes show they have solved or offer it, with the evidence.</p>' +
      '<div id="askSrc"></div><textarea id="q" rows="3" maxlength="600" placeholder="A partner is looking for something to help them with an AI-powered quality system. Who can we connect them with?"></textarea>' +
      '<div id="excl"></div><div class="row" style="margin-top:10px"><button class="primary" id="go">Find matches</button><span id="busy"></span></div></div>' +
      '<div id="out"></div><div id="recent"></div>';
    var q = el("q");
    function drawChips() { el("askSrc").innerHTML = chipsHtml(); wireChips(el("askSrc"), drawChips); }
    loadSources().then(function () { if (mine === seq) drawChips(); }).catch(function () {});
    var exclude = null;
    function run() {
      var question = q.value.trim();
      if (question.length < 8) { el("out").innerHTML = '<div class="msg err">Ask a full question, such as what the partner needs.</div>'; return; }
      el("go").disabled = true;
      el("busy").innerHTML = '<span class="spinner"></span>Reading the notes…';
      PI.post("ask", { question: question, sources: chosenList(), exclude: exclude ? exclude.id : "" }).then(function (a) {
        if (mine !== seq) return;
        el("out").innerHTML = renderAnswer(a);
        loadRecent();
      }).catch(function (err) { if (mine === seq) el("out").innerHTML = emptyState(err); })
        .then(function () { if (mine === seq) { el("go").disabled = false; el("busy").innerHTML = ""; } });
    }
    el("go").addEventListener("click", run);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); });
    // Arrived from "Find solution" on a company's issue: ask at once, leaving that company out.
    // Editing the question means a new search, so the exclusion is dropped.
    q.addEventListener("input", function () { if (exclude) { exclude = null; el("excl").innerHTML = ""; } });
    if (askPrefill) {
      var pre = askPrefill; askPrefill = null;
      q.value = pre.question;
      exclude = pre.exclude ? { id: pre.exclude, name: pre.name } : null;
      el("excl").innerHTML = exclude ? '<p class="small muted" style="margin:6px 0 0">Looking for partners other than ' + esc((exclude.name || "the company with the issue").replace(/\.+$/, "")) + ".</p>" : "";
      run();
    }
    function loadRecent() {
      PI.api("recent-questions").then(function (r) {
        if (mine !== seq || !r.items.length) return;
        el("recent").innerHTML = '<div class="card"><h3>Recent questions</h3>' + r.items.slice(0, 8).map(function (it) {
          return '<div class="small" style="margin-top:8px"><button class="link" data-q="' + esc(it.question) + '">' + esc(it.question) +
            '</button> <span class="muted">' + esc(PI.fmtStamp(it.at)) + "</span></div>";
        }).join("") + "</div>";
        Array.prototype.forEach.call(el("recent").querySelectorAll("button[data-q]"), function (b) {
          b.addEventListener("click", function () { q.value = b.getAttribute("data-q"); run(); });
        });
      }).catch(function () {});
    }
    loadRecent();
  }

  function renderAnswer(a) {
    var html = '<div class="card">';
    if (a.ranking === "keyword") html += '<div class="banner">Ranked by keyword match only. Claude is not set up for this tool yet, so the order and wording are not reviewed.</div>';
    if (a.summary) html += '<p style="margin:0 0 4px"><b>' + esc(a.summary) + "</b></p>";
    html += '<p class="small muted" style="margin:0 0 6px">' + (a.cached ? "Saved answer from " + esc(PI.fmtStamp(a.askedAt)) + ". " : "") +
      "Looked at " + a.considered.insights + " solutions, offers and wins.</p>";
    if (!a.matches.length) html += '<div class="empty">No partner in the notes clearly does this.' +
      (a.peers && a.peers.length ? " Partners working through the same thing are listed below." : "") + "</div>";
    a.matches.forEach(function (m, n) {
      var c = m.company;
      html += '<div class="item"><div class="rank"><div class="n">' + (n + 1) + '</div><div style="flex:1">' +
        '<div class="head"><a class="co" href="#/company/' + encodeURIComponent(c.id) + '">' + esc(c.name) + "</a>" +
        PI.pill(m.strength === "high" ? "good" : m.strength === "medium" ? "medium" : "low", m.strength + " match") +
        PI.pill("info", c.industry) + PI.pill(c.status === "Active" ? "good" : "info", PI.statusLabel[c.status] || c.status) + "</div>" +
        '<div class="detail">' + esc(m.why) + "</div>" +
        (m.caution ? '<div class="caution"><b>Check first:</b> ' + esc(m.caution) + "</div>" : "") +
        (c.contacts && c.contacts.length ? '<div class="small muted">Contacts on file: ' + c.contacts.map(esc).join(", ") + "</div>" : "") +
        '<details class="src"><summary>Evidence (' + m.evidence.length + ")</summary>" +
        m.evidence.map(function (i) { return PI.insightCard(i, { company: false }); }).join("") + "</details>" +
        "</div></div></div>";
    });
    if (a.gaps) html += '<p class="small" style="margin-top:12px"><b>Not covered:</b> ' + esc(a.gaps) + "</p>";
    if (a.searchTerms && a.searchTerms.length) {
      html += '<p class="small muted" style="margin-top:12px">Also searched for: ' + a.searchTerms.map(esc).join(", ") + "</p>";
    }
    html += "</div>";
    // Companies working through the same thing: a peer to compare notes with, not a solution.
    if (a.peers && a.peers.length) {
      html += '<div class="card"><h3>Working through the same thing</h3><p class="desc">Partners whose notes show the same issue, ' +
        "an ask for help with it, or a plan to tackle it. Found by matching words, not ranked by Claude.</p>" +
        a.peers.map(function (p) {
          var c = p.company;
          return '<div class="item"><div class="head"><a class="co" href="#/company/' + encodeURIComponent(c.id) + '">' + esc(c.name) + "</a>" +
            PI.pill("info", c.industry) + PI.pill(c.status === "Active" ? "good" : "info", PI.statusLabel[c.status] || c.status) + "</div>" +
            (c.contacts && c.contacts.length ? '<div class="small muted">Contacts on file: ' + c.contacts.map(esc).join(", ") + "</div>" : "") +
            '<details class="src"><summary>Evidence (' + p.evidence.length + ")</summary>" +
            p.evidence.map(function (i) { return PI.insightCard(i, { company: false }); }).join("") + "</details></div>";
        }).join("") + "</div>";
    }
    return html;
  }

  /* ------------------------------------------------------------------ Companies */
  // Columns of the companies table: [sort key, heading]. Alphabetical by name until a heading is
  // clicked; clicking it again reverses. Kept while the page is open, so Back returns to it.
  var COMPANY_COLS = [["name", "Company"], ["industry", "Industry"], ["status", "Status"], ["insights", "Notes"],
    ["problems", "Issues"], ["solutions", "Solutions"], ["wins", "Wins"], ["last", "Last mentioned"]];
  var companySort = { key: "name", dir: "asc" };

  function companies() {
    var mine = ++seq;
    view.innerHTML = '<div class="card"><div class="fields">' +
      '<div><label class="field" for="cq">Search</label><input id="cq" placeholder="Company name"></div>' +
      '<div><label class="field" for="ci">Industry</label><select id="ci"><option value="">All</option></select></div>' +
      '<div><label class="field" for="cs">Member status</label><select id="cs"><option value="">All</option>' +
      '<option value="Active">Member</option><option value="Inactive">Former member</option><option value="Non-member">Not a member</option></select></div>' +
      '<div style="align-self:end"><label><input type="checkbox" id="cw" checked> Only companies with notes</label></div></div></div>' +
      '<div class="card" id="clist">' + "</div>";
    function load() {
      var qs = "companies?q=" + encodeURIComponent(el("cq").value) + (el("ci").value ? "&industry=" + encodeURIComponent(el("ci").value) : "") +
        (el("cs").value ? "&status=" + encodeURIComponent(el("cs").value) : "") + (el("cw").checked ? "&withInsights=1" : "") +
        "&sort=" + companySort.key + "&dir=" + companySort.dir;
      PI.api(qs).then(function (r) {
        if (mine !== seq) return;
        if (el("ci").options.length === 1) {
          el("ci").innerHTML = '<option value="">All</option>' + r.industries.map(function (i) { return "<option>" + esc(i) + "</option>"; }).join("");
        }
        el("clist").innerHTML = r.items.length ? "<table><thead><tr>" + COMPANY_COLS.map(function (col) {
            var on = companySort.key === col[0];
            return '<th aria-sort="' + (on ? (companySort.dir === "asc" ? "ascending" : "descending") : "none") + '"><button class="sorter' + (on ? " on" : "") +
              '" data-sort="' + col[0] + '">' + col[1] + '<span class="arrow" aria-hidden="true">' + (on ? (companySort.dir === "asc" ? "&#9650;" : "&#9660;") : "") + "</span></button></th>";
          }).join("") + "</tr></thead><tbody>" +
          r.items.map(function (c) {
            return '<tr class="click" data-id="' + esc(c.id) + '"><td><b>' + esc(c.name) + "</b></td><td>" + esc(c.industry) + "</td><td>" +
              esc(PI.statusLabel[c.status] || c.status) + "</td><td>" + c.insights + "</td><td>" + c.problems + "</td><td>" + c.solutions +
              "</td><td>" + c.wins + "</td><td>" + (c.last ? esc(PI.fmtDate(c.last)) : "") + "</td></tr>";
          }).join("") + "</tbody></table>" : '<div class="empty">No companies match.</div>';
        Array.prototype.forEach.call(el("clist").querySelectorAll("tr.click"), function (tr) {
          tr.addEventListener("click", function () { location.hash = "#/company/" + encodeURIComponent(tr.getAttribute("data-id")); });
        });
        Array.prototype.forEach.call(el("clist").querySelectorAll("button.sorter"), function (b) {
          b.addEventListener("click", function () {
            var key = b.getAttribute("data-sort");
            var textual = key === "name" || key === "industry" || key === "status";
            companySort = companySort.key === key ? { key: key, dir: companySort.dir === "asc" ? "desc" : "asc" } : { key: key, dir: textual ? "asc" : "desc" };
            load();
          });
        });
      }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
    }
    var t;
    el("cq").addEventListener("input", function () { clearTimeout(t); t = setTimeout(load, 250); });
    ["ci", "cs", "cw"].forEach(function (id) { el(id).addEventListener("change", load); });
    load();
  }

  /* ------------------------------------------------------------------ Company page */
  // Tabs, in order. Overview, Issues, Solutions and Wins are topic views from company/topics:
  // issues include asks (a company asking for help is stating an issue), solutions include offers
  // and equipment, and the Overview is all three together. Notes lists everything, newest first.
  var COMPANY_TABS = [
    { id: "overview", label: "Overview", list: "all", noun: ["mention", "mentions"],
      rule: "how many issues, solutions and wins the company has in the topic" },
    { id: "issues", label: "Issues", count: "problems", list: "issues", noun: ["issue", "issues"],
      rule: "how many issues the company raised in the topic" },
    { id: "solutions", label: "Solutions", count: "solutions", list: "solutions", noun: ["solution", "solutions"],
      rule: "how many solutions, offers and equipment the company has in the topic" },
    { id: "wins", label: "Wins", count: "wins", list: "wins", noun: ["win", "wins"],
      rule: "how many wins the company reported in the topic" },
    { id: "meetings", label: "Meetings", count: "meetings" },
    { id: "notes", label: "Notes", count: "insights", kinds: "", sub: "Everything recorded about this company, newest first." }
  ];
  var OLD_TABS = { problems: "issues" }; // links saved before the tabs were renamed
  function tabHref(id, tab) { return "#/company/" + encodeURIComponent(id) + (tab && tab !== "overview" ? "/" + tab : ""); }

  /** The question "Find solution" puts to Ask: the issue in its own words, at most 600 characters. */
  function issueQuestion(i) {
    var q = "Who can help with this: " + (i.title || "") + (i.detail ? ". " + i.detail : "");
    return q.length > 600 ? q.slice(0, 597) + "..." : q;
  }
  function findButton(i, companyId) {
    return '<button class="find" data-find="' + esc(issueQuestion(i)) + '" data-co="' + esc(companyId || "") +
      '" data-co-name="' + esc((i.company && i.company.name) || "") + '">Find solution</button>';
  }
  var isIssue = function (i) { return i.kind === "problem" || i.kind === "ask"; };
  /** A row as a note; an issue carries Find solution at the end of its date and source line. */
  function rowCard(i, companyId) {
    return PI.insightCard(i, { company: false, action: isIssue(i) ? findButton(i, companyId) : "" });
  }

  function company(id, tab) {
    var mine = ++seq;
    tab = OLD_TABS[tab] || tab;
    var current = COMPANY_TABS.filter(function (t) { return t.id === tab; })[0] || COMPANY_TABS[0];
    view.innerHTML = loading("Loading…");
    PI.api("company?id=" + encodeURIComponent(id)).then(function (p) {
      if (mine !== seq) return;
      var c = p.company;
      var facts = [c.industry, PI.statusLabel[c.status] || c.status, c.program].filter(Boolean);
      var html = '<div class="cohead"><p class="small" style="margin:0"><a href="#/companies">All companies</a></p>' +
        "<h1>" + esc(c.name) + "</h1>" +
        '<p class="facts">' + facts.map(esc).join(". ") + "." +
        (c.contacts.length ? " Contacts on file: " + c.contacts.map(esc).join(", ") + "." : "") + "</p>" +
        (c.source === "notes" ? '<p class="small muted" style="margin:6px 0 0">This company is in the notes but not on the partner list. Add it in the control panel to give it an industry.</p>' : "") + "</div>" +
        '<nav class="tabs" aria-label="Company sections">' + COMPANY_TABS.map(function (t) {
          return '<a href="' + tabHref(c.id, t.id) + '"' + (t.id === current.id ? ' class="on" aria-current="page"' : "") + ">" + esc(t.label) +
            (t.count ? ' <span class="n">' + p.counts[t.count] + "</span>" : "") + "</a>";
        }).join("") + '</nav><div id="tabBody"></div>';
      view.innerHTML = html;
      var body = el("tabBody");
      if (current.list) {
        topicsTab(body, c, current, mine);
      } else if (current.id === "meetings") {
        body.innerHTML = '<div class="card"><h3>Meetings and source documents</h3><p class="desc">The meetings this company appears in, and the files in Box they came from.</p>' +
          (p.meetings.length ? '<table class="docs"><tbody>' + p.meetings.map(function (m) {
            return "<tr><td class=\"nowrap\">" + esc(PI.fmtDate(m.date)) + (m.estimated ? " " + PI.pill("est", "estimated date") : "") + "</td>" +
              "<td>" + esc(m.label || m.series || m.eventType) + (m.programs.length ? ' <span class="muted small">&middot; ' + esc(m.programs.join(", ")) + "</span>" : "") + "</td>" +
              "<td>" + (PI.fileLinks(m.files) || '<span class="muted">No file</span>') + "</td></tr>";
          }).join("") + "</tbody></table>" : '<div class="empty">No meetings recorded yet.</div>') +
          (p.meetingTotal > p.meetings.length ? '<p class="small muted">Showing the latest ' + p.meetings.length + " of " + p.meetingTotal + ".</p>" : "") + "</div>";
      } else {
        listTab(body, c, current, mine);
      }
    }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
  }

  // Overview, Issues, Solutions and Wins: by topic across all the notes, or the latest source's
  // topics. The choice holds while moving between tabs and companies.
  var topicsMode = "topic";
  function topicsTab(body, c, tab, mine) {
    body.innerHTML = loading("Loading…");
    PI.api("company/topics?id=" + encodeURIComponent(c.id) + "&list=" + tab.list).then(function (r) {
      if (mine !== seq) return;
      if (!r.total) { body.innerHTML = '<div class="empty">No ' + (tab.list === "all" ? "issues, solutions or wins" : tab.noun[1]) + " recorded yet.</div>"; return; }
      body.innerHTML = '<div class="row spread toolbar"><div class="seg" id="pmode" role="group" aria-label="View">' +
        [["topic", "By topic"], ["latest", "Latest source"]].map(function (m) {
          return '<button data-mode="' + m[0] + '">' + m[1] + "</button>";
        }).join("") + '</div><span class="small muted" id="pnote"></span></div><div id="pview"></div>';
      function draw() {
        Array.prototype.forEach.call(el("pmode").querySelectorAll("button"), function (b) {
          var on = b.getAttribute("data-mode") === topicsMode;
          b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        el("pnote").textContent = topicsMode === "latest" ? "Ranked by how often each topic came up in that meeting."
          : "Most mentioned first. Recent notes count more." + (tab.list === "all" || tab.list === "issues" ? " Resolved issues are not counted." : "");
        if (topicsMode === "latest") latestSource(el("pview"), r, tab, c.id); else byTopic(el("pview"), r, tab, c.id);
      }
      el("pmode").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-mode]");
        if (!b) return;
        topicsMode = b.getAttribute("data-mode");
        draw();
      });
      draw();
    }).catch(function (err) { if (mine === seq) body.innerHTML = emptyState(err); });
  }


  /** "7 issues, 5 solutions and 3 wins across 5 meetings. Last raised Oct 5, 2026." */
  function topicSentence(t, inMeeting) {
    var parts = [];
    if (t.issues) parts.push(plural(t.issues, "issue", "issues"));
    if (t.solutions) parts.push(plural(t.solutions, "solution", "solutions"));
    if (t.wins) parts.push(plural(t.wins, "win", "wins"));
    var list = parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : (parts[0] || "");
    var out = [];
    if (list) out.push(list + (inMeeting || !t.meetings ? "" : t.meetings === 1 ? " in 1 meeting" : " across " + t.meetings + " meetings") + ".");
    if (t.resolved) out.push(t.resolved + " resolved.");
    if (!inMeeting && t.last) out.push("Last raised " + PI.fmtDate(t.last) + ".");
    return out.join(" ");
  }

  var COLUMN_SHOWN = 3; // notes per Overview column before "View all"

  /** Numbered topics that open to their notes. On the Overview a topic opens to three columns,
   * each showing its first three notes and a "View all" link for the rest. */
  function topicList(topics, tab, companyId, inMeeting) {
    return topics.map(function (t, n) {
      var inner;
      if (tab.list === "all") {
        inner = '<div class="grid3">' + [["Issues", "issues"], ["Solutions", "solutions"], ["Wins", "wins"]].map(function (col) {
          var rows = t.items.filter(function (i) { return PI.categoryOf(i.kind) === col[1]; });
          var cards = rows.map(function (i) { return rowCard(i, companyId); });
          return '<section><h4 class="colhead">' + col[0] + "</h4>" +
            (rows.length ? cards.slice(0, COLUMN_SHOWN).join("") +
              (rows.length > COLUMN_SHOWN ? '<div hidden data-rest>' + cards.slice(COLUMN_SHOWN).join("") + "</div>" +
                '<p class="colmore"><button class="link" data-show-rest>View all ' + rows.length + " " + col[1] + "</button></p>" : "")
            : '<p class="muted small" style="margin:12px 0 0">None in this topic.</p>') + "</section>";
        }).join("") + "</div>";
      } else {
        inner = t.items.map(function (i) { return rowCard(i, companyId); }).join("");
      }
      return '<details class="ptopic"><summary><span class="rank">' + (n + 1) + '</span><span class="txt"><b>' + esc(t.label) + "</b>" +
        (t.mentions ? "" : PI.pill("good", "All resolved")) +
        '<span class="meta">' + esc(topicSentence(t, inMeeting)) + "</span></span></summary>" +
        '<div class="examples">' + inner + "</div></details>";
    }).join("");
  }
  // "View all 7 issues" under an Overview column shows the rest of that column in place.
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-show-rest]");
    if (!b) return;
    var rest = b.closest("section").querySelector("[data-rest]");
    if (rest) rest.hidden = false;
    b.parentNode.remove();
  });

  function byTopic(box, r, tab, companyId) {
    box.innerHTML = topicList(r.byTopic, tab, companyId, false);
  }

  function latestSource(box, r, tab, companyId) {
    var opts = r.latest.map(function (s, k) {
      return '<option value="' + k + '">' + esc(PI.fmtDate(s.date) + " · " + (s.label || s.eventType || "Meeting") + " (" + s.count + ")") + "</option>";
    }).join("");
    box.innerHTML = (r.latest.length > 1 ? '<div style="max-width:520px;margin:8px 0 20px"><label class="field" for="psrc">Source</label><select id="psrc">' + opts + "</select></div>" : "") +
      '<div id="psrcBody"></div>' +
      (r.sourceTotal > r.latest.length ? '<p class="small muted" style="margin-top:16px">The latest ' + r.latest.length + " of " + r.sourceTotal + " sources are listed. By topic covers them all.</p>" : "");
    function show(k) {
      var s = r.latest[k];
      el("psrcBody").innerHTML = '<div style="margin:8px 0 18px"><h3>' + esc(s.label || s.eventType || "Meeting") + "</h3>" +
        '<p class="small" style="margin:4px 0 0;color:var(--text-secondary)">' + esc(PI.fmtDate(s.date)) + (s.estimated ? " " + PI.pill("est", "estimated date") : "") +
        (s.programs.length ? ". " + esc(s.programs.join(", ")) : "") + "." +
        (s.files.length ? " From " + PI.fileLinks(s.files) : "") + "</p></div>" +
        "<div>" + topicList(s.topics, tab, companyId, true) + "</div>";
    }
    var sel = el("psrc");
    if (sel) sel.addEventListener("change", function () { show(Number(sel.value)); });
    show(0);
  }

  /** A company's full list for one tab, newest first, 50 at a time. */
  function listTab(body, c, tab, mine) {
    var offset = 0;
    body.innerHTML = '<p class="sub" style="margin:4px 0 12px">' + esc(tab.sub) + '</p><div id="clist"></div><div id="cmore"></div>';
    function page() {
      return PI.api("insights?company=" + encodeURIComponent(c.id) + (tab.kinds ? "&kind=" + encodeURIComponent(tab.kinds) : "") +
        "&sort=date&limit=50&offset=" + offset).then(function (r) {
        if (mine !== seq) return;
        if (!r.total) { el("clist").innerHTML = '<div class="empty">None recorded yet.</div>'; return; }
        // Every issue carries a Find solution button, on Notes as on the topic tabs.
        el("clist").insertAdjacentHTML("beforeend", r.items.map(function (i) { return rowCard(i, c.id); }).join(""));
        offset += r.items.length;
        el("cmore").innerHTML = offset < r.total ? '<div class="row" style="margin-top:12px"><button id="cmoreBtn">Show more (' + (r.total - offset) + " left)</button></div>" : "";
        var b = el("cmoreBtn"); if (b) b.addEventListener("click", function () { b.disabled = true; page(); });
      }).catch(function (err) { if (mine === seq) el("clist").innerHTML = emptyState(err); });
    }
    page();
  }

  // "Find solution": put the issue to Ask, leaving out the company that has it.
  var askPrefill = null;
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-find]");
    if (!b) return;
    askPrefill = { question: b.getAttribute("data-find"), exclude: b.getAttribute("data-co"), name: b.getAttribute("data-co-name") };
    location.hash = "#/ask";
  });

  /* ------------------------------------------------------------------ Explore */
  var KINDS = ["problem", "solution", "win", "offer", "ask", "equipment", "news", "commitment"];

  function explore() {
    var mine = ++seq;
    var offset = 0;
    view.innerHTML = '<div class="card"><div id="exSrc"></div><div class="fields">' +
      '<div><label class="field" for="eq">Search</label><input id="eq" placeholder="Words in the note or company"></div>' +
      '<div><label class="field" for="ek">Type</label><select id="ek"><option value="">All types</option>' + KINDS.map(function (k) { return '<option value="' + k + '">' + PI.kindLabel[k] + "</option>"; }).join("") + "</select></div>" +
      '<div><label class="field" for="et">Topic</label><select id="et"><option value="">All topics</option></select></div>' +
      '<div><label class="field" for="ei">Industry</label><select id="ei"><option value="">All industries</option></select></div>' +
      '<div><label class="field" for="es">Member status</label><select id="es"><option value="">All</option><option value="Active">Member</option><option value="Inactive">Former member</option><option value="Non-member">Not a member</option></select></div>' +
      '<div><label class="field" for="ee">Event</label><select id="ee"><option value="">All events</option></select></div>' +
      '<div><label class="field" for="ed">When</label><select id="ed"><option value="">Any time</option><option value="30">Last 30 days</option><option value="60">Last 60 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select></div>' +
      '</div><div class="row small" style="margin-top:12px"><label><input type="checkbox" id="ex"> Exact dates only</label>' +
      '<label><input type="checkbox" id="in"> Include Conexus board and internal notes</label>' +
      '<button class="tiny" id="reset">Reset</button></div></div><div id="results"></div>';

    function qs(withOffset) {
      var p = [];
      function add(k, v) { if (v) p.push(k + "=" + encodeURIComponent(v)); }
      add("q", el("eq").value.trim()); add("kind", el("ek").value); add("topic", el("et").value); add("industry", el("ei").value);
      add("status", el("es").value); add("eventType", el("ee").value); add("days", el("ed").value);
      if (el("ex").checked) p.push("exact=1");
      if (el("in").checked) p.push("internal=1");
      p.push("sort=date");
      if (chosenList().length) add("source", chosenList().join("|"));
      p.push("limit=25"); if (withOffset) p.push("offset=" + offset);
      return p.join("&");
    }
    function fillFacets(f) {
      function opts(id, list, all) {
        var cur = el(id).value;
        el(id).innerHTML = '<option value="">' + all + "</option>" + list.map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + " (" + o.count + ")</option>";
        }).join("");
        el(id).value = cur;
      }
      opts("et", f.topic, "All topics"); opts("ei", f.industry, "All industries"); opts("ee", f.eventType, "All events");
    }
    function load(append) {
      if (!append) offset = 0;
      PI.api("insights?" + qs(true)).then(function (r) {
        if (mine !== seq) return;
        if (!state.explore.facets) { state.explore.facets = r.facets; fillFacets(r.facets); }
        if (!append) el("results").innerHTML = '<p class="small muted" id="count"></p><div id="rows"></div><div id="moreWrap"></div>';
        el("count").textContent = r.total + " result" + (r.total === 1 ? "" : "s");
        var items = r.items.map(function (i) { return PI.insightCard(i); }).join("");
        el("rows").insertAdjacentHTML("beforeend", items || (append ? "" : '<div class="card empty">Nothing matches those filters.</div>'));
        var hasMore = offset + r.items.length < r.total;
        el("moreWrap").innerHTML = hasMore ? '<div class="row" style="margin-top:12px"><button id="moreBtn">Show more</button></div>' : "";
        if (hasMore) el("moreBtn").addEventListener("click", function () { offset += 25; load(true); });
      }).catch(function (err) { if (mine === seq) view.innerHTML = emptyState(err); });
    }
    function drawChips() { el("exSrc").innerHTML = chipsHtml(); wireChips(el("exSrc"), function () { drawChips(); load(false); }); }
    loadSources().then(function () { if (mine === seq) drawChips(); }).catch(function () {});
    var t;
    el("eq").addEventListener("input", function () { clearTimeout(t); t = setTimeout(function () { load(false); }, 250); });
    ["ek", "et", "ei", "es", "ee", "ed", "ex", "in"].forEach(function (id) { el(id).addEventListener("change", function () { load(false); }); });
    el("reset").addEventListener("click", explore);
    load(false);
  }

  /* ------------------------------------------------------------------ router */
  function route() {
    var h = location.hash.replace(/^#\/?/, "") || "home";
    var parts = h.split("/");
    var name = parts[0];
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {
      var on = a.getAttribute("data-r") === (name === "company" ? "companies" : (name === "program" || name === "meeting") ? "programs" : name);
      a.classList.toggle("on", on);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (name === "programs") programs();
    else if (name === "program" && parts[1]) program(decodeURIComponent(parts[1]));
    else if (name === "meeting" && parts[2]) meeting(decodeURIComponent(parts[1]), decodeURIComponent(parts[2]));
    else if (name === "ask") ask();
    else if (name === "companies") companies();
    else if (name === "company" && parts[1]) company(decodeURIComponent(parts[1]), parts[2] || "overview");
    else if (name === "explore") explore();
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
