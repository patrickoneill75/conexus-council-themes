<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connector: Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<script src="/apps.js"></script>
<style>
  :root {
    color-scheme: light;
    --navy:#07214E; --blue:#325EAE; --page:#ffffff; --text:#16202B; --muted:#4A5663;
    --rule:#E1E2E9; --btn-border:#C9CDD8; --soft:#F3F5F9; --bar-text:#C9D3E3;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --navy:#E6ECF7; --blue:#6E95D8; --page:#0F1520; --text:#E4E8EF; --muted:#A3AEBD;
    --rule:#273244; --btn-border:#3A475C; --soft:#18202D; --bar-text:#C9D3E3;
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text);
         font:15px/1.5 Aptos,"Segoe UI",Arial,sans-serif; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .appbar { background:#07214E; color:#fff; }
  .appbar .in { max-width:1080px; margin:0 auto; padding:0 32px; min-height:56px;
                display:flex; flex-wrap:wrap; align-items:center; gap:0 28px; }
  .brand { font-size:15px; font-weight:600; flex:1 1 auto; padding:12px 0; }
  .who { display:flex; flex-wrap:wrap; align-items:center; gap:16px; font-size:13px;
         color:var(--bar-text); padding:8px 0; }
  .who a, .who button { color:var(--bar-text); background:none; border:0; padding:0;
                        font:inherit; cursor:pointer; }
  .who a:hover, .who button:hover { color:#fff; text-decoration:underline; }
  main { max-width:1080px; margin:0 auto; padding:40px 32px 96px; }
  h1 { margin:0; font-size:34px; line-height:1.15; font-weight:600; color:var(--navy);
       letter-spacing:-0.01em; }
  .lede { margin:8px 0 0; font-size:15px; color:var(--muted); }
  .apps { margin-top:32px; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 32px;
         align-items:center; padding:22px 0; border-top:1px solid var(--rule); }
  .app:last-child { border-bottom:1px solid var(--rule); }
  .app h2 { margin:0; font-size:18px; line-height:1.3; font-weight:600; color:var(--navy); }
  .app p { margin:6px 0 0; font-size:14px; line-height:1.55; color:var(--muted); max-width:640px; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; }
  .acts a { display:inline-block; border-radius:4px; padding:7px 14px; font-size:13.5px;
            font-weight:600; text-decoration:none; }
  .acts a.open { background:#325EAE; border:1px solid #325EAE; color:#fff; padding:7px 16px; }
  .acts a.open:hover { background:#07214E; border-color:#07214E; }
  .acts a.cp { background:var(--page); border:1px solid var(--btn-border); color:var(--navy); }
  .acts a.cp:hover { background:var(--soft); }
  @media (max-width:760px) {
    .appbar .in, main { padding-left:16px; padding-right:16px; }
    main { padding-top:28px; }
    h1 { font-size:28px; }
    .app { grid-template-columns:minmax(0,1fr); }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="in">
    <div class="brand">Connector</div>
    <div class="who">
      <span id="whoami"></span>
      <a href="/admin/settings.html" id="settingsLink" hidden>Settings</a>
      <button type="button" id="signOutAllBtn">Sign out everywhere</button>
      <button type="button" id="signOutBtn">Sign out</button>
    </div>
  </div>
</header>

<main>
  <h1>Tools</h1>
  <p class="lede">The Conexus Indiana tools you can use, including ones not shown publicly.</p>
  <div class="apps" id="grid"><p class="lede">Loading…</p></div>
</main>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var token = null;
  try { token = sessionStorage.getItem("beta-token"); } catch (e) {}
  if (!token) { window.location.href = "/admin/login.html?next=" + encodeURIComponent(location.pathname + location.search + location.hash); return; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function signOut() {
    try { sessionStorage.removeItem("beta-token"); } catch (e) {}
    window.location.href = "/admin/login.html?next=" + encodeURIComponent(location.pathname + location.search + location.hash);
  }
  el("signOutBtn").addEventListener("click", signOut);
  // Ends this person's sessions on every device, this one included (POST /api/beta/sign-out-everywhere).
  el("signOutAllBtn").addEventListener("click", function () {
    if (!window.confirm("Sign out of Connector on every device, including this one?")) return;
    fetch("/api/beta/sign-out-everywhere", {
      method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: "{}",
    }).then(signOut, signOut);
  });

  function canUse(me, id) { return me.role === "admin" || (me.apps || []).indexOf(id) >= 0; }
  function canAdmin(me, id) { return me.role === "admin" || (me.appAdmin || []).indexOf(id) >= 0; }

  fetch("/api/beta/me", { headers: { authorization: "Bearer " + token } })
    .then(function (r) { if (!r.ok) throw new Error("not signed in"); return r.json(); })
    .then(function (me) {
      el("whoami").textContent = "Signed in as " + (me.username || me.email);
      el("settingsLink").hidden = me.role !== "admin";
      render(me);
    })
    .catch(signOut);

  // Lists every app this person can use, whatever its visibility tier, and a control panel link
  // only for the apps they admin. An overall admin sees everything. The visibility tier only
  // affects the public grid at the site root (see public/index.html) and, for "admin-only", who
  // may open the app's own base page.
  function render(me) {
    var mine = APPS.filter(function (app) { return canUse(me, app.id) || canAdmin(me, app.id); });
    if (!mine.length) {
      el("grid").innerHTML = '<p class="lede">You don\'t have access to any tools yet. Ask an admin to give you access.</p>';
      return;
    }
    el("grid").innerHTML = mine.map(function (app) {
      var links = (canUse(me, app.id) ? '<a class="open" href="' + esc(app.baseUrl) + '">Open</a>' : "") +
        (canAdmin(me, app.id) ? '<a class="cp" href="' + esc(app.controlPanelUrl) + '">Control panel</a>' : "");
      return '<div class="app"><div>' +
        "<h2>" + esc(app.name) + "</h2>" +
        "<p>" + esc(app.description || "") + "</p>" +
        '</div><div class="acts">' + links + "</div></div>";
    }).join("");
  }
})();
</script>
</body>
</html>
