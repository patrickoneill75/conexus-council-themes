<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini App Platform</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">

<!-- =====================================================================
     MINI_APPS — the one thing you edit by hand to add a new tool to the grid.
     Each entry is a card. publicUrl/adminUrl are optional -- omit whichever a mini
     app doesn't have (e.g. a tool with no public-facing page yet, or one with no
     separate admin surface). A brand-new mini app's own routes, secrets, and pages
     live wherever it makes sense in the repo -- this file only needs an entry
     pointing at them once they exist.
     ===================================================================== -->
<script>
const MINI_APPS = [
  {
    id: "council-survey",
    name: "Council Survey Dashboard",
    description: "Council Meeting theme extraction (Claude) and quant benchmarking, " +
      "built from each quarter's post-meeting survey export.",
    publicUrl: "/index.html",
    adminUrl: "/admin.html"
  },
  {
    id: "consensus",
    name: "Consensus",
    description: "Chatbot-style surveys with Claude-generated follow-up questions, " +
      "analyzed into prioritized themes once responses are in. No single public URL -- " +
      "each survey gets its own respondent link from the admin page.",
    adminUrl: "/consensus/index.html"
  },
  {
    id: "pcn-issue-map",
    name: "PCN Issue Map",
    description: "Extracts causal statements from PCN meeting notes/transcripts into an " +
      "accumulating, evidence-traceable map of how members believe their problems " +
      "connect. Early build -- Box connection and control panel only so far, no " +
      "extraction pipeline yet.",
    adminUrl: "/pcn/index.html"
  }
];
</script>

<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --border:rgba(11,11,11,0.10); --wash:rgba(11,11,11,0.04);
    --accent:#2a78d6;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --border:rgba(255,255,255,0.10); --wash:rgba(255,255,255,0.06);
    --accent:#3987e5;
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text-primary);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:32px 20px 64px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px;
           flex-wrap:wrap; margin-bottom:26px; }
  h1 { font-size:21px; font-weight:650; margin:0; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:13px; margin:4px 0 0; }
  .who { display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text-secondary); }
  a.link, button.link { color:var(--accent); background:none; border:0; padding:0;
                         font:inherit; cursor:pointer; text-decoration:none; }
  a.link:hover, button.link:hover { text-decoration:underline; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:12px;
          padding:20px; display:flex; flex-direction:column; }
  .card h3 { margin:0 0 8px; font-size:15px; }
  .card p { margin:0 0 16px; font-size:12.5px; color:var(--text-secondary); flex:1; }
  .card .row { display:flex; gap:8px; flex-wrap:wrap; }
  .card a.btn { font:inherit; font-size:12.5px; font-weight:600; border-radius:8px;
                border:1px solid var(--border); padding:8px 12px; text-decoration:none;
                color:var(--text-primary); background:var(--page); }
  .card a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .add-card { border:1px dashed var(--border); border-radius:12px; padding:20px;
              display:flex; align-items:center; justify-content:center; text-align:center;
              color:var(--text-muted); font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mini App Platform</h1>
      <p class="sub">Every vibe-coded tool, one grid. Add the next one to MINI_APPS.</p>
    </div>
    <div class="who">
      <span id="whoami"></span>
      <a class="link" href="/beta/admins.html">Manage admins</a>
      <button type="button" class="link" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var token = null;
  try { token = sessionStorage.getItem("beta-token"); } catch (e) {}
  if (!token) { window.location.href = "/beta/login.html"; return; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function signOut() {
    try { sessionStorage.removeItem("beta-token"); } catch (e) {}
    window.location.href = "/beta/login.html";
  }
  el("signOutBtn").addEventListener("click", signOut);

  fetch("/api/beta/me", { headers: { authorization: "Bearer " + token } })
    .then(function (r) { if (!r.ok) throw new Error("not signed in"); return r.json(); })
    .then(function (me) {
      el("whoami").textContent = "Signed in as " + (me.username || me.email);
    })
    .catch(signOut);

  el("grid").innerHTML = MINI_APPS.map(function (app) {
    var links = "";
    if (app.publicUrl) links += '<a class="btn primary" href="' + esc(app.publicUrl) + '">Open dashboard</a>';
    if (app.adminUrl) links += '<a class="btn" href="' + esc(app.adminUrl) + '">Control panel</a>';
    return '<div class="card">' +
      "<h3>" + esc(app.name) + "</h3>" +
      "<p>" + esc(app.description || "") + "</p>" +
      '<div class="row">' + links + "</div>" +
      "</div>";
  }).join("") + '<div class="add-card">Add the next mini app to MINI_APPS<br>in public/beta/index.html</div>';
})();
</script>
</body>
</html>
